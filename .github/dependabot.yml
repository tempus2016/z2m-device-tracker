version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # Don't bump onto a release that is hours old — a freshly published action
    # version is the one most likely to be yanked or compromised.
    cooldown:
      default-days: 7
    # codeql-action's init and analyze steps must run the same version, so bump them in one PR.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  # The app's Python packages are pinned in z2m_tracker/Dockerfile and its base image in
  # z2m_tracker/build.yaml. Dependabot cannot read either, so those are bumped by hand.

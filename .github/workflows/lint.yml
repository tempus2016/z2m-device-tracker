name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.3"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The app's base image (z2m_tracker/build.yaml) runs 3.13.
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==${RUFF_VERSION}"

      - name: Run ruff
        run: ruff check custom_components z2m_tracker

      - name: Check formatting
        run: ruff format --check custom_components z2m_tracker

      - name: Compile every module
        # Catches syntax that ruff's target version allows but the runtime does not.
        run: python -m compileall -q custom_components z2m_tracker/app

name: Community ratings

# Rebuilds z2m_tracker/app/community_ratings.json from the rating issues once a week and,
# if anything changed, opens (or updates) one pull request on the branch below. Nothing is
# merged automatically. Once merged, apps that fetch the ratings (the default) pick the new
# file up within a day; the rest get it with the next release.
#
# Needs "Allow GitHub Actions to create and approve pull requests" switched on under
# Settings > Actions > General. GitHub creates the CI runs for a pull request opened
# with GITHUB_TOKEN but holds them until a maintainer presses "Approve workflows to
# run" on the pull request; merge once they pass.

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Rebuild from rating issues
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      BRANCH: automation/community-ratings
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rebuild the ratings
        id: build
        run: |
          summary="$(python3 scripts/community_ratings.py build)"
          echo "${summary}"
          echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet -- z2m_tracker/app/community_ratings.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update the pull request
        if: steps.build.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.build.outputs.summary }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${BRANCH}"
          git add z2m_tracker/app/community_ratings.json
          git commit -m "Update the community ratings" -m "${SUMMARY}"
          git push --force origin "${BRANCH}"
          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "${BRANCH}" --base "${GITHUB_REF_NAME}" \
              --title "Update the community ratings" \
              --body "Weekly rebuild of \`z2m_tracker/app/community_ratings.json\` from the [rating issues](https://github.com/${GITHUB_REPOSITORY}/issues?q=label%3Arating). ${SUMMARY}. CI waits for approval: press **Approve workflows to run** below, and merge once it passes."
          fi

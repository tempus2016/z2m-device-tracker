<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zigbee Tracker</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --card: #fff; --text: #212121; --muted: #616161; --line: #d0d0d0; --accent: #03a9f4; --error: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9e9e9e; --line: #3a3a3a; --accent: #4fc3f7; --error: #ef9a9a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  p { margin: 0 0 16px; color: var(--muted); }
  .note { color: var(--error); }
  label { display: block; margin-bottom: 6px; font-weight: 500; }
  input { width: 100%; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { margin-top: 16px; width: 100%; padding: 10px 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<main>
  <h1>Zigbee Tracker</h1>
  <p>Enter the web UI password (UI_PASSWORD) to continue.</p>
  {{note}}
  <form method="post" action="login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus{{disabled}}>
    <button type="submit"{{disabled}}>Sign in</button>
  </form>
</main>
</body>
</html>

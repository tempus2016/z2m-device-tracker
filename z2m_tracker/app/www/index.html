    // 4. rooms with battery devices but no router
    const areas = {};
    devs.forEach((d) => { if (!d.area) return; const a = (areas[d.area] ||= { routers: 0, ends: [], weak: 0 }); if (d.type === "Router" && statusOf(d) === "active") a.routers++; if (d.type === "EndDevice") { a.ends.push(d); if ((d.routing?.parent?.lqi ?? 255) < 80) a.weak++; } });
    Object.entries(areas).forEach(([area, a]) => {
      if (!a.routers && a.ends.length >= 2) out.push({ sev: a.weak ? 2 : 1, icon: "power-plug", text: th(a.weak ? "advice.room_no_router_weak" : "advice.room_no_router", { area: esc(area), n: a.ends.length, weak: a.weak }) });
    });

    // 5. single points of failure (computed by the app from the latest scan)
    (state.data.single_points?.[bt] || []).forEach((p) => {
      const names = p.routers.slice(0, 5).map((r) => link(r.ieee)).join(", ") + (p.routers.length > 5 ? "…" : "");
      out.push({ sev: p.routers.length + p.devices >= 3 ? 2 : 1, icon: "router-wireless",
        text: [th("advice.spof", { router: link(p.ieee), n: p.routers.length, names }) + (p.devices ? th("advice.spof_devices", { n: p.devices }) : "") + ".", p.children ? th("advice.spof_children", { n: p.children }) : "", th("advice.spof_fix")].filter(Boolean).join(" ") });
    });

    // 6. devices missing from the scan
    const missing = devs.filter((d) => !d.routing && d.type !== "Coordinator" && statusOf(d) === "active");
    if (missing.length) out.push({ sev: 1, icon: "help-circle-outline", text: th("advice.missing", { n: missing.length, names: missing.slice(0, 6).map((d) => link(d.ieee)).join(", ") + (missing.length > 6 ? "…" : "") }) });

    if (!out.length) out.push({ sev: 0, icon: "check", text: th("advice.none") });
    return out.sort((a, b) => b.sev - a.sev);
  };

  const renderMap = (force = false) => {
    const nm = state.data.networkmap || {};
    const sig = JSON.stringify(state.data.instances.map((bt) => [bt, nm[bt]?.scanned_at, nm[bt]?.running_since, MAP.scanSel[bt], MAP.cmpSel[bt], (MAP.hist[bt] || []).length])) + MAP.allLinks + MAP.layout + !!FP.floors;
    if (!force && MAP.rendered === sig && $("#view .map-card")) { refreshMapInfo(); return; }
    MAP.rendered = sig;
    Object.values(MAP.sims).forEach((s) => s.stop());
    MAP.sims = {};
    if (MAP.layout === "floor") loadFloors();
    const running = Object.values(nm).some((x) => x.running_since);
    $("#view").innerHTML = `
      <div class="alert" style="--a:var(--info)">${ic("information-outline")}<div class="body">${th(MAP.layout === "floor" ? "map.help_floor" : "map.help")}</div>
        <button class="btn ${running ? "busy" : ""}" data-act="scan" ${running ? "disabled" : ""}>${ic(running ? "refresh" : "sitemap", "s18")}${running ? th("common.scanning") : th("menu.run_scan")}</button></div>
      ${state.data.instances.map((bt) => {
        const info = nm[bt] || {};
        const g = mapGraph(bt);
        const head = `<div class="card-header">${ic("sitemap")}<div>${th("net.network", { name: esc(netLabel(bt)) })}<small>${info.running_since ? th("map.scanning_now") : info.scanned_at ? th("map.scanned", { when: esc(relTime(info.scanned_at, true)), n: info.nodes ?? g.devs.length, links: info.links ?? "?" }) : th("map.not_scanned")}</small></div></div>`;
        if (g.devs.filter((d) => d.routing).length === 0) return `<div class="card map-card">${head}${emptyState("sitemap", th("map.no_data"), th("map.no_data_text"))}</div>`;
        const advice = mapAdvice(bt);
        const times = (state.data.scan_times?.[bt] || []).slice().reverse();
        const diff = mapDiff(bt);
        const nm2 = (ieee) => esc(nameOf(state.byIeee.get(ieee)) || ieee);
        const history = times.length > 1 ? `<div class="map-hist">
            <label>${th("map.showing")}<select class="field" data-mapscan="${esc(bt)}"><option value="">${th("map.latest_scan", { date: esc(fmtDate(times[0])) })}</option>${times.slice(1).map((t) => `<option value="${esc(t)}" ${MAP.scanSel[bt] === t ? "selected" : ""}>${esc(fmtDate(t))}</option>`).join("")}</select></label>
            <label>${th("map.compare_with")}<select class="field" data-mapcmp="${esc(bt)}"><option value="">${th("map.nothing")}</option>${times.filter((t) => t !== (MAP.scanSel[bt] || times[0]) && t < (MAP.scanSel[bt] || times[0])).map((t) => `<option value="${esc(t)}" ${MAP.cmpSel[bt] === t ? "selected" : ""}>${esc(fmtDate(t))}</option>`).join("")}</select></label>
            ${MAP.scanSel[bt] ? `<span class="muted">${th("map.older_scan")}</span>` : ""}</div>`
          : `<div class="map-hist muted">${th("map.history_builds")}</div>`;
        const changes = diff ? `<div class="sub-h">${th("map.changes_since", { date: esc(fmtDate(diff.oldAt)) })}</div><div class="advice">
            ${diff.moved.map((m) => `<div class="adv"><span class="state-ic" style="color:var(--info)">${ic("swap-horizontal")}</span><div class="text">${th("map.diff_moved", { device: `<b>${nm2(m.dev)}</b>`, from: nm2(m.from), old: esc(m.oldQ ?? "?"), to: nm2(m.to), new: esc(m.newQ ?? "?") })}</div></div>`).join("")}
            ${diff.better.map((m) => `<div class="adv"><span class="state-ic" style="color:var(--success)">${ic("arrow-up")}</span><div class="text">${th("map.diff_better", { device: `<b>${nm2(m.dev)}</b>`, parent: nm2(m.p), old: esc(m.oldQ), new: esc(m.newQ) })}</div></div>`).join("")}
            ${diff.worse.map((m) => `<div class="adv"><span class="state-ic" style="color:var(--error)">${ic("arrow-down")}</span><div class="text">${th("map.diff_worse", { device: `<b>${nm2(m.dev)}</b>`, parent: nm2(m.p), old: esc(m.oldQ), new: esc(m.newQ) })}</div></div>`).join("")}
            ${!diff.moved.length && !diff.better.length && !diff.worse.length ? `<div class="adv"><span class="state-ic">${ic("check")}</span><div class="text">${th("map.diff_none")}</div></div>` : ""}</div>` : "";
        return `<div class="card map-card" data-net="${esc(bt)}">${head}${history}
          <div class="map-tools">${layoutToggle()}${MAP.layout === "floor" ? "" : `<button class="icon-btn" data-mapzoom="1.25" data-net="${esc(bt)}" aria-label="${esc(t("map.zoom_in"))}">${ic("plus")}</button><button class="icon-btn" data-mapzoom="0.8" data-net="${esc(bt)}" aria-label="${esc(t("map.zoom_out"))}">${ic("minus")}</button>
            <button class="btn" data-mapreset="${esc(bt)}">${ic("refresh", "s18")}${th("map.reset")}</button>
            <button class="chip toggle" data-maplinks aria-pressed="${MAP.allLinks}">${ic("link-variant", "s18")}${th("map.all_links")}</button>`}
            <span class="spacer"></span>
            ${MAP.layout === "floor" ? `<div class="map-legend"><span><i style="background:var(--text)"></i>${th("map.coordinator")}</span><span><i style="background:var(--primary)"></i>${th("map.router")}</span><span><i style="background:var(--state-icon)"></i>${th("map.battery_device")}</span><span><i style="background:var(--warning)"></i>${th("map.needs_attention")}</span>` : `${mapLegend(bt, g.devs)}<div class="map-legend lines">`}<span><b style="background:var(--success)"></b>${th("signal.strong")}</span><span><b style="background:var(--warning)"></b>${th("signal.fair")}</span><span><b style="background:var(--error)"></b>${th("signal.weak")}</span>${MAP.layout === "floor" ? `<span title="${esc(t("map.likely_route_tip"))}"><b class="dashed"></b>${th("map.likely_route")}</span>` : ""}</div></div>
          ${MAP.layout === "floor" ? `<div class="map-stage fp-mode"><div class="map-info" id="mapinfo-${esc(bt)}" hidden></div>${FP.floors ? fpHtml(bt) : `<div class="card-content muted">${th("map.loading_floors")}</div>`}</div>` : `<div class="map-stage"><svg class="map" id="map-${esc(bt)}" role="img" aria-label="${esc(t("map.aria", { name: netLabel(bt) }))}"><g class="vp"><g class="links"></g><g class="nodes"></g></g></svg>
            <div class="map-info" id="mapinfo-${esc(bt)}" hidden></div></div>`}
          ${diff ? `<div class="map-legend" style="padding:8px 16px 0"><span><b style="background:var(--info);height:4px"></b>${th("map.changed_router")}</span><span><b style="background:var(--success);height:4px"></b>${th("map.stronger")}</span><span><b style="background:var(--error);height:4px"></b>${th("map.weaker")}</span><span><b style="background:var(--disabled)"></b>${th("map.unchanged")}</span></div>` : ""}
          ${changes}
          <div class="sub-h">${th("map.advice")}</div>
          <div class="advice">${advice.map((a) => `<div class="adv"><span class="state-ic" style="color:${a.sev >= 2 ? "var(--warning)" : a.sev === 1 ? "var(--info)" : "var(--success)"}">${ic(a.icon)}</span><div class="text">${a.text}</div>${a.action || ""}</div>`).join("")}</div>
        </div>`;
      }).join("")}`;
    state.data.instances.forEach((bt) => { const svg = document.getElementById(`map-${bt}`); if (svg) MAP.sims[bt] = startSim(bt, svg); });
    state.data.instances.forEach((bt) => { const fp = document.getElementById(`fp-${bt}`); if (fp) MAP.sims[bt] = startFloorPlan(bt, fp); });
  };

  const refreshMapInfo = () => Object.keys(MAP.sims).forEach((bt) => showMapInfo(bt));

  const showMapInfo = (bt) => {
    const box = document.getElementById(`mapinfo-${bt}`);
    const ieee = MAP.sel[bt];
    const d = ieee && state.byIeee.get(ieee);
    if (!box) return;
    if (!d) { box.hidden = true; return; }
    const r = d.routing || {};
    const parent = r.parent ? state.byIeee.get(r.parent.ieee) : null;
    const kids = state.data.devices.filter((x) => x.routing?.parent?.ieee === d.ieee).length;
    box.hidden = false;
    box.innerHTML = `<div class="mi-head">${stateIc(d)}<div class="text"><b>${esc(nameOf(d) || (d.type === "Coordinator" ? t("map.coordinator") : d.ieee))}</b><small>${esc([d.area, typeLabel(d.type)].filter(Boolean).join(" · "))}</small></div><button class="icon-btn" data-mapclose="${esc(bt)}" aria-label="${esc(t("common.close"))}">${ic("close", "s20")}</button></div>
      ${kv([[d.type === "EndDevice" ? th("map.connects_through") : null, parent ? `${nameOf(parent) || parent.ieee} (LQI ${r.parent.lqi ?? "?"})` : d.type === "EndDevice" ? t("map.not_found") : null],
        [d.type !== "EndDevice" ? th("map.kids") : null, d.type !== "EndDevice" ? kids : null], [th("more.signal_24h"), lqiOf(d) === null ? null : Math.round(lqiOf(d))], [th("devices.col.status"), statusOf(d) !== "active" ? STATUS[statusOf(d)].label : warnings(d)[0] ? issueLabel(warnings(d)[0]) : STATUS.active.label]].filter(([k]) => k))}
      ${d.type !== "Coordinator" ? `<div class="row-actions"><button class="btn" data-open="${esc(d.ieee)}">${th("map.open_details")}</button></div>` : ""}`;
  };

  const startSim = (bt, svg) => {
    const { devs, links } = mapGraph(bt);
    const visibleLinks = MAP.allLinks ? links : links.filter((l) => l.parent || (l.lqi || 0) >= 0 && linksTop(l, links));
    function linksTop(l, all) {
      // keep each router's two strongest router links, so the default view stays readable
      const top = (id) => all.filter((x) => !x.parent && (x.a === id || x.b === id)).sort((p, q) => (q.lqi || 0) - (p.lqi || 0)).slice(0, 2);
      return top(l.a).includes(l) || top(l.b).includes(l);
    }
    const W = svg.clientWidth || 900, H = svg.clientHeight || 560;
    const saved = (MAP.pos ||= {})[bt] || {};
    const nodes = devs.map((d, i) => {
      const p = saved[d.ieee];
      const a = (i / devs.length) * Math.PI * 2;
      const r0 = d.type === "Coordinator" ? 0 : d.type === "Router" ? 0.3 : 0.55;
      return { id: d.ieee, d, x: p ? p.x : W / 2 + Math.cos(a) * r0 * W * 0.5 + (Math.random() - 0.5) * 20, y: p ? p.y : H / 2 + Math.sin(a) * r0 * H * 0.5 + (Math.random() - 0.5) * 20, vx: 0, vy: 0, fixed: d.type === "Coordinator" && !p, r: d.type === "Coordinator" ? 14 : d.type === "Router" ? 8 : 5.5 };
    });
    const byId = new Map(nodes.map((n) => [n.id, n]));
    if (!saved[devs.find((d) => d.type === "Coordinator")?.ieee]) { const c = nodes.find((n) => n.d.type === "Coordinator"); if (c) { c.x = W / 2; c.y = H / 2; } }
    const L = visibleLinks.map((l) => ({ ...l, s: byId.get(l.a), t: byId.get(l.b) })).filter((l) => l.s && l.t);
    const vp = svg.querySelector(".vp"), gl = svg.querySelector(".links"), gn = svg.querySelector(".nodes");
    const diff = mapDiff(bt);
    const diffCol = (l) => { const st = diff.status[[l.a, l.b].sort().join("|")]; return st === "moved" ? "var(--info)" : st === "better" ? "var(--success)" : st === "worse" ? "var(--error)" : "var(--disabled)"; };
    gl.innerHTML = L.map((l, i) => { const changed = diff && diff.status[[l.a, l.b].sort().join("|")]; return `<line data-i="${i}" stroke="${diff ? diffCol(l) : lqiCol(l.lqi)}" stroke-width="${changed ? 3 : l.parent ? 1.6 : 1.1}" ${l.parent ? "" : 'stroke-dasharray="5 4"'} opacity="${diff && !changed ? 0.35 : l.parent ? 0.85 : 0.6}"><title>LQI ${esc(l.lqi ?? "?")}</title></line>`; }).join("");
    gn.innerHTML = nodes.map((n, i) => `<g class="mnode" data-n="${i}" tabindex="0"><circle r="${n.r}" fill="${mapNodeCol(n.d)}" stroke="var(--card)" stroke-width="2"/>${n.d.type === "Coordinator" ? `<text class="c" text-anchor="middle" dy="4">C</text>` : `<text class="lbl" text-anchor="middle" dy="${-n.r - 5}">${esc((nameOf(n.d) || "").slice(0, 28))}</text>`}<title>${esc(nameOf(n.d) || (n.d.type === "Coordinator" ? t("map.coordinator") : n.id))}${n.d.area ? " · " + esc(n.d.area) : ""}</title></g>`).join("");
    const lineEls = [...gl.children], nodeEls = [...gn.children];
    const hadView = !!MAP.view?.[bt];
    let view = MAP.view?.[bt] || { k: 1, x: 0, y: 0 };
    const applyView = () => { vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); svg.classList.toggle("zoomed", view.k >= 1.4); (MAP.view ||= {})[bt] = view; };
    applyView();
    const draw = () => {
      L.forEach((l, i) => { const e = lineEls[i]; e.setAttribute("x1", l.s.x.toFixed(1)); e.setAttribute("y1", l.s.y.toFixed(1)); e.setAttribute("x2", l.t.x.toFixed(1)); e.setAttribute("y2", l.t.y.toFixed(1)); });
      nodes.forEach((n, i) => nodeEls[i].setAttribute("transform", `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`));
      highlight();
    };
    const highlight = () => {
      const sel = MAP.sel[bt];
      const near = new Set(sel ? L.filter((l) => l.a === sel || l.b === sel).flatMap((l) => [l.a, l.b]) : []);
      // Filter: matching devices in full, the devices they connect to faded for context, the rest nearly hidden.
      const f = MAP.filter, on = f.size > 0;
      const hit = new Set(on ? nodes.filter((n) => f.has(mapGroup(n.d))).map((n) => n.id) : []);
      const ctx = new Set(on ? L.filter((l) => hit.has(l.a) || hit.has(l.b)).flatMap((l) => [l.a, l.b]) : []);
      const labels = on && hit.size <= 30;
      L.forEach((l, i) => { lineEls[i].classList.toggle("dim", !!sel && l.a !== sel && l.b !== sel); lineEls[i].classList.toggle("off", on && !hit.has(l.a) && !hit.has(l.b)); });
      nodes.forEach((n, i) => {
        const e = nodeEls[i], shown = !on || hit.has(n.id) || n.id === sel;
        e.classList.toggle("dim", !!sel && !near.has(n.id) && n.id !== sel);
        e.classList.toggle("sel", n.id === sel); e.classList.toggle("near", near.has(n.id));
        e.classList.toggle("off", !shown && !ctx.has(n.id)); e.classList.toggle("ctx", !shown && ctx.has(n.id));
        e.classList.toggle("hit", labels && hit.has(n.id));
      });
    };
    let alpha = Object.keys(saved).length ? 0.15 : 1, raf = null, stopped = false;
    // Spacing scales with the stage and the device count, so big networks spread out instead of clumping.
    const spread = Math.max(1, Math.min(2.2, Math.sqrt((W * H) / Math.max(1, nodes.length) / 9000)));
    // Forces run in a space stretched vertically by ay, so the network settles into a wide ellipse that matches the stage.
    const ay = Math.max(0.5, Math.min(2.2, W / H));
    const step = () => {
      const cx = W / 2, cy = H / 2;
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.x - a.x, dy = (b.y - a.y) * ay, d2 = dx * dx + dy * dy || 0.01;
          if (d2 > 360000) continue;
          const d = Math.sqrt(d2);
          let f = (2400 * spread * alpha) / d2;
          const min = a.r + b.r + 16;
          if (d < min) f += ((min - d) / d) * 0.5;
          dx /= d; dy /= d * ay;
          a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
        }
      }
      L.forEach((l) => {
        const target = (l.parent ? (l.t.d.type === "Coordinator" || l.s.d.type === "Coordinator" ? 150 : 75) : 190) * spread;
        const dx = l.t.x - l.s.x, dy = (l.t.y - l.s.y) * ay, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const k = ((d - target) / d) * 0.06 * alpha * (l.parent ? 1 : 0.5);
        l.s.vx += dx * k; l.s.vy += (dy / ay) * k; l.t.vx -= dx * k; l.t.vy -= (dy / ay) * k;
      });
      nodes.forEach((n) => {
        n.vx += (cx - n.x) * 0.0012 * alpha; n.vy += (cy - n.y) * 0.0012 * alpha;
        if (n.fixed) { n.vx = 0; n.vy = 0; return; }
        n.vx *= 0.6; n.vy *= 0.6; n.x += n.vx; n.y += n.vy;
      });
      alpha *= 0.985;
    };
    const tick = () => {
      step();
      draw();
      if (alpha > 0.01 && !stopped) raf = requestAnimationFrame(tick); else { raf = null; savePos(); if (fitPending) { fitPending = false; fit(); } }
    };
    // Zoom so the whole network fills the stage, once, after the first layout (not after the user has moved the view).
    let fitPending = !hadView;
    const fit = () => {
      if (!nodes.length) return;
      const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y), pad = 40;
      const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
      const k = Math.max(0.3, Math.min(1.5, W / (x1 - x0), H / (y1 - y0)));
      view = { k, x: (W - (x0 + x1) * k) / 2, y: (H - (y0 + y1) * k) / 2 };
      applyView();
    };
    const savePos = () => { (MAP.pos ||= {})[bt] = Object.fromEntries(nodes.map((n) => [n.id, { x: n.x, y: n.y }])); };
    const reheat = (a = 0.3) => { alpha = Math.max(alpha, a); if (!raf && !stopped) raf = requestAnimationFrame(tick); };
    const toSvg = (ev) => { const r = svg.getBoundingClientRect(); return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k }; };
    let drag = null;
    svg.addEventListener("pointerdown", (ev) => {
      const g = ev.target.closest(".mnode");
      svg.setPointerCapture(ev.pointerId);
      if (g) { const n = nodes[+g.dataset.n]; drag = { n, moved: false, start: [ev.clientX, ev.clientY] }; n.fixed = true; }
      else drag = { pan: true, moved: false, start: [ev.clientX, ev.clientY], vx: view.x, vy: view.y };
    });
    svg.addEventListener("pointermove", (ev) => {
      if (!drag) return;
      if (Math.abs(ev.clientX - drag.start[0]) + Math.abs(ev.clientY - drag.start[1]) > 3) drag.moved = true;
      if (drag.pan) { fitPending = false; view = { ...view, x: drag.vx + ev.clientX - drag.start[0], y: drag.vy + ev.clientY - drag.start[1] }; applyView(); }
      else if (drag.moved) { const p = toSvg(ev); drag.n.x = p.x; drag.n.y = p.y; drag.n.vx = drag.n.vy = 0; reheat(0.15); draw(); }
    });
    svg.addEventListener("pointerup", () => {
      if (drag && !drag.moved) { MAP.sel[bt] = drag.n ? (MAP.sel[bt] === drag.n.id ? null : drag.n.id) : null; highlight(); showMapInfo(bt); }
      if (drag?.n && drag.n.d.type !== "Coordinator" && !drag.moved) drag.n.fixed = false;
      drag = null; savePos();
    });
    svg.addEventListener("wheel", (ev) => { ev.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
    svg.addEventListener("keydown", (ev) => { const g = ev.target.closest(".mnode"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); const n = nodes[+g.dataset.n]; MAP.sel[bt] = n.id; highlight(); showMapInfo(bt); } });
    const zoomAt = (f, px, py) => { fitPending = false; const k = Math.max(0.3, Math.min(4, view.k * f)); view = { k, x: px - ((px - view.x) * k) / view.k, y: py - ((py - view.y) * k) / view.k }; applyView(); };
    // A fresh layout is worked out before the first paint, so the map opens settled and fitted instead of exploding outwards.
    if (!Object.keys(saved).length) { for (let i = 0; i < 400 && alpha > 0.02; i++) step(); }
    if (fitPending && !Object.keys(saved).length) { fitPending = false; fit(); }
    draw();
    raf = requestAnimationFrame(tick);
    showMapInfo(bt);
    return {
      stop() { stopped = true; if (raf) cancelAnimationFrame(raf); savePos(); },
      zoom(f) { zoomAt(f, W / 2, H / 2); },
      reset() { delete MAP.pos[bt]; delete MAP.view[bt]; renderMap(true); },
      select(id) { MAP.sel[bt] = id; highlight(); showMapInfo(bt); },
      filter() { highlight(); },
    };
  };

  // ------------------------------------------------------------ floor-plan layout of the map
  MAP.layout = store.get("z2mt.mapLayout") === "floor" ? "floor" : "graph";
  const FP = { floors: null, areas: null, loading: false };
  const loadFloors = async () => {
    if (FP.loading || FP.floors) return;
    FP.loading = true;
    try { const r = await api("api/areas"); FP.areas = r.areas || []; FP.floors = r.floors || []; if (!state.areas) state.areas = FP.areas; }
    catch (e) { FP.areas = []; FP.floors = []; }
    FP.loading = false;
    if (state.view === "map" && MAP.layout === "floor") renderMap(true);
  };
  const layoutToggle = () => `<div class="chips" role="group" aria-label="${esc(t("map.layout"))}">${[["graph", "map.layout_graph"], ["floor", "map.layout_floor"]].map(([k, l]) => `<button class="chip" data-maplayout="${k}" aria-pressed="${MAP.layout === k}">${ic("check", "s18")}${th(l)}</button>`).join("")}</div>`;
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-maplayout]");
    if (!b || b.dataset.maplayout === MAP.layout) return;
    MAP.layout = b.dataset.maplayout;
    store.set("z2mt.mapLayout", MAP.layout);
    renderMap(true);
  });

  // Each device's uplink: its parent from the scan, or for routers the strongest link towards the coordinator.
  const fpUplinks = (bt, g) => {
    const depth = (ieee) => { const d = state.byIeee.get(ieee); return d?.type === "Coordinator" ? 0 : d?.routing?.depth ?? null; };
    const up = new Map();
    g.links.filter((l) => l.parent).forEach((l) => up.set(l.a, { to: l.b, lqi: l.lqi, parent: true }));
    g.devs.filter((d) => d.type === "Router" && !up.has(d.ieee)).forEach((d) => {
      const own = depth(d.ieee);
      const cands = g.links.filter((l) => !l.parent && (l.a === d.ieee || l.b === d.ieee)).map((l) => ({ to: l.a === d.ieee ? l.b : l.a, lqi: l.lqi, parent: false }))
        .filter((c) => { const o = depth(c.to); return own === null || o === null || o < own; })
        .sort((p, q) => (q.lqi || 0) - (p.lqi || 0));
      if (cands[0]) up.set(d.ieee, cands[0]);
    });
    return up;
  };

  const fpHtml = (bt) => {
    const g = mapGraph(bt);
    const devs = g.historic ? g.devs : state.data.devices.filter((d) => d.instance === bt && d.status !== "removed");
    const up = fpUplinks(bt, g);
    const areaByName = new Map((FP.areas || []).map((a) => [a.name, a]));
    const floorById = new Map((FP.floors || []).map((f) => [f.id, f]));
    const coord = devs.find((d) => d.type === "Coordinator");
    const noArea = t("map.no_area");
    // floor key -> area name -> devices
    const groups = new Map();
    devs.forEach((d) => {
      if (d === coord && !d.area) return;
      const a = d.area ? areaByName.get(d.area) : null;
      const fk = !d.area ? "~none" : a?.floor_id && floorById.has(a.floor_id) ? a.floor_id : "~other";
      const areas = groups.get(fk) || groups.set(fk, new Map()).get(fk);
      const key = d.area || noArea;
      (areas.get(key) || areas.set(key, []).get(key)).push(d);
    });
    const floorOrder = [...groups.keys()].sort((x, y) => {
      const rank = (k) => (k === "~none" ? 3 : k === "~other" ? 2 : 1);
      if (rank(x) !== rank(y)) return rank(x) - rank(y);
      const fx = floorById.get(x), fy = floorById.get(y);
      return (fy?.level ?? -999) - (fx?.level ?? -999) || collator.compare(fx?.name || "", fy?.name || "");
    });
    const kindOrder = { Coordinator: 0, Router: 1, EndDevice: 2 };
    const devBtn = (d) => {
      const u = up.get(d.ieee);
      const name = d.type === "Coordinator" ? t("map.coordinator") : nameOf(d) || d.ieee;
      const tip = [name, d.type === "EndDevice" ? t("map.battery_device") : typeLabel(d.type), u ? t("map.fp_via", { name: nameOf(state.byIeee.get(u.to)) || (state.byIeee.get(u.to)?.type === "Coordinator" ? t("map.coordinator") : u.to), lqi: u.lqi ?? "?" }) : d.type !== "Coordinator" ? t("map.fp_not_scanned") : ""].filter(Boolean).join(" · ");
      return `<button class="fp-dev ${d.type === "Coordinator" ? "coord" : d.type === "Router" ? "router" : ""} ${!u && d.type !== "Coordinator" ? "noscan" : ""}" data-fpdev="${esc(d.ieee)}" title="${esc(tip)}"><i style="background:${mapNodeCol(d)}"></i><span>${esc(name)}</span></button>`;
    };
    const areaBox = (area, list) => {
      const linked = list.map((d) => up.get(d.ieee)).filter((u) => u && u.lqi !== null && u.lqi !== undefined);
      const weak = linked.length && linked.every((u) => u.lqi < 50);
      const via = weak && new Set(linked.map((u) => u.to)).size === 1 ? state.byIeee.get(linked[0].to) : null;
      const viaName = via ? (via.type === "Coordinator" ? t("map.fp_the_coordinator") : nameOf(via) || via.ieee) : "";
      list.sort((a, b) => (kindOrder[a.type] ?? 3) - (kindOrder[b.type] ?? 3) || collator.compare(nameOf(a) || "~", nameOf(b) || "~"));
      return `<div class="fp-area ${weak ? "weak" : ""} ${area === noArea ? "none" : ""}"><div class="fp-area-h">${esc(area)}<span class="n">${list.length}</span></div>
        ${weak ? `<div class="fp-flag">${ic("alert", "s18")}${via ? th("map.fp_weak_via", { n: linked.length, name: esc(viaName) }) : th("map.fp_weak", { n: linked.length })}</div>` : ""}
        <div class="fp-devs">${list.map(devBtn).join("")}</div></div>`;
    };
    const floorLabel = (k) => (k === "~none" ? t("map.fp_no_area") : k === "~other" ? t(FP.floors?.length ? "map.fp_other_areas" : "map.fp_areas") : floorById.get(k).name);
    return `<div class="fp" id="fp-${esc(bt)}"><svg class="fp-lines" aria-hidden="true"></svg>
      ${coord && !coord.area ? `<section class="fp-floor"><div class="fp-areas"><div class="fp-area coord-box"><div class="fp-devs">${devBtn(coord)}</div></div></div></section>` : ""}
      ${floorOrder.map((fk) => `<section class="fp-floor"><div class="fp-floor-h">${esc(floorLabel(fk))}</div><div class="fp-areas">${[...groups.get(fk).entries()].sort((a, b) => collator.compare(a[0], b[0])).map(([a, list]) => areaBox(a, list)).join("")}</div></section>`).join("")}
    </div>`;
  };

  const startFloorPlan = (bt, root) => {
    const g = mapGraph(bt);
    const up = fpUplinks(bt, g);
    const svg = root.querySelector(".fp-lines");
    const els = new Map([...root.querySelectorAll("[data-fpdev]")].map((el) => [el.dataset.fpdev, el]));
    const lines = [...up.entries()].filter(([a, u]) => els.has(a) && els.has(u.to)).map(([a, u]) => ({ a, b: u.to, lqi: u.lqi, parent: u.parent }));
    const draw = () => {
      const box = root.getBoundingClientRect();
      const at = (ieee) => { const r = els.get(ieee).querySelector("i").getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top]; };
      svg.setAttribute("width", root.scrollWidth); svg.setAttribute("height", root.scrollHeight);
      svg.innerHTML = lines.map((l, i) => { const [x1, y1] = at(l.a), [x2, y2] = at(l.b); const bend = Math.max(-60, Math.min(60, (x2 - x1) * 0.15)); return `<path data-i="${i}" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${((x1 + x2) / 2 + bend).toFixed(1)},${((y1 + y2) / 2 - Math.abs(bend)).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" stroke="${lqiCol(l.lqi)}" ${l.parent ? "" : 'stroke-dasharray="5 4"'}><title>${esc(l.parent ? t("map.fp_lqi", { lqi: l.lqi ?? "?" }) : t("map.fp_likely_lqi", { lqi: l.lqi ?? "?" }))}</title></path>`; }).join("");
      highlight();
    };
    const highlight = () => {
      const sel = MAP.sel[bt];
      const near = new Set(sel ? lines.filter((l) => l.a === sel || l.b === sel).flatMap((l) => [l.a, l.b]) : []);
      [...svg.children].forEach((p) => { const l = lines[+p.dataset.i]; p.classList.toggle("dim", !!sel && l.a !== sel && l.b !== sel); p.classList.toggle("hot", !!sel && (l.a === sel || l.b === sel)); });
      els.forEach((el, id) => { el.classList.toggle("dim", !!sel && !near.has(id) && id !== sel); el.setAttribute("aria-pressed", String(id === sel)); });
    };
    const onClick = (ev) => {
      const b = ev.target.closest("[data-fpdev]");
      MAP.sel[bt] = b && MAP.sel[bt] !== b.dataset.fpdev ? b.dataset.fpdev : null;
      highlight(); showMapInfo(bt);
    };
    root.addEventListener("click", onClick);
    const ro = typeof ResizeObserver === "function" ? new ResizeObserver(() => draw()) : null;
    if (ro) ro.observe(root); else window.addEventListener("resize", draw);
    draw();
    showMapInfo(bt);
    return {
      stop() { if (ro) ro.disconnect(); else window.removeEventListener("resize", draw); },
      zoom() {}, reset() {},
      select(id) { MAP.sel[bt] = id; highlight(); showMapInfo(bt); els.get(id)?.scrollIntoView({ block: "nearest" }); },
    };
  };

  const renderActivity = () => {
    const events = [...(state.data.events || [])].reverse().slice(0, 500);
    if (!events.length) { $("#view").innerHTML = `<div class="card">${emptyState("history", th("activity.empty"), th("activity.empty_text"))}</div>`; return; }
    const groups = [];
    events.forEach((e) => { const day = fmtDate(e.time, false); if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, items: [] }); groups[groups.length - 1].items.push(e); });
    $("#view").innerHTML = `<div class="card">${groups.map((g) => `<div class="logday">${esc(g.day)}</div>` + g.items.map((e) => {
      const d = state.byIeee.get(e.ieee);
      const who = e.name && !IEEE_RE.test(e.name) ? e.name : nameOf(d) || e.ieee;
      const [icon, color] = EVENT_ICON(e.kind);
      return `<div class="log" ${d ? `data-open="${esc(e.ieee)}"` : ""}><span class="state-ic" style="color:${color}">${ic(icon)}</span>
        <div class="text"><div class="t1"><b>${esc(who)}</b> ${esc(eventKind(e.kind))}${e.detail ? ` · ${esc(eventDetail(e))}` : ""}</div><div class="t2">${th("net.network", { name: esc(netLabel(e.instance)) })}${d?.area ? ` · ${esc(d.area)}` : ""}</div></div>
        <time>${esc(fmtTime(e.time))}</time></div>`;
    }).join("")).join("")}</div>`;
  };

  // ------------------------------------------------------------ settings
  const renderSettings = async (refetch = true) => {
    if (refetch || !state.settings) {
      if (!state.settings) $("#view").innerHTML = `<div class="card">${emptyState("cog", th("settings.loading"), "")}</div>`;
      try { state.settings = await api("api/settings"); } catch (err) { $("#view").innerHTML = `<div class="card">${emptyState("alert-circle", th("settings.load_failed"), esc(err.message))}</div>`; return; }
    }
    if (state.view !== "settings") return;
    const S = state.settings, s = S.settings;
    const off = !s.alerts_enabled;
    const disabled = new Set(s.disabled_checks || []), notify = new Set(s.notify_checks || []);
    const sw = (key, checked, title, desc, dis = false) => `<div class="set-row ${dis ? "disabled" : ""}"><div class="text"><div class="t1">${esc(title)}</div><div class="t2">${desc}</div></div><div class="ctl"><label class="switch"><input type="checkbox" data-set="${key}" ${checked ? "checked" : ""} ${dis ? "disabled" : ""} aria-label="${esc(title)}"><span class="track"></span><span class="thumb"></span></label></div></div>`;
    const num = (key, title, desc, min, max, unit) => `<div class="set-row"><div class="text"><div class="t1">${esc(title)}</div><div class="t2">${desc}</div></div><div class="ctl"><input class="field num" type="number" data-num="${key}" min="${min}" max="${max}" value="${esc(s[key])}" aria-label="${esc(title)}"><span class="unit">${unit}</span></div></div>`;
    const checks = S.checks.map((c) => {
      const cur = disabled.has(c.key) ? "off" : notify.has(c.key) ? "notify" : c.event ? "off" : "show";
      const opts = c.event ? [["off", t("settings.check.off")], ["notify", t("settings.check.notify")]] : [["off", t("settings.check.off")], ["show", t("settings.check.show")], ["notify", t("settings.check.show_notify")]];
      const rowDis = off && c.event;
      return `<div class="set-row ${rowDis ? "disabled" : ""}"><div class="text"><div class="t1">${esc(checkLabel(c))}</div><div class="t2">${esc(checkDesc(c))}</div></div><div class="ctl"><select class="field" data-checksel="${c.key}" data-event="${c.event ? 1 : 0}" aria-label="${esc(checkLabel(c))}" ${rowDis ? "disabled" : ""}>${opts.map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""} ${off && v === "notify" && cur !== "notify" ? "disabled" : ""}>${esc(l)}</option>`).join("")}</select></div></div>`;
    }).join("");
    const nm = S.networkmap || {};
    const scans = scanLine(S.networks.map((n) => n.topic), nm);
    const hours = [`<option value="-1" ${s.networkmap_hour < 0 ? "selected" : ""}>${th("settings.scan_off")}</option>`].concat([...Array(24).keys()].map((h) => `<option value="${h}" ${s.networkmap_hour === h ? "selected" : ""}>${th("settings.scan_daily", { time: `${String(h).padStart(2, "0")}:00` })}</option>`)).join("");
    const weekdays = [...Array(7).keys()].map((i) => intl((l) => new Date(Date.UTC(2024, 0, 1 + i)).toLocaleDateString(l, { weekday: "long", timeZone: "UTC" })));
    $("#view").innerHTML = `
      <div class="card"><div class="card-header">${th("settings.notifications")}</div>
        ${off ? `<div class="card-content"><div class="alert" style="--a: var(--warning)">${ic("bell-off")}<div class="body"><b>${th("settings.alerts_off")}</b> ${th("settings.alerts_off_text")}</div></div></div>` : ""}
        ${sw("alerts_enabled", s.alerts_enabled, t("settings.send_alerts"), th("settings.send_alerts_desc"))}
        ${sw("persistent_notifications", s.persistent_notifications, t("settings.ha_notifications"), th("settings.ha_notifications_desc"), off)}

        <div class="set-row"><div class="text"><div class="t1">${th("settings.theme")}</div><div class="t2">${th("settings.theme_desc")}</div></div><div class="ctl"><select class="field" id="themeSel">${THEMES.map((x) => `<option value="${x}" ${theme === x ? "selected" : ""}>${th(`theme.${x}`)}</option>`).join("")}</select></div></div>
        <div class="set-row"><div class="text"><div class="t1">${th("menu.import_history")}</div><div class="t2">${th("settings.import_desc")}</div></div><div class="ctl"><button class="btn" data-act="import">${th("common.import")}</button></div></div>

        <div class="set-row"><div class="text"><div class="t1">${th("settings.export")}</div><div class="t2">${th("settings.export_desc")}</div></div><div class="ctl"><a class="btn" href="api/export.csv" download>${th("menu.export_csv")}</a></div></div>
        <div class="set-row"><div class="text"><div class="t1">${th("settings.networks")}</div><div class="t2">${th("settings.networks_desc", { topics: S.networks.map((n) => esc(n.topic)).join(", ") })}</div></div><div class="ctl">${S.networks.filter((n) => n.panel).map((n) => `<a class="btn" href="${esc(n.panel)}" target="_top">${esc(netLabel(n.topic))}${ic("open-in-new", "s18")}</a>`).join("")}</div></div>
        <div class="set-row"><div class="text"><div class="t1">${th("settings.details")}</div><div class="t2">${th("settings.details_desc")}</div></div><div class="ctl"><select class="field" id="layoutSel"><option value="pane" ${state.layout === "pane" ? "selected" : ""}>${th("settings.side_panel")}</option><option value="dialog" ${state.layout === "dialog" ? "selected" : ""}>${th("settings.popup")}</option></select></div></div>

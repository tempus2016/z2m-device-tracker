<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zigbee Tracker</title>
<style>
  @font-face { font-family: "Roboto"; font-weight: 400; font-display: swap; src: url("fonts/roboto-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 500; font-display: swap; src: url("fonts/roboto-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 700; font-display: swap; src: url("fonts/roboto-latin-700-normal.woff2") format("woff2"); }

  /* Home Assistant default theme tokens */
  :root {
    --font: "Roboto", "Noto", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --primary: #03a9f4;
    --primary-ink: #ffffff;
    --primary-text: #0288d1;
    --bg: #fafafa;
    --card: #ffffff;
    --sec-bg: #f0f0f0;
    --text: #212121;
    --text-2: #727272;
    --disabled: #bdbdbd;
    --divider: rgba(0, 0, 0, 0.12);
    --hover: rgba(0, 0, 0, 0.04);
    --state-icon: #44739e;
    --success: #43a047;
    --warning: #ffa600;
    --warning-text: #9b6200;
    --error: #db4437;
    --info: #039be5;
    --chip-on: rgba(3, 169, 244, 0.14);
    --scrim: rgba(0, 0, 0, 0.32);
    --snackbar: #323232;
    --shadow: 0 2px 2px rgba(0, 0, 0, 0.14), 0 1px 5px rgba(0, 0, 0, 0.12), 0 3px 1px -2px rgba(0, 0, 0, 0.2);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary-text: #4fc3f7; --bg: #111111; --card: #1c1c1c; --sec-bg: #282828; --text: #e1e1e1; --text-2: #9b9b9b; --disabled: #6f6f6f;
      --divider: rgba(225, 225, 225, 0.12); --hover: rgba(255, 255, 255, 0.05); --state-icon: #6b9ac4; --warning-text: #ffc163;
      --chip-on: rgba(3, 169, 244, 0.22); --scrim: rgba(0, 0, 0, 0.55); --snackbar: #e1e1e1; --shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --primary-text: #4fc3f7; --bg: #111111; --card: #1c1c1c; --sec-bg: #282828; --text: #e1e1e1; --text-2: #9b9b9b; --disabled: #6f6f6f;
    --divider: rgba(225, 225, 225, 0.12); --hover: rgba(255, 255, 255, 0.05); --state-icon: #6b9ac4; --warning-text: #ffc163;
    --chip-on: rgba(3, 169, 244, 0.22); --scrim: rgba(0, 0, 0, 0.55); --snackbar: #e1e1e1; --shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.43; color: var(--text); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* Touch: no grey tap flash, no double-tap-zoom wait, no text selection or callout on long-press of a control */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button, a, label, select, summary, [role="button"], [data-act], [data-open], .tab, .chip, .row.click, .log, .dt th.sortable, .dt tbody tr { touch-action: manipulation; }
  button, [role="button"], .btn, .icon-btn, .tab, .chip, .menu a { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  a { color: var(--primary-text); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .mdi { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
  .mdi.s18 { width: 18px; height: 18px; } .mdi.s20 { width: 20px; height: 20px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--text-2); }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }

  /* ------------------------------------------------------------ toolbar + tabs */
  .toolbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--divider); }
  .toolbar-top { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
  .toolbar-top h1 { margin: 0 0 0 8px; font-size: 20px; font-weight: 400; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar-top .logo { color: var(--primary); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); margin-right: 4px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .live.down i { background: var(--error); }
  .icon-btn { appearance: none; border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
  @media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: var(--hover); color: var(--text); } }
  .tabs { display: flex; padding: 0 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
  .tab { appearance: none; border: 0; background: none; height: 48px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: 14px; position: relative; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--text); background: var(--hover); } }
  .tab[aria-selected="true"] { color: var(--primary-text); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--primary); }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sec-bg); color: var(--text-2); font-size: 12px; font-weight: 500; display: inline-grid; place-items: center; }
  .badge.warn { background: var(--warning); color: #000; }
  .badge.info { background: var(--info); color: #fff; }
  .ota-head { display: flex; align-items: center; gap: 12px; padding: 16px; flex-wrap: wrap; }
  .ota-head .text { flex: 1; min-width: 220px; }
  .ota-head .t1 { font-size: 16px; }
  .ota-head .t2 { font-size: 14px; color: var(--text-2); }
  .dt.ota tbody tr { cursor: default; }
  .dt.ota td.wrap { white-space: normal; min-width: 160px; }
  .dt.ota .bar { width: 120px; margin-top: 4px; }
  .ota-time { display: flex; gap: 8px; align-items: center; }
  .ota-time .field { width: 132px; }
  .dt.ota td.nw { white-space: nowrap; }
  .dt.ota td.dev { min-width: 180px; }
  .set-row.ota-row { flex-wrap: wrap; }
  .set-row.ota-row .text { min-width: 220px; }
  .menu { position: absolute; right: 8px; top: 52px; z-index: 40; min-width: 220px; background: var(--card); border-radius: 4px; box-shadow: 0 5px 5px -3px rgba(0,0,0,.2), 0 8px 10px 1px rgba(0,0,0,.14), 0 3px 14px 2px rgba(0,0,0,.12); padding: 8px 0; }
  .menu button, .menu a { appearance: none; border: 0; background: none; width: 100%; height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; color: var(--text); text-decoration: none; font-size: 14px; }
  @media (hover: hover) and (pointer: fine) { .menu button:hover, .menu a:hover { background: var(--hover); } }
  .menu .mdi { color: var(--text-2); }

  .page { max-width: 1280px; margin: 0 auto; padding: 16px 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  #view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
  .tools > *, .chips { min-width: 0; }

  /* ------------------------------------------------------------ cards, alerts, buttons */
  .card { background: var(--card); border: 1px solid var(--divider); border-radius: 12px; overflow: hidden; }
  .card-header { padding: 20px 16px 8px; font-size: 22px; font-weight: 400; display: flex; align-items: center; gap: 12px; }
  .card-header small { font-size: 14px; color: var(--text-2); display: block; margin-top: 2px; }
  .card-content { padding: 0 16px 16px; }
  .card-actions { border-top: 1px solid var(--divider); padding: 8px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .alert { display: flex; gap: 12px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 4px; position: relative; overflow: hidden; color: var(--text); }
  .alert::before { content: ""; position: absolute; inset: 0; background: var(--a); opacity: 0.12; pointer-events: none; }
  .alert > * { position: relative; }
  .alert > .mdi { color: var(--a); }
  .alert .body { flex: 1; min-width: 0; padding: 4px 0; }
  .alert b { font-weight: 500; }
  /* In the narrow device pane, keep the message readable: buttons that don't fit move under it. */
  .alerts .alert { flex-wrap: wrap; }
  .alerts .alert .body { flex: 1 1 55%; }
  .chips.pause-chips { padding: 0 0 12px; flex-wrap: wrap; overflow: visible; }
  .alert-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .btn { appearance: none; border: 0; background: none; height: 36px; padding: 0 12px; border-radius: 18px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--primary-text); text-decoration: none; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); } }
  .btn.filled { background: var(--primary); color: var(--primary-ink); padding: 0 20px; }
  @media (hover: hover) and (pointer: fine) { .btn.filled:hover { filter: brightness(1.06); } }
  .btn.outlined { border: 1px solid var(--divider); padding: 0 16px; }
  .btn.danger { color: var(--error); }
  @media (hover: hover) and (pointer: fine) { .btn.danger:hover { background: color-mix(in srgb, var(--error) 10%, transparent); } }
  .btn.filled.danger { background: var(--error); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: default; background: none; }
  .btn.filled:disabled { background: var(--disabled); color: #fff; }
  .btn.busy .mdi { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ------------------------------------------------------------ search + chips */
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1 1 280px; position: relative; min-width: 0; }
  .search .mdi { position: absolute; left: 12px; top: 12px; color: var(--text-2); }
  .search input { width: 100%; height: 48px; padding: 0 44px; border: 1px solid var(--divider); border-radius: 24px; background: var(--card); font-size: 16px; }
  .search input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .search .clear { position: absolute; right: 4px; top: 4px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { appearance: none; height: 32px; padding: 0 12px; border: 1px solid var(--divider); border-radius: 8px; background: var(--card); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .chip:hover { background: var(--hover); } }
  .chip[aria-pressed="true"] { background: var(--chip-on); border-color: transparent; color: var(--primary-text); }
  .chip[aria-pressed="true"] .mdi { display: block; }
  .chip .mdi { display: none; width: 18px; height: 18px; }
  .chip .n { color: var(--text-2); font-weight: 400; }
  .chip[aria-pressed="true"] .n { color: inherit; }
  .count-line { margin-left: auto; color: var(--text-2); font-size: 14px; white-space: nowrap; }

  /* ------------------------------------------------------------ data table */
  .table-wrap { overflow-x: auto; overscroll-behavior-x: contain; }
  table.dt { width: 100%; border-collapse: collapse; min-width: 900px; }
  .dt th { height: 56px; padding: 0 16px; text-align: left; font-weight: 500; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--divider); white-space: nowrap; user-select: none; }
  .dt th.sortable { cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .dt th.sortable:hover { background: var(--hover); } }
  .dt th .h { display: inline-flex; align-items: center; gap: 4px; }
  .dt th .mdi { width: 18px; height: 18px; color: var(--text-2); visibility: hidden; }
  .dt th.on .mdi { visibility: visible; color: var(--text); }
  @media (hover: hover) and (pointer: fine) { .dt th.sortable:hover .mdi { visibility: visible; } }
  .dt th.num, .dt td.num { text-align: right; }
  .dt td { height: 52px; padding: 0 16px; border-bottom: 1px solid var(--divider); white-space: nowrap; }
  .dt tbody tr { cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .dt tbody tr:hover { background: var(--hover); } }
  .dt tbody tr:last-child td { border-bottom: 0; }
  .dt tbody tr.removed td { color: var(--text-2); }
  table.dt.stock { min-width: 0; }
  .dt.stock tbody tr { cursor: default; }
  @media (hover: hover) and (pointer: fine) { .dt.stock tbody tr:hover { background: none; } }
  .dt.stock th, .dt.stock td { padding: 0 12px; }
  .dt.stock th { display: table-cell; height: 44px; white-space: normal; line-height: 1.2; }
  @media (max-width: 600px) { .dt.stock th, .dt.stock td { padding-left: 6px; padding-right: 6px; } .dt.stock td.type { min-width: 0; } }
  .dt.stock td { height: auto; padding-top: 8px; padding-bottom: 8px; }
  .dt.stock td.type { white-space: normal; min-width: 140px; }
  .dt.stock td.type .name-2 { max-width: none; white-space: normal; margin-top: 2px; }
  .dt.stock td.type a { color: inherit; }
  .qty-step { display: inline-flex; align-items: center; border: 1px solid var(--divider); border-radius: 18px; height: 34px; }
  .qty-step button { appearance: none; border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--primary-text); cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .qty-step button:hover { background: var(--hover); } }
  .qty-step button:disabled { color: var(--disabled); cursor: default; background: none; }
  .qty-step b { min-width: 28px; text-align: center; font-weight: 500; }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; white-space: nowrap; background: color-mix(in srgb, var(--error) 14%, transparent); color: var(--error); }
  .pill.ok { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }
  .stock-add { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--divider); flex-wrap: wrap; }
  .stock-add #stockType { flex: 1; min-width: 140px; max-width: 240px; }
  .stock-add .field.num { width: 72px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dt .ic-cell { width: 72px; padding-right: 0; }
  .state-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--state-icon); position: relative; }
  .state-ic::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; opacity: 0.12; }
  .state-ic .mdi { position: relative; }
  .state-ic.warn { color: var(--warning); } .state-ic.bad { color: var(--error); } .state-ic.off { color: var(--disabled); }
  .dt .name { font-size: 14px; color: var(--text); max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  .dt .name-2 { font-size: 12px; color: var(--text-2); max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  .dt .cell-sub { color: var(--text-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .st { display: inline-flex; align-items: center; gap: 8px; }
  .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .bat { display: inline-flex; align-items: center; gap: 4px; }
  .bat .mdi { width: 18px; height: 18px; color: var(--c); }
  .empty { padding: 48px 16px; text-align: center; color: var(--text-2); }
  .empty .mdi { width: 48px; height: 48px; margin: 0 auto 8px; color: var(--disabled); }
  .empty b { display: block; color: var(--text); font-size: 16px; font-weight: 500; margin-bottom: 4px; }

  /* ------------------------------------------------------------ list rows (repairs, logbook, settings) */
  .row { display: flex; align-items: center; gap: 16px; padding: 8px 16px; min-height: 72px; border-bottom: 1px solid var(--divider); }
  .row:last-child { border-bottom: 0; }
  .row.click { cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .row.click:hover { background: var(--hover); } }
  .row .text { flex: 1; min-width: 0; }
  .row .t1 { font-size: 16px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .row .t2 { font-size: 14px; color: var(--text-2); }
  .row .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .group-list { margin: 0 0 8px 72px; border-left: 2px solid var(--divider); }
  .group-list .row { min-height: 48px; padding: 6px 12px; border-bottom: 0; }
  .group-list .state-ic { width: 32px; height: 32px; }
  .group-list .t1 { font-size: 14px; }
  .section-title { margin: 8px 4px 0; font-size: 14px; font-weight: 500; color: var(--text-2); display: flex; justify-content: space-between; }
  .logday { padding: 16px 16px 4px; font-size: 14px; font-weight: 500; color: var(--text-2); }
  .log { display: flex; gap: 16px; align-items: center; padding: 6px 16px; min-height: 56px; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .log:hover { background: var(--hover); } }
  .log .text { flex: 1; min-width: 0; }
  .log .t1 { color: var(--text); }
  .log .t1 b { font-weight: 500; }
  .log .t2 { font-size: 12px; color: var(--text-2); }
  .log time { font-size: 12px; color: var(--text-2); white-space: nowrap; }

  .set-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 72px; border-top: 1px solid var(--divider); }
  .set-row:first-child { border-top: 0; }
  .set-row .text { flex: 1; min-width: 0; }
  .set-row .t1 { font-size: 16px; }
  .set-row .t2 { font-size: 14px; color: var(--text-2); }
  .set-row .ctl { flex: none; display: flex; gap: 8px; align-items: center; }
  .set-row.disabled { opacity: 0.45; }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; vertical-align: middle; flex: none; background: color-mix(in srgb, var(--error) 14%, transparent); color: var(--error); }
  .pill .mdi { width: 14px; height: 14px; }
  .set-row.links .text { min-width: 160px; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: -10px; width: 56px; height: 40px; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; left: 0; right: 0; top: 3px; height: 14px; border-radius: 7px; background: var(--disabled); opacity: 0.6; transition: background 0.15s; }
  .switch .thumb { position: absolute; top: 0; left: -2px; width: 20px; height: 20px; border-radius: 50%; background: #fafafa; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform 0.15s, background 0.15s; }
  .switch input:checked ~ .track { background: var(--primary); opacity: 0.5; }
  .switch input:checked ~ .thumb { background: var(--primary); transform: translateX(18px); }
  .switch input:disabled { cursor: not-allowed; }
  .switch input:focus-visible ~ .thumb { outline: 2px solid var(--primary); outline-offset: 2px; }
  .field { height: 40px; padding: 0 12px; border: 1px solid var(--divider); border-radius: 4px; background: var(--card); color: var(--text); font-size: 14px; min-width: 0; }
  .field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .field:disabled { opacity: 0.6; cursor: not-allowed; }
  select.field { padding-right: 8px; }
  .field.num { width: 96px; text-align: right; }
  .unit { color: var(--text-2); font-size: 14px; }
  .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--divider); }
  .info-grid > div { padding: 12px 16px; border-left: 1px solid var(--divider); min-width: 0; }
  .info-grid > div:first-child { border-left: 0; }
  .info-grid small { display: block; font-size: 12px; color: var(--text-2); }
  .info-grid b { font-weight: 400; font-size: 16px; }

  /* ------------------------------------------------------------ dialogs */
  dialog { border: 0; padding: 0; background: var(--card); color: var(--text); border-radius: 28px; box-shadow: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14), 0 9px 46px 8px rgba(0,0,0,.12); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); }
  dialog::backdrop { background: var(--scrim); }
  dialog.more { width: min(580px, calc(100vw - 32px)); display: none; }
  dialog.more[open] { display: flex; flex-direction: column; }
  .more-head { display: flex; align-items: center; gap: 4px; padding: 12px 12px 0; }
  .more-head .titles { flex: 1; min-width: 0; padding: 0 8px; }
  .more-head h2 { margin: 0; font-size: 20px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-head h2.unknown { font-style: italic; color: var(--text-2); }
  .more-head small { display: block; font-size: 14px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-tabs { display: flex; padding: 0 12px; border-bottom: 1px solid var(--divider); overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; flex: none; }
  .more-tabs .tab { height: 48px; padding: 0 14px; }
  .more-body { overflow: auto; overscroll-behavior: contain; flex: 1; min-height: 200px; }
  .more-hero { text-align: center; padding: 20px 16px 8px; }

  .map-stage.fp-mode { overflow: visible; display: flex; align-items: flex-start; }
  .map-stage.fp-mode .map-info { order: 2; position: sticky; top: 8px; flex: none; width: 300px; margin: 12px 12px 12px 0; }
  .fp { position: relative; padding: 12px; display: grid; gap: 12px; flex: 1; min-width: 0; }
  @media (max-width: 800px) { .map-stage.fp-mode { flex-direction: column; align-items: stretch; } .map-stage.fp-mode .map-info { order: 0; position: static; width: auto; margin: 8px 8px 0; box-shadow: none; } }
  .fp-lines { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
  .fp-lines path { fill: none; stroke-width: 1.6; opacity: 0.6; transition: opacity 0.15s; pointer-events: visibleStroke; }
  .fp-lines path.hot { stroke-width: 2.6; opacity: 1; }
  .fp-lines path.dim { opacity: 0.08; }
  .fp-floor { border: 1px dashed var(--divider); border-radius: 14px; padding: 8px 10px 10px; }
  .fp-floor-h { font-size: 14px; font-weight: 500; padding: 2px 4px 8px; }
  .fp-areas { display: flex; flex-wrap: wrap; gap: 10px; }
  .fp-area { flex: 1 1 200px; max-width: 100%; background: var(--card); border: 1px solid var(--divider); border-radius: 10px; padding: 6px 8px 8px; min-width: 0; }
  .fp-area.none { border-style: dashed; }
  .fp-area.coord-box { flex: 0 1 auto; }
  .fp-area.weak { border: 2px solid var(--warning); background: color-mix(in srgb, var(--warning) 7%, var(--card)); }
  .fp-area-h { display: flex; gap: 6px; align-items: baseline; font-size: 13px; color: var(--text-2); padding: 0 2px 4px; }
  .fp-area-h .n { font-size: 12px; opacity: 0.8; }
  .fp-flag { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--warning-text); padding: 0 2px 6px; }
  .fp-devs { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .fp-dev { appearance: none; border: 1px solid transparent; background: none; color: var(--text); font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 8px 3px 4px; border-radius: 14px; cursor: pointer; position: relative; z-index: 2; transition: opacity 0.15s; }
  .fp-dev span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fp-dev i { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
  .fp-dev.router i { width: 13px; height: 13px; }
  .fp-dev.coord i { width: 16px; height: 16px; }
  .fp-dev.coord { font-weight: 500; }

  @media (hover: hover) and (pointer: fine) { .fp-dev:hover { background: var(--hover); } }
  .fp-dev[aria-pressed="true"] { border-color: var(--primary); background: var(--chip-on); }
  .fp-dev.dim { opacity: 0.35; }
  .pair-dev { border-top: 1px solid var(--divider); }
  .sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: middle; }

  .sig i:nth-child(1) { height: 25%; } .sig i:nth-child(2) { height: 50%; } .sig i:nth-child(3) { height: 75%; } .sig i:nth-child(4) { height: 100%; }

  .icon-btn:active, .tab:active, .chip:not([aria-pressed="true"]):active, .menu button:active, .menu a:active, .row.click:active, .log:active, .kv > div:active, .rep-list > div:active, .pick:active, .adv:active, .map-legend .lg:active, .fp-dev:active, .dt th.sortable:active, .dt tbody tr[data-open]:active, .qty-step button:not(:disabled):active, .members a:active { background: var(--hover); }

<body>
<header class="toolbar">
  <div class="toolbar-top">
    <span class="logo" id="logo"></span>
    <h1 data-t="app.title">Zigbee Tracker</h1>
    <span class="live" id="live" title="Connection to the tracker" data-ta="title=app.connection"><i></i><span id="liveText" data-t="app.connecting">Connecting</span></span>
    <button class="icon-btn" id="menuBtn" aria-label="More options" data-ta="aria-label=menu.more" aria-haspopup="true" aria-expanded="false"></button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections" data-ta="aria-label=tabs.sections">
    <button class="tab" role="tab" data-view="devices" aria-selected="true"><span data-i="zigbee"></span><span data-t="tabs.devices">Devices</span></button>
    <button class="tab" role="tab" data-view="health" aria-selected="false"><span data-i="heart-pulse"></span><span data-t="tabs.health">Health</span> <span class="badge" id="issueBadge">0</span></button>
    <button class="tab" role="tab" data-view="updates" aria-selected="false"><span data-i="update"></span><span data-t="tabs.updates">Updates</span> <span class="badge info" id="otaBadge" hidden>0</span></button>
    <button class="tab" role="tab" data-view="activity" aria-selected="false"><span data-i="history"></span><span data-t="tabs.activity">Activity</span></button>
    <button class="tab" role="tab" data-view="map" aria-selected="false"><span data-i="sitemap"></span><span data-t="tabs.map">Map</span></button>
    <button class="tab" role="tab" data-view="settings" aria-selected="false"><span data-i="cog"></span><span data-t="tabs.settings">Settings</span></button>
  </nav>
  <div class="menu" id="menu" hidden role="menu">
    <a href="api/export.csv" download role="menuitem"><span data-i="download"></span><span data-t="menu.export_csv">Export CSV</span></a>
    <button data-act="scan" role="menuitem"><span data-i="sitemap"></span><span data-t="menu.run_scan">Run routing scan</span></button>
    <button data-act="import" role="menuitem"><span data-i="refresh"></span><span data-t="menu.import_history">Import history</span></button>
    <button data-act="pause" role="menuitem" id="pauseItem"><span data-i="bell-off"></span><span id="pauseLabel" data-t="pause.menu">Pause alerts</span></button>
    <button data-act="theme" role="menuitem"><span data-i="information-outline"></span><span id="themeLabel">Theme: Auto</span></button>
    <a href="https://github.com/tempus2016/z2m-device-tracker/wiki" target="_blank" rel="noopener" role="menuitem"><span data-i="help-circle-outline"></span><span data-t="links.wiki">Wiki</span></a>
    <a href="https://github.com/tempus2016/z2m-device-tracker" target="_blank" rel="noopener" role="menuitem"><span data-i="open-in-new"></span>GitHub</a>
    <a href="https://github.com/tempus2016/z2m-device-tracker/releases" target="_blank" rel="noopener" role="menuitem"><span data-i="note-text-outline"></span><span data-t="links.releases">Releases</span></a>
  </div>
</header>

<main class="page" id="page">
  <div class="alert conn" id="conn" style="--a: var(--error)"><span data-i="lan-disconnect"></span><div class="body" id="connText"></div></div>
  <div class="alert" id="pauseBanner" style="--a: var(--info)" hidden></div>
  <div id="view"></div>
</main>

<dialog class="more" id="more" aria-labelledby="moreTitle"></dialog>
<dialog class="more" id="pairDlg" aria-labelledby="pairTitle"></dialog>
<dialog class="more" id="replaceDlg" aria-labelledby="repTitle"></dialog>
<dialog class="more wide" id="bulkDlg" aria-labelledby="bulkTitle"></dialog>
<dialog class="confirm" id="confirmDlg" aria-labelledby="cTitle">
  <form method="dialog">
    <div class="confirm-body"><h2 id="cTitle"></h2><div id="cText"></div></div>
    <div class="confirm-actions"><button class="btn" value="cancel" type="submit" data-t="common.cancel">Cancel</button><button class="btn" value="ok" type="submit" id="cOk"></button></div>
  </form>
</dialog>
<div class="snack" id="snack" role="status"></div>

    const t = `${d.description || ""} ${d.model || ""}`.toLowerCase();
    const map = [["smoke", "smoke-detector"], ["radiator", "radiator"], ["thermostat", "thermostat"], ["receiver", "thermostat"], ["bulb", "lightbulb"], ["plug", "power-plug"], ["socket", "power-plug"],
      ["mini switch", "gesture-tap-button"], ["push button", "gesture-tap-button"], ["switch", "light-switch"], ["dimmer", "light-switch"], ["door", "door"], ["window", "window-closed-variant"], ["contact", "door"],
      ["motion", "motion-sensor"], ["presence", "motion-sensor"], ["temperature", "thermometer"], ["humidity", "thermometer"], ["air quality", "thermometer"], ["meter", "meter-electric"], ["repeater", "router-wireless"]];
    const hit = map.find(([w]) => t.includes(w));
    return hit ? hit[1] : d.type === "Router" ? "router-wireless" : "zigbee";
  };
  const stateIc = (d, cls = "") => {
    const st = statusOf(d);
    const tone = st === "removed" ? "off" : st !== "active" ? "bad" : warnings(d).length ? "warn" : "";
    return `<span class="state-ic ${tone} ${cls}">${ic(kindIcon(d))}</span>`;
  };
  const haystack = (d) => [d.ieee, d.friendly_name, ...(d.names || []).map((n) => n.name), d.model, d.vendor, d.description, d.model_id, d.manufacturer, d.oui_vendor, d.z2m_description, d.ha_name, d.area, d.note, d.instance, netLabel(d.instance), d.type, ...Object.values(d.asset || {})].filter(Boolean).join(" ").toLowerCase();

  // ------------------------------------------------------------ server-made text
  // The app sends English text (also used for HA notifications) plus msg + params. These translate it
  // when the language has the key, and fall back to the English text for anything newer or older.
  const readingName = (k) => tx(`reading.${k}`, null, cap(String(k).replace(/_/g, " ")));
  const ISSUE_VARS = {
    flapping: (p) => { p.what = listOf([p.outages ? t("issue.flapping.outages", { n: p.outages }) : null, p.leaves ? t("issue.flapping.leaves", { n: p.leaves }) : null].filter(Boolean)); },
    single_point: (p) => { p.extra = p.devices ? t("issue.single_point.extra", { n: p.devices }) : ""; },
    late: (p) => { p.every = span(p.every); },
    router_offline: (p) => { p.names = listOf([...(p.names || []), ...(p.more ? [t("issue.router_offline.more", { n: p.more })] : [])]); },
    router_hopping: (p) => { p.quality = p.lqi_min === null || p.lqi_min === undefined ? "" : p.lqi_min === p.lqi_max ? t("issue.router_hopping.lqi", { lqi: p.lqi_min }) : t("issue.router_hopping.lqi_range", { min: p.lqi_min, max: p.lqi_max }); },
    pairing_open: (p) => {
      const parts = [p.origin === "frontend" || p.origin === "mqtt" ? t(`issue.pairing_open.${p.origin}`) : null, p.device ? t("issue.pairing_open.device", { device: p.device }) : null, p.left != null ? t("issue.pairing_open.left", { duration: span(p.left) }) : null];
      p.extra = parts.filter(Boolean).map((x) => ` · ${x}`).join("");
    },
    signal_dip: (p) => { p.period = tx(`issue.signal_dip.${p.period}`, null, p.period); },
  };
  // Offline devices behind an offline router are shown inside the router's issue, not on their own.
  const nestedIssue = (i, keys) => Boolean(i.behind) && keys.has(`offline:${i.behind}`);
  const ownIssues = (issues) => { const keys = new Set(issues.map((i) => i.key)); return issues.filter((i) => !nestedIssue(i, keys)); };
  const issueVars = (i) => {
    const p = { ...(i.params || {}) };
    if (p.seconds !== undefined) p.duration = span(p.seconds);
    if (p.since) p.since = fmtDate(p.since);
    if (p.reading) p.reading = readingName(p.reading);
    ISSUE_VARS[i.msg]?.(p);
    return p;
  };
  const issueLabel = (i) => tx(`issue.label.${i.kind}`, null, i.label);
  const issueTitle = (i) => (i.msg ? tx(`issue.${i.msg}.title`, issueVars(i), i.title) : i.title);
  const issueDetail = (i) => (i.msg ? tx(`issue.${i.msg}.detail`, issueVars(i), i.detail) : i.detail);
  const isNetIssue = (i) => /^(network|group):/.test(String(i.ieee));
  const groupName = (name, bt) => (state.data.instances.length > 1 ? `${name} (${netLabel(bt)})` : name);
  const issueName = (i) => (String(i.ieee).startsWith("network:") && i.instance ? t("net.network", { name: netLabel(i.instance) }) : String(i.ieee).startsWith("group:") && i.instance ? groupName(i.name, i.instance) : i.name);
  const findingText = (f) => {
    if (!f.msg) return f.text;
    const p = { ...(f.params || {}) };
    if (p.net) p.net = netLabel(p.net);
    if (p.nets) p.nets = listOf(p.nets.map(netLabel));
    return tx(`radio.finding.${f.msg}`, p, f.text);
  };
  const checkLabel = (c) => tx(`check.${c.key}.label`, null, c.label);
  const checkDesc = (c) => tx(`check.${c.key}.description`, null, c.description);
  // Event kinds and the fixed English details the app writes (stored in history, so matched by text).
  const eventKind = (k) => tx(`event.kind.${String(k).replace(/[^a-z0-9]+/gi, "_").toLowerCase()}`, null, k);
  const EVENT_DETAILS = [
    [/^Appeared in the Z2M device list$/, "appeared"], [/^Back in the Z2M device list$/, "back"], [/^Gone from the Z2M device list$/, "gone"],
    [/^Device left the network$/, "left"], [/^Zigbee2MQTT stopped \(coordinator or service offline\)$/, "z2m_stopped"], [/^Zigbee2MQTT is running again$/, "z2m_running"],
    [/^From (.+)$/, "moved_from", ["from"]], [/^Now on (.+)$/, "now_on", ["version"]], [/^Was up (\d+) h$/, "was_up", ["n"]],
    [/^(\d+) nodes, (\d+) links$/, "scan", ["nodes", "links"]], [/^(\d+) lost binding\(s\) dismissed$/, "bindings_dismissed", ["n"]],
    [/^Rejoined while pairing was open only through (.+)$/, "repaired", ["via"]], [/^Replaces (.+)$/, "replaces", ["name"]], [/^Replaced by (.+)$/, "replaced_by", ["name"]],
  ];
  const eventDetail = (e) => {
    const d = e.detail || "";
    for (const [re, key, names = []] of EVENT_DETAILS) {
      const m = d.match(re);
      if (m) return tx(`event.detail.${key}`, Object.fromEntries(names.map((n, i) => [n, n === "n" ? Number(m[i + 1]) : m[i + 1]])), d);
    }
    return d;
  };

  const api = async (path, body) => {
    const opts = body === undefined ? { cache: "no-store" } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    const r = await fetch(path, opts);
    let data = null; try { data = await r.json(); } catch (e) { data = null; }
    if (!r.ok) throw new Error((data && (data.error || (data.errors && Object.values(data.errors).join(", ")))) || `HTTP ${r.status}`);
    return data;
  };

  const state = {
    data: null, byIeee: new Map(), view: "devices", chip: "all", query: "",
    sort: store.get("z2mt.sort") || "name", dir: Number(store.get("z2mt.dir")) || 0,
    open: null, moreTab: "info", settings: null, version: null, editing: false,
    layout: store.get("z2mt.layout") === "dialog" ? "dialog" : "pane",
    group: store.get("z2mt.group") === "1", areas: null, pairNet: null, openGroups: new Set(),
  };

  const usePane = () => state.layout === "pane" && window.innerWidth >= 1100;
  let paneMode = usePane();
  window.addEventListener("resize", () => {
    clearTimeout(window._rz);
    window._rz = setTimeout(() => { const now = usePane(); if (now !== paneMode) { paneMode = now; if (state.view === "devices") renderDevices(); if (!now) { $("#page").classList.remove("wide"); if (state.open) renderMore(true); } } }, 150);
  });

  // ------------------------------------------------------------ theme + snackbar
  const THEMES = ["auto", "light", "dark"];
  let theme = THEMES.includes(store.get("z2mt.theme")) ? store.get("z2mt.theme") : "auto";
  const applyTheme = () => {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
    $("#themeLabel").textContent = t("menu.theme", { theme: t(`theme.${theme}`) });
  };
  let snackT;
  const snack = (msg, ms = 2600) => { const s = $("#snack"); s.textContent = msg; s.classList.add("show"); clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove("show"), ms); };

  // ------------------------------------------------------------ data
  const visible = () => (state.data ? state.data.devices.filter((d) => d.type !== "Coordinator") : []);
  const setLive = (ok, err) => {
    $("#live").classList.toggle("down", !ok);
    $("#liveText").textContent = ok ? t("app.live", { networks: (state.data?.instances || []).map(netLabel).join(", ") }) : t("app.disconnected");
    $("#conn").classList.toggle("show", !ok);
    if (!ok) $("#connText").innerHTML = `<b>${th("app.unreachable")}</b> ${th("app.retrying", { error: esc(err || "") })}`;
  };
  const load = async () => {
    try {
      state.data = await api("api/devices");
      state.byIeee = new Map(state.data.devices.map((d) => [d.ieee, d]));
      state.version = state.data.version;
      if (state.view === "updates") { state.otaAt = Date.now(); state.ota = await api("api/ota").catch(() => state.ota); }
      setLive(true);
      render();
    } catch (err) { setLive(false, err.message); }
  };
  const poll = async () => { try { const { version } = await api("api/version"); if (version !== state.version) await load(); else setLive(true); } catch (err) { setLive(false, err.message); } };

  // ------------------------------------------------------------ sorting + filtering
  const DEFAULT_DIR = { last_seen: -1, signal: -1 };
  const sortDir = () => state.dir || DEFAULT_DIR[state.sort] || 1;
  const CHIPS = [
    ["all", "devices.chip.all", (d) => d.status !== "removed"],
    ["attention", "devices.chip.attention", (d) => d.status !== "removed" && (statusOf(d) !== "active" || warnings(d).length > 0)],
    ["offline", "devices.chip.offline", (d) => statusOf(d) === "offline"],
    ["ghost", "devices.chip.ghost", (d) => statusOf(d) === "ghost"],
    ["battery", "devices.chip.battery", (d) => d.status !== "removed" && typeof d.battery === "number"],
    ["critical", "devices.chip.critical", (d) => d.status !== "removed" && !!d.critical],
    ["removed", "devices.chip.removed", (d) => d.status === "removed"],
  ];
  const filtered = () => {
    const pred = (CHIPS.find((c) => c[0] === state.chip) || CHIPS[0])[2];
    const terms = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let list = visible().filter(pred);
    if (terms.length) list = list.filter((d) => { const h = haystack(d); return terms.every((t) => h.includes(t)); });
    const clean = (v) => (v ? String(v).replace(/^[^\p{L}\p{N}]+/u, "") || null : null);
    const time = (v) => { const t = v ? Date.parse(v) : NaN; return isNaN(t) ? null : t; };
    const order = { ghost: 0, offline: 1, active: 2, removed: 3 };
    const keyFns = {
      name: (d) => clean(nameOf(d)), area: (d) => clean(d.area), model: (d) => clean(deviceLine(d)),
      status: (d) => order[statusOf(d)] * 10 + (warnings(d).length ? 0 : 1),
      battery: (d) => (d.status === "removed" ? null : typeof d.battery === "number" ? d.battery : powerOf(d) ? 101 : null),
      signal: (d) => lqiOf(d), last_seen: (d) => time(d.last_seen),
    };
    const key = keyFns[state.sort] || keyFns.name;
    const dir = sortDir();
    const byName = (a, b) => { const x = clean(nameOf(a)), y = clean(nameOf(b)); if (x === null || y === null) return x === y ? collator.compare(a.ieee, b.ieee) : x === null ? 1 : -1; return collator.compare(x, y); };
    return list.map((d) => [key(d), d]).sort(([x, a], [y, b]) => {
      if (x === null || y === null) return x === y ? byName(a, b) : x === null ? 1 : -1;
      return (typeof x === "number" ? x - y : collator.compare(x, y)) * dir || byName(a, b);
    }).map(([, d]) => d);
  };

  // ------------------------------------------------------------ views
  // title and text are HTML: pass th(...) or escaped text.
  const emptyState = (icon, title, text) => `<div class="empty">${ic(icon)}<b>${title}</b>${text}</div>`;

  const renderDevices = () => {
    const all = visible();
    const list = filtered();
    const warnCount = all.filter(CHIPS[1][2]).length;
    const col = (k, key, cls = "") => {
      const label = th(key);
      const on = state.sort === k, up = on ? sortDir() > 0 : (DEFAULT_DIR[k] || 1) > 0;
      return `<th class="sortable ${on ? "on" : ""} ${cls}" data-sort="${k}" aria-sort="${on ? (sortDir() > 0 ? "ascending" : "descending") : "none"}"><span class="h">${label}${ic(up ? "arrow-up" : "arrow-down")}</span></th>`;
    };
    const pane = usePane();
    if (state.group) list.sort((a, b) => (a.area ? 0 : 1) - (b.area ? 0 : 1) || collator.compare(a.area || "", b.area || ""));
    let lastArea;
    const rows = list.map((d) => {
      const noArea = t("devices.no_area");
      const head = state.group && (d.area || noArea) !== lastArea ? `<tr class="grp"><td colspan="8">${esc(d.area || noArea)} <span>${list.filter((x) => (x.area || noArea) === (d.area || noArea)).length}</span></td></tr>` : "";
      lastArea = d.area || noArea;
      return head + rowHtml(d);
    }).join("");
    function rowHtml(d) {
      const st = statusOf(d);
      const w = warnings(d)[0];
      const statusTxt = st !== "active" ? STATUS[st].label : w ? issueLabel(w) : STATUS.active.label;
      const statusC = st !== "active" ? STATUS[st].c : w ? "var(--warning)" : STATUS.active.c;
      const former = formerOf(d);
      const lqi = lqiOf(d);
      const power = powerOf(d);
      const bat = d.status !== "removed" && typeof d.battery === "number"
        ? `<span class="bat" style="--c:${batColor(d.battery, batLow(d))}">${Math.round(d.battery)} %</span>`
        : d.status !== "removed" && power ? `<span class="muted">${power}</span>` : `<span class="muted">—</span>`;
      const prev = former.length ? t("devices.previously", { names: former.join(", ") }) : null;
      const second = pane ? [d.area, prev || deviceLine(d)].filter(Boolean).join(" · ") : prev || d.ieee;
      return `<tr class="${st === "removed" ? "removed" : ""}" data-open="${esc(d.ieee)}" tabindex="0" aria-selected="${state.open === d.ieee}">
        <td class="ic-cell">${stateIc(d)}</td>
        <td><div class="name">${esc(nameOf(d) || t("devices.unnamed"))}${d.critical && d.status !== "removed" ? ` ${critTag()}` : ""}</div><div class="name-2">${esc(second)}</div></td>
        <td class="cell-sub hide-sm col-area">${esc(d.area || "—")}</td>
        <td class="cell-sub hide-md col-model">${esc(deviceLine(d) || (d.oui_vendor ? t("devices.radio_of", { vendor: d.oui_vendor }) : t("common.unknown")))}</td>
        <td><span class="st" style="--c:${statusC}">${esc(statusTxt)}</span></td>
        <td class="num hide-sm">${bat}</td>
        <td class="num hide-md">${lqi === null ? '<span class="muted">—</span>' : sigBars(lqi)}</td>
        <td class="cell-sub hide-md" title="${esc(fmtDate(d.last_seen))}">${esc(relTime(d.last_seen))}</td>
      </tr>`;
    }
    $("#view").innerHTML = `
      ${warnCount && state.chip !== "attention" ? `<div class="alert" style="--a: var(--warning)">${ic("alert")}<div class="body"><b>${th("devices.attention", { n: warnCount })}</b> ${th("devices.attention_text")}</div><button class="btn" data-chip="attention">${th("devices.show")}</button></div>` : ""}
      <div class="tools">
        <label class="search">${ic("magnify")}<input id="q" type="search" placeholder="${esc(t("devices.search"))}" value="${esc(state.query)}" autocomplete="off" spellcheck="false" aria-label="${esc(t("devices.search"))}"></label>
        <div class="chips">${CHIPS.filter(([k, , p]) => k !== "critical" || state.chip === k || all.some(p)).map(([k, l, p]) => `<button class="chip" data-chip="${k}" aria-pressed="${state.chip === k}">${ic("check", "s18")}${th(l)} <span class="n">${all.filter(p).length}</span></button>`).join("")}</div>
        <div class="tools-right"><button class="chip toggle" data-act="group" aria-pressed="${state.group}">${ic("map-marker-outline", "s18")}${th("devices.group_by_area")}</button><button class="btn filled" data-act="pair">${ic("plus", "s18")}${th("devices.pair")}</button></div>
      </div>
      <div class="${pane ? "split" : ""}"><div class="split-list">
      <div class="card">
        <div class="table-wrap">${list.length ? `<table class="dt ${pane ? "compact" : ""}"><thead><tr><th class="ic-cell"></th>${col("name", "devices.col.name")}${col("area", "devices.col.area", "hide-sm col-area")}${col("model", "devices.col.model", "hide-md col-model")}${col("status", "devices.col.status")}${col("battery", "devices.col.battery", "num hide-sm")}${col("signal", "devices.col.signal", "num hide-md")}${col("last_seen", "devices.col.last_seen", "hide-md")}</tr></thead><tbody>${rows}</tbody></table>`
          : emptyState("magnify", th("devices.none_found"), state.query ? th("devices.no_match", { query: esc(state.query) }) : th("devices.empty_filter"))}</div>
      </div>
      <div class="count-line" style="margin:8px 4px 0;text-align:right">${th("devices.count", { shown: list.length, n: all.length })}</div>
      </div>${pane ? `<aside class="card pane" id="pane" aria-label="${esc(t("more.details"))}"></aside>` : ""}</div>`;
    $("#page").classList.toggle("wide", pane);
    if (pane) renderMore(true, true);
    const q = $("#q");
    q.addEventListener("input", () => { state.query = q.value; clearTimeout(q._t); q._t = setTimeout(() => { const pos = q.selectionStart; renderDevices(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }, 120); });
  };

  const restoreBindingsBtn = (ieee, lost) => `<button class="btn" data-act="restore-bindings" data-ieee="${esc(ieee)}">${ic("refresh", "s18")}${th(lost.length > 1 ? "bindings.restore_all" : "common.restore")}</button>`;

  const issueActions = (i) => {
    const d = state.byIeee.get(i.ieee);
    const out = [];
    if (i.kind === "frozen" || i.kind === "silent" || i.kind === "late") out.push(`<button class="btn" data-act="reconfigure" data-ieee="${esc(i.ieee)}">${th("common.reconfigure")}</button>`);
    if (i.kind === "binding_lost") {
      out.push(restoreBindingsBtn(i.ieee, d?.lost_bindings || []));
      out.push(`<button class="btn" data-act="bindings-ack" data-ieee="${esc(i.ieee)}">${th("health.intended")}</button>`);
      return out.join("");
    }
    if (i.kind === "single_point") out.push(`<button class="btn" data-view="map">${th("common.map")}</button>`);
    if (i.kind === "router_hopping" && !(state.open === i.ieee && state.moreTab === "history")) out.push(`<button class="btn" data-act="open-history" data-ieee="${esc(i.ieee)}">${th("more.tab.history")}</button>`);
    if (i.kind === "replacement" && d?.suggestions?.[0]) out.push(`<button class="btn" data-act="link" data-old="${esc(d.suggestions[0].ieee)}" data-new="${esc(i.ieee)}">${th("common.link")}</button>`);
    out.push(`<button class="btn" data-act="mute" data-ieee="${esc(i.ieee)}" data-kind="${esc(i.kind)}">${th("common.ignore")}</button>`);
    return out.join("");
  };

  const scanLine = (topics, nm) => topics.map((bt) => { const x = nm[bt] || {}; return `${netLabel(bt)}: ${x.running_since ? t("common.scanning_lower") : x.scanned_at ? relTime(x.scanned_at) : t("time.never_inline")}`; }).join(" · ");
  const renderHealth = () => {
    const issues = state.data.issues || [];
    const o = state.data.options || {};
    const nm = state.data.networkmap || {};
    const running = Object.values(nm).some((x) => x.running_since);
    const scans = scanLine(state.data.instances, nm);
    const item = (i) => {
      const d = state.byIeee.get(i.ieee);
      const tone = i.severity === "warning" ? "var(--warning)" : "var(--info)";
      if (isNetIssue(i)) {
        const panel = state.data.panels?.[i.instance];
        const icon = { network_offline: "lan-disconnect", coordinator_backup: "download", pairing_open: "link-variant" }[i.kind] || KIND_ICON[i.kind] || "refresh";
        const close = i.kind === "pairing_open" ? `<button class="btn danger" data-act="pair-stop" data-net="${esc(i.instance)}">${th("health.close_now")}</button>` : "";
        return `<div class="row"><span class="state-ic" style="color:${tone}">${ic(icon)}</span>
          <div class="text"><div class="t1">${esc(issueTitle(i))}: ${esc(issueName(i))}</div><div class="t2">${esc(issueDetail(i))}</div></div>
          <div class="acts">${close}${panel ? `<a class="btn" href="${esc(panel)}" target="_top">${th("health.open_z2m")}</a>` : ""}</div></div>`;
      }
      const kids = i.devices?.length ? issues.filter((x) => x.behind === i.ieee && nestedIssue(x, keys)) : [];
      if (kids.length) return routerItem(i, d, kids);
      return `<div class="row"><span class="state-ic" style="color:${tone}">${ic(KIND_ICON[i.kind] || "alert")}</span>
        <div class="text row-open" data-open="${esc(i.ieee)}" style="cursor:pointer"><div class="t1">${esc(issueTitle(i))}: ${esc(issueName(i))}${i.critical ? ` ${critTag()}` : ""}</div><div class="t2">${esc(issueDetail(i))}${d?.area ? ` · ${esc(d.area)}` : ""}</div></div>
        <div class="acts">${issueActions(i)}</div></div>`;
    };
    // A router that is offline with devices behind it: one row, and the devices listed under it on demand.
    const routerItem = (i, d, kids) => {
      const open = state.openGroups.has(i.ieee);
      const line = [typeLabel(d?.type || "Router"), t("health.offline_for", { duration: issueVars(i).duration }), netLabel(i.instance), d?.area].filter(Boolean).join(" · ");
      const kid = (x) => {
        const k = state.byIeee.get(x.ieee);
        return `<div class="row click" data-open="${esc(x.ieee)}"><span class="state-ic off">${ic(k ? kindIcon(k) : "zigbee", "s20")}</span>
          <div class="text"><div class="t1">${esc(x.name)}</div><div class="t2">${esc(cap(t("health.offline_for", { duration: issueVars(x).duration })))}${k?.area ? ` · ${esc(k.area)}` : ""}</div></div></div>`;
      };
      return `<div class="row"><span class="state-ic bad">${ic("router-wireless")}</span>
        <div class="text row-open" data-open="${esc(i.ieee)}" style="cursor:pointer"><div class="t1">${th("health.router_down", { n: kids.length, name: `<b style="font-weight:500">${esc(i.name)}</b>` })}</div><div class="t2">${esc(line)}</div></div>
        <div class="acts"><button class="btn" data-act="toggle-group" data-ieee="${esc(i.ieee)}" aria-expanded="${open}">${open ? th("health.hide_devices") : th("health.show_devices", { n: kids.length })}</button>${issueActions(i)}</div></div>
        ${open ? `<div class="group-list">${kids.map(kid).join("")}</div>` : ""}`;
    };
    const keys = new Set(issues.map((i) => i.key));
    const own = ownIssues(issues);
    const warn = own.filter((i) => i.severity === "warning"), info = own.filter((i) => i.severity !== "warning");
    $("#view").innerHTML = `
      <div class="card">
        <div class="card-header">${ic("heart-pulse")}<div>${th("health.title")}<small>${warn.length ? th("health.summary", { warn: warn.length, n: info.length }) : own.length ? th("health.to_review", { n: info.length }) : th("health.nothing")}</small></div></div>
        <div class="info-grid">
          <div><small>${th("health.alerts")}</small><b>${o.alerts_enabled === false ? th("health.alerts_off") : esc([o.persistent_notifications ? t("health.ha_notifications") : null, o.notify_service || null].filter(Boolean).join(", ")) || th("health.event_only")}</b></div>
          <div><small>${th("health.thresholds")}</small><b>${th("health.thresholds_line", { offline: esc(o.offline_alert_minutes), frozen: esc(o.frozen_alert_hours), battery: esc(o.battery_alert_percent) })}</b></div>
          <div><small>${th("health.routing_scan")}</small><b>${esc(scans)}</b></div>
        </div>
        <div class="card-actions"><button class="btn" data-view="settings">${th("health.alert_settings")}</button><button class="btn ${running ? "busy" : ""}" data-act="scan" ${running ? "disabled" : ""}>${ic(running ? "refresh" : "sitemap", "s18")}${running ? th("common.scanning") : th("menu.run_scan")}</button></div>
      </div>
      ${coordinatorsCard()}
      ${shoppingCard()}
      ${leftoverCard()}
      ${radioCard()}
      ${groupsCard()}
      ${warn.length ? `<div class="section-title">${th("health.needs_attention")} <span>${warn.length}</span></div><div class="card">${warn.map(item).join("")}</div>` : ""}
      ${info.length ? `<div class="section-title">${th("health.worth_a_look")} <span>${info.length}</span></div><div class="card">${info.map(item).join("")}</div>` : ""}
      ${!own.length ? `<div class="card">${emptyState("check", th("health.all_clear"), th("health.all_clear_text"))}</div>` : ""}`;
  };

  const coordinatorsCard = () => {
    const B = state.data.bridges || {};
    const week = Date.now() - 7 * 86400000;
    const nets = state.data.instances.map((bt) => {
      const b = B[bt] || {}, info = b.info || {}, h = b.health || {};
      const online = b.state !== "offline";
      const outages = (b.outages || []).filter((o) => new Date(o.start).getTime() >= week);
      const downMin = Math.round(outages.reduce((t, o) => t + ((o.end ? new Date(o.end) : Date.now()) - new Date(o.start)) / 60000, 0));
      const restarts = (b.restarts || []).filter((r) => new Date(r).getTime() >= week).length;
      const last = [...(b.outages || [])].reverse()[0];
      const panel = state.data.panels?.[bt];
      const bk = (state.data.backups || {})[bt];
      const leaves = (state.data.events || []).filter((e) => e.kind === "left" && e.instance === bt && new Date(e.time).getTime() >= week).length;
      const backup = !bk ? null : !bk.found ? t("coord.backup_not_found") : !bk.exists ? t("coord.backup_missing") : bk.error ? bk.error
        : [relTime(bk.date), t("coord.backup_devices", { n: bk.devices }), bk.has_key ? null : t("coord.backup_no_key")].filter(Boolean).join(" · ");
      return `<div class="coord">
        <div class="row" style="border:0;min-height:56px"><span class="state-ic" style="color:${b.state ? (online ? "var(--success)" : "var(--error)") : "var(--text-2)"}">${ic(online ? "zigbee" : "lan-disconnect")}</span>
          <div class="text"><div class="t1">${th("net.network", { name: esc(netLabel(bt)) })}</div><div class="t2">${b.state ? th(online ? "coord.online_since" : "coord.offline_since", { date: esc(fmtDate(b.since)) }) : th("coord.waiting")}</div></div>
          ${panel ? `<a class="btn" href="${esc(panel)}" target="_top">${th("common.open")}${ic("open-in-new", "s18")}</a>` : ""}</div>
        ${kv([["Zigbee2MQTT", info.version], [th("coord.coordinator"), [info.coordinator_type, info.firmware ? t("coord.firmware", { version: info.firmware }) : null].filter(Boolean).join(" · ")], [th("coord.channel_pan"), info.channel ? `${info.channel} / ${info.pan_id ?? "?"}` : null],
          [th("coord.running_for"), h.uptime_sec ? span(h.uptime_sec) : null], [th("coord.memory"), h.memory_mb ? t("coord.memory_mb", { n: Math.round(h.memory_mb) }) : null],
          [th("coord.mqtt"), h.mqtt_published != null ? t("coord.mqtt_value", { sent: compactNum(h.mqtt_published), received: compactNum(h.mqtt_received ?? 0) }) : null], [th("coord.leaves_week"), String(leaves)],
          [th("coord.last_7_days"), [t("coord.outages", { n: outages.length }) + (outages.length ? ` ${t("coord.down_for", { n: downMin })}` : ""), t("coord.restarts", { n: restarts })].join(" · ")],
          [th("coord.last_outage"), last ? (last.end ? t("coord.outage_for", { date: fmtDate(last.start), duration: span((new Date(last.end) - new Date(last.start)) / 1000) }) : t("coord.outage_ongoing", { date: fmtDate(last.start) })) : t("coord.none_recorded")],
          [th("coord.backup"), backup]])}
        ${coordHealth(bt, b)}
      </div>`;
    }).join("");
    return `<div class="card"><div class="card-header">${ic("router-wireless")}<div>${th("coord.title")}<small>${th("coord.subtitle")}</small></div></div>${nets}</div>`;
  };

  const compactNum = (n) => intl((l) => new Intl.NumberFormat(l, { notation: "compact", maximumFractionDigits: 1 }).format(n));
  // Zigbee2MQTT's own health (bridge/health): 14-day memory bars and the memory-growth notice.
  const coordHealth = (bt, b) => {
    const h = b.health || {};
    if (!h.updated) return `<div class="coord-extra"><div class="muted" style="font-size:13px">${th("coord.health_off")}</div></div>`;
    const days = new Map((b.memory_days || []).map(([d, mb]) => [d, mb]));
    if (!days.size) return "";
    const issue = (state.data.issues || []).find((i) => i.kind === "z2m_memory" && i.instance === bt);
    const key = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    const slots = [...Array(14).keys()].map((i) => { const dt = new Date(); dt.setHours(12, 0, 0, 0); dt.setDate(dt.getDate() - 13 + i); return { dt, mb: days.get(key(dt)) }; });
    const top = Math.max(...slots.map((x) => x.mb || 0)) * 1.1 || 1;
    const label = (dt) => intl((l) => dt.toLocaleDateString(l, { day: "numeric", month: "short" }));
    const hov = slots.map((x) => [null, null, label(x.dt), x.mb == null ? t("chart.no_data") : t("chart.memory", { value: Math.round(x.mb) })]);
    const bars = slots.map((x, i) => x.mb == null ? `<i class="none" role="img" aria-label="${esc(`${hov[i][2]}: ${hov[i][3]}`)}"></i>`
      : `<i class="${issue && i >= 7 ? "hi" : ""}" style="height:${Math.max(3, (x.mb / top) * 100).toFixed(1)}%" role="img" aria-label="${esc(t("coord.memory_bar", { date: label(x.dt), n: Math.round(x.mb) }))}"></i>`).join("");
    return `<div class="coord-extra"><div class="sub-h">${th("coord.memory_chart")}</div>
      <div class="mem-bars" role="group" aria-label="${esc(t("coord.memory_chart"))}" ${hoverAttrs(`mem-${bt}`, { bars: true, p: hov })}>${bars}</div>
      <div class="mem-axis"><span>${esc(label(slots[0].dt))}</span><span>${th("coord.today")}</span></div>
      ${issue ? `<div class="alert" style="--a:var(--warning)">${ic("chip")}<div class="body">${esc(issueDetail(issue))}</div></div>` : ""}</div>`;
  };

  const radioCard = () => {
    const r = state.data.radio;
    if (!r || !r.networks.length) return "";
    const W = 640, H = 120, x = (mhz) => ((mhz - 2400) / 85) * (W - 20) + 10;
    const wf = (n) => (n === 14 ? 2484 : 2407 + 5 * n), zf = (c) => 2405 + 5 * (c - 11);
    const wifiBands = r.wifi.map((n) => `<rect x="${x(wf(n) - 11).toFixed(1)}" y="18" width="${(x(wf(n) + 11) - x(wf(n) - 11)).toFixed(1)}" height="54" rx="6" fill="var(--warning)" fill-opacity="0.18" stroke="var(--warning)" stroke-opacity="0.5"/><text x="${x(wf(n)).toFixed(1)}" y="14" text-anchor="middle">${th("radio.wifi_n", { n })}</text>`).join("");
    const ticks = [...Array(16).keys()].map((i) => { const c = 11 + i, used = r.networks.filter((n) => n.channel === c); return `<line x1="${x(zf(c)).toFixed(1)}" x2="${x(zf(c)).toFixed(1)}" y1="${used.length ? 24 : 62}" y2="72" stroke="${used.length ? "var(--primary)" : "var(--divider)"}" stroke-width="${used.length ? 4 : 2}" stroke-linecap="round"/><text x="${x(zf(c)).toFixed(1)}" y="88" text-anchor="middle" ${used.length ? 'class="on"' : ""}>${c}</text>${used.length ? `<text x="${x(zf(c)).toFixed(1)}" y="104" text-anchor="middle" class="on">${esc(used.map((n) => netLabel(n.topic)).join(" + "))}</text>` : ""}`; }).join("");
    return `<div class="card"><div class="card-header">${ic("signal")}<div>${th("radio.title")}<small>${th("radio.subtitle", { zigbee: esc([...new Set(r.networks.map((n) => n.channel))].join(", ")), wifi: r.wifi.length ? esc(r.wifi.join(", ")) : th("radio.not_set") })}</small></div></div>
      <div class="chart-wrap"><svg class="spectrum" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("radio.chart"))}">${wifiBands}${ticks}<text x="10" y="118" class="axis">2400 MHz</text><text x="${W - 10}" y="118" text-anchor="end" class="axis">2485 MHz</text></svg></div>
      ${hoursChart()}
      <div class="advice">${r.findings.map((f) => `<div class="adv"><span class="state-ic" style="color:${f.sev >= 2 ? "var(--warning)" : f.sev === 1 ? "var(--info)" : "var(--success)"}">${ic(f.sev ? "alert" : "check")}</span><div class="text">${esc(findingText(f))}</div></div>`).join("")}</div>
      <div class="card-actions"><button class="btn" data-view="settings">${th("radio.edit_wifi")}</button></div></div>`;
  };

  // Average link quality by hour of day (last 7 days), one chart per network, with daily dips marked.
  const hoursChart = () => {
    const all = state.data.network_hours || {};
    const nets = state.data.instances.filter((bt) => all[bt]);
    return nets.map((bt) => {
      const h = all[bt], hours = h.hours;
      const issue = (state.data.issues || []).find((i) => i.key === `signal_dip:${bt}`);
      const max = Math.max(...hours.map((x) => x?.lqi || 0)) || 1;
      const inDip = new Set(h.dips.flatMap((d) => [...Array(d.hours).keys()].map((k) => (d.start + k) % 24)));
      const hh = (n) => `${String(n).padStart(2, "0")}:00`;
      const hov = hours.map((x, i) => [null, null, hh(i), ...(!x ? [t("chart.no_data")] : [t("chart.lqi", { value: Math.round(x.lqi) }), ...(x.drop >= 5 ? [t("chart.below_usual", { drop: x.drop })] : [])])]);
      const bars = hours.map((x, i) => {
        if (!x) return `<i class="none" role="img" aria-label="${esc(`${hh(i)}: ${t("chart.no_data")}`)}"></i>`;
        const cls = inDip.has(i) ? "bad" : h.dips.length && x.drop >= 12 ? "lo" : "";
        const tip = x.drop >= 5 ? t("radio.hours_bar_drop", { hour: hh(i), lqi: Math.round(x.lqi), drop: x.drop }) : t("radio.hours_bar", { hour: hh(i), lqi: Math.round(x.lqi) });
        return `<i class="${cls}" style="height:${Math.max(3, (x.lqi / max) * 100).toFixed(1)}%" role="img" aria-label="${esc(tip)}"></i>`;
      }).join("");
      return `<div class="sub-h">${th("radio.hours_title", { n: h.devices })}${state.data.instances.length > 1 ? ` · ${th("radio.hours_net", { net: esc(netLabel(bt)) })}` : ""}</div>
        <div class="hour-bars" role="group" aria-label="${esc(t("radio.hours_title", { n: h.devices }))}" ${hoverAttrs(`hours-${bt}`, { bars: true, p: hov })}>${bars}</div>
        <div class="hour-axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>
        ${issue ? `<div class="hour-dip"><div class="alert" style="--a:var(--warning)">${ic("signal")}<div class="body"><b>${esc(issueTitle(issue))}.</b> ${esc(issueDetail(issue))}</div></div></div>` : ""}`;
    }).join("");
  };

  // Zigbee2MQTT groups: members offline, and members that left the group while staying on the network.
  const groupsCard = () => {
    const groups = state.data.group_health || [];
    if (!groups.length) return "";
    const iconOf = (g) => {
      const count = {};
      g.members.forEach((m) => { const d = state.byIeee.get(m.ieee); if (d) { const k = kindIcon(d); count[k] = (count[k] || 0) + 1; } });
      return Object.keys(count).sort((a, b) => count[b] - count[a])[0] || "lightbulb";
    };
    const chip = (ieee, color, text) => `<a href="#${esc(ieee)}" data-open="${esc(ieee)}"${color ? ` style="--c:${color}"` : ""}>${esc(text)}</a>`;
    const row = (g) => {
      const online = g.total - g.offline;
      const bad = g.offline > 0, left = g.left.length > 0;
      const facts = [t("groups.online", { online, n: g.total })];
      if (left) facts.push(g.left.length === 1 ? t("groups.left_one", { date: fmtDate(g.left[0].at, false) }) : t("groups.left_many", { n: g.left.length }));
      const tone = bad ? "var(--warning)" : left ? "var(--state-icon)" : "var(--success)";
      const pill = bad ? `<span class="badge warn">${th("groups.offline_n", { n: g.offline })}</span>` : left ? `<span class="badge info">${th("groups.check")}</span>` : "";
      const head = `<div class="row${bad || left ? " has-members" : " compact"}"><span class="state-ic" style="color:${tone}">${ic(iconOf(g), bad || left ? "" : "s18")}</span>
        <div class="text"><div class="t1">${esc(groupName(g.name, g.instance))}</div><div class="t2">${esc(facts.join(" · "))}</div></div>${pill}</div>`;
      if (!bad && !left) return head;
      const chips = g.members.map((m) => m.offline
        ? chip(m.ieee, "var(--error)", m.offline_seconds !== null && m.offline_seconds !== undefined ? t("groups.chip_offline", { name: m.name, duration: span(m.offline_seconds) }) : t("groups.chip_offline_now", { name: m.name }))
        : chip(m.ieee, null, m.name));
      const gone = g.left.map((m) => chip(m.ieee, "var(--disabled)", t("groups.chip_left", { name: m.name, date: fmtDate(m.at, false) })));
      return `${head}<div class="members">${[...chips, ...gone].join("")}</div>`;
    };
    const problems = groups.filter((g) => g.offline || g.left.length).length;
    return `<div class="card"><div class="card-header">${ic("lightbulb")}<div>${th("groups.title")}<small>${problems ? th("groups.subtitle_problems", { n: groups.length, bad: problems }) : th("groups.subtitle", { n: groups.length })}</small></div></div>
      ${groups.map(row).join("")}</div>`;
  };

  // Spares in the drawer per battery type (state.data.battery_stock), matched without regard to case.
  const stockKey = (type) => Object.keys(state.data.battery_stock || {}).find((k) => k.toLowerCase() === String(type).toLowerCase());
  const stockOf = (type) => { const k = stockKey(type); return k === undefined ? 0 : state.data.battery_stock[k]; };
  const shoppingCard = () => {
    const groups = state.data.battery_shopping || [];
    const stock = state.data.battery_stock || {};
    const hasBattery = state.data.devices.some((d) => d.battery_record && d.status === "active");
    if (!groups.length && !hasBattery && !Object.values(stock).some((n) => n > 0)) return "";
    const unknown = (g) => g.type === "Unknown type";
    const btype = (g) => (unknown(g) ? t("shop.unknown_type") : g.type);
    const facts = (x) => [x.battery !== null && x.battery !== undefined ? `${Math.round(x.battery)} %` : t("shop.low"), x.days !== null && x.days !== undefined ? t("shop.about_days", { n: Math.max(0, Math.round(x.days)) }) : null, x.quantity > 1 ? t("shop.takes", { n: x.quantity }) : null].filter(Boolean).join(", ");
    const needed = new Set(groups.map((g) => g.type.toLowerCase()));
    const rows = [
      ...groups.map((g) => { const have = unknown(g) ? 0 : stockOf(g.type); return { g, type: g.type, need: g.count, have, buy: Math.max(0, g.count - have) }; }),
      ...Object.entries(stock).filter(([k, n]) => n > 0 && !needed.has(k.toLowerCase())).sort((a, b) => collator.compare(a[0], b[0])).map(([k, n]) => ({ g: null, type: k, need: 0, have: n, buy: 0 })),
    ];
    const toBuy = rows.filter((r) => r.buy > 0).map((r) => `${r.buy}× ${r.g ? btype(r.g) : r.type}`).join(", ");
    const sub = toBuy ? th("shop.subtitle_buy", { total: esc(toBuy) }) : groups.length ? th("shop.subtitle_enough") : th("shop.subtitle_none");
    const stepper = (r) => (r.g && unknown(r.g) ? `<span class="t2">–</span>` : `<span class="qty-step" role="group" aria-label="${esc(t("shop.in_stock_of", { type: r.type }))}"><button data-act="stock" data-type="${esc(r.type)}" data-delta="-1" aria-label="${esc(t("shop.one_less"))}" ${r.have ? "" : "disabled"}>${ic("minus", "s18")}</button><b>${r.have}</b><button data-act="stock" data-type="${esc(r.type)}" data-delta="1" aria-label="${esc(t("shop.one_more"))}">${ic("plus", "s18")}</button></span>`);
    const devs = (g) => (g ? `<div class="name-2">${g.devices.map((x) => `<a href="#${esc(x.ieee)}" data-open="${esc(x.ieee)}">${esc(x.name)}</a> (${esc(facts(x))})`).join(" · ")}</div>` : "");
    const types = [...new Set(["CR2032", "CR2450", "CR2477", "CR1632", "CR123A", "AAA", "AA", ...state.data.devices.map((d) => d.battery_record?.type).filter(Boolean)])].filter((x) => !rows.some((r) => r.type.toLowerCase() === x.toLowerCase()));
    return `<div class="card"><div class="card-header">${ic("battery-alert-variant-outline")}<div>${th("shop.title")}<small>${sub}</small></div></div>
      ${rows.length ? `<div class="table-wrap"><table class="dt stock"><thead><tr><th>${th("shop.col_type")}</th><th>${th("shop.col_stock")}</th><th class="num">${th("shop.col_need")}</th><th class="num"><span class="sr">${th("shop.col_buy")}</span></th></tr></thead><tbody>
        ${rows.map((r) => `<tr><td class="type"><div>${esc(r.g ? btype(r.g) : r.type)}</div>${devs(r.g)}</td><td>${stepper(r)}</td><td class="num">${r.need}</td><td class="num">${r.buy ? `<span class="pill">${th("shop.buy", { n: r.buy })}</span>` : `<span class="pill ok">${th("shop.enough")}</span>`}</td></tr>`).join("")}
      </tbody></table></div>` : ""}
      <div class="stock-add"><input class="field" id="stockType" list="stockTypes" placeholder="${esc(t("shop.add_placeholder"))}" aria-label="${esc(t("battery.type"))}" maxlength="40" autocomplete="off"><input class="field num" id="stockN" type="number" min="1" max="999" value="1" aria-label="${esc(t("shop.add_count"))}"><button class="btn" data-act="stock-add">${ic("plus", "s18")}${th("shop.add")}</button>
        <datalist id="stockTypes">${types.map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist></div>
    </div>`;
  };

  // ------------------------------------------------------------ leftovers in Home Assistant
  // Zigbee2MQTT devices still in HA after leaving Zigbee2MQTT. Removing them always goes through the dialog.
  const leftoverLine = (x) => [x.successor ? t("leftover.replaced_by", { name: x.successor.name }) : x.removed_at ? t("leftover.removed_on", { date: fmtDate(x.removed_at, false) }) : t("leftover.not_in_z2m"),
    t("leftover.entities", { n: x.entities })].join(" · ");
  const leftoverUse = (x) => [x.automations ? t("leftover.automations", { n: x.automations }) : null, x.scripts ? t("leftover.scripts", { n: x.scripts }) : null].filter(Boolean);
  const leftoverIc = (x) => { const d = state.byIeee.get(x.ieee); return d ? stateIc(d) : `<span class="state-ic off">${ic("zigbee")}</span>`; };
  const leftoverCard = () => {
    const list = state.data.ha_leftovers || [];
    if (!list.length) return "";
    return `<div class="card"><div class="card-header">${ic("home-assistant")}<div>${th("leftover.title")}<small>${th("leftover.subtitle", { n: list.length })}</small></div></div>
      ${list.map((x) => `<div class="row">${leftoverIc(x)}<div class="text"><div class="t1">${esc(x.name)}</div><div class="t2">${esc(leftoverLine(x))}</div></div></div>`).join("")}
      <div class="card-actions"><button class="btn" data-act="leftovers">${ic("delete", "s18")}${th("leftover.review")}</button></div></div>`;
  };
  const leftoverOk = () => { const n = document.querySelectorAll('#cText input[name="lo"]:checked').length; $("#cOk").textContent = t("leftover.remove_n", { n }); $("#cOk").disabled = !n; };

  // ------------------------------------------------------------ network map
  // Interactive force-directed map (drag dots, pan, zoom) plus advice from the routing scan.
  const MAP = { sims: {}, sel: {}, allLinks: store.get("z2mt.mapAll") === "1", rendered: null, hist: {}, scanSel: {}, cmpSel: {},
    filter: new Set((store.get("z2mt.mapFilter") || "").split(",").filter((x) => ["coord", "router", "end", "attention"].includes(x))) };
  // Legend groups double as filters. Each device falls in exactly one group, matching its dot colour.
  const MAP_GROUPS = [["coord", "map.coordinator", "var(--text)"], ["router", "map.router", "var(--primary)"], ["end", "map.battery_device", "var(--state-icon)"], ["attention", "map.needs_attention", "var(--warning)"]];
  const mapGroup = (d) => (d.type === "Coordinator" ? "coord" : statusOf(d) !== "active" || warnings(d).length ? "attention" : d.type === "Router" ? "router" : "end");
  const mapLegend = (bt, devs) => {
    const n = {}; devs.forEach((d) => { const g = mapGroup(d); n[g] = (n[g] || 0) + 1; });
    const on = MAP.filter.size > 0;
    return `<div class="map-legend" role="group" aria-label="${esc(t("map.filter_aria"))}">${MAP_GROUPS.map(([k, label, col]) => `<button class="lg" data-mapfilter="${k}" aria-pressed="${MAP.filter.has(k)}" title="${esc(t(MAP.filter.has(k) ? "map.filter_stop" : on ? "map.filter_also" : "map.filter_only"))}"><i style="background:${col}"></i>${th(label)}<span class="n">${n[k] || 0}</span></button>`).join("")}${on ? `<button class="btn" data-mapfilter="">${ic("close", "s18")}${th("map.show_all")}</button>` : ""}</div>`;
  };
  const loadScanHistory = async (bt) => { if (MAP.hist[bt]) return; try { MAP.hist[bt] = (await api(`api/scans?net=${encodeURIComponent(bt)}`)).scans || []; } catch (e) { MAP.hist[bt] = []; } };
  const mapDiff = (bt) => {
    if (!MAP.cmpSel[bt]) return null;
    const hist = MAP.hist[bt] || [];
    const now = MAP.scanSel[bt] ? scanRecord(bt, MAP.scanSel[bt]) : hist[hist.length - 1];
    const old = scanRecord(bt, MAP.cmpSel[bt]);
    if (!now || !old) return null;
    const moved = [], better = [], worse = [];
    Object.entries(now.parents).forEach(([dev, [p, q]]) => {
      const was = old.parents[dev];
      if (!was) return;
      if (was[0] !== p) moved.push({ dev, from: was[0], to: p, oldQ: was[1], newQ: q });
      else if (q !== null && was[1] !== null && q - was[1] >= 25) better.push({ dev, p, oldQ: was[1], newQ: q });
      else if (q !== null && was[1] !== null && was[1] - q >= 25) worse.push({ dev, p, oldQ: was[1], newQ: q });
    });
    const status = {};
    moved.forEach((m) => (status[[m.dev, m.to].sort().join("|")] = "moved"));
    better.forEach((m) => (status[[m.dev, m.p].sort().join("|")] = "better"));
    worse.forEach((m) => (status[[m.dev, m.p].sort().join("|")] = "worse"));
    return { moved, better, worse, status, oldAt: old.at, nowAt: now.at };
  };
  const lqiCol = (q) => (q === null || q === undefined ? "var(--disabled)" : q >= 100 ? "var(--success)" : q >= 50 ? "var(--warning)" : "var(--error)");
  const mapNodeCol = (d) => { if (d.type === "Coordinator") return "var(--text)"; const st = statusOf(d); return st !== "active" ? "var(--error)" : warnings(d).length ? "var(--warning)" : d.type === "Router" ? "var(--primary)" : "var(--state-icon)"; };

  const scanRecord = (bt, at) => (MAP.hist[bt] || []).find((x) => x.at === at) || null;
  const mapGraph = (bt) => {
    const rec = MAP.scanSel[bt] ? scanRecord(bt, MAP.scanSel[bt]) : null;
    if (rec) {
      const ids = new Set([...Object.keys(rec.parents), ...Object.values(rec.parents).map((p) => p[0]), ...rec.links.flatMap((l) => [l[0], l[1]])]);
      const devs = state.data.devices.filter((d) => ids.has(d.ieee) || (d.instance === bt && d.type === "Coordinator"));
      const links = [...Object.entries(rec.parents).map(([c, p]) => ({ a: c, b: p[0], lqi: p[1], parent: true })), ...rec.links.map((l) => ({ a: l[0], b: l[1], lqi: l[2], parent: false }))];
      return { devs, links, historic: true };
    }
    const devs = state.data.devices.filter((d) => d.instance === bt && d.status !== "removed" && (d.routing || d.type === "Coordinator"));
    const ids = new Set(devs.map((d) => d.ieee));
    const links = new Map();
    devs.forEach((d) => {
      const r = d.routing;
      if (!r) return;
      if (r.parent && ids.has(r.parent.ieee)) {
        links.set([d.ieee, r.parent.ieee].sort().join("|"), { a: d.ieee, b: r.parent.ieee, lqi: r.parent.lqi, parent: true });
      }
      if (d.type === "Router") {
        (r.neighbours || []).forEach((n) => {
          const other = state.byIeee.get(n.ieee);
          if (!ids.has(n.ieee) || !other || other.type === "EndDevice") return;
          const key = [d.ieee, n.ieee].sort().join("|");
          const prev = links.get(key);
          if (!prev) links.set(key, { a: d.ieee, b: n.ieee, lqi: n.lqi, parent: false });
          else if (!prev.parent && (n.lqi || 0) > (prev.lqi || 0)) prev.lqi = n.lqi;
        });
      }
    });
    return { devs, links: [...links.values()] };
  };

  const mapAdvice = (bt) => {
    const devs = visible().filter((d) => d.instance === bt && d.status !== "removed");
    const coord = state.data.devices.find((d) => d.instance === bt && d.type === "Coordinator");
    const scanned = devs.filter((d) => d.routing);
    if (!scanned.length) return [];
    const name = (ieee) => nameOf(state.byIeee.get(ieee)) || ieee;
    const link = (ieee) => `<a href="#${esc(ieee)}" data-mapsel="${esc(ieee)}" data-net="${esc(bt)}">${esc(name(ieee))}</a>`;
    const out = [];
    const routers = devs.filter((d) => d.type === "Router" && statusOf(d) === "active");
    const ends = devs.filter((d) => d.type === "EndDevice");

    // 1. weak parent link where a better router can hear the device
    ends.forEach((d) => {
      const p = d.routing?.parent;
      if (!p || p.lqi === null || p.lqi === undefined || p.lqi >= 60) return;
      const better = (d.routing.neighbours || []).filter((n) => n.ieee !== p.ieee && state.byIeee.get(n.ieee)?.type === "Router" && (n.lqi || 0) >= Math.max(80, p.lqi + 40)).sort((a, b) => b.lqi - a.lqi)[0];
      if (better) {
        out.push({ sev: 2, icon: "swap-horizontal", text: th("advice.better_router", { device: link(d.ieee), parent: link(p.ieee), lqi: p.lqi, better: link(better.ieee), better_lqi: better.lqi, name: esc(name(d.ieee)), better_name: esc(name(better.ieee)) }) });
      } else {
        const alt = suggestRouter(d);
        const where = state.byIeee.get(p.ieee)?.area;
        const inArea = (ieee, area) => (area ? th("advice.in_area", { name: link(ieee), area: esc(area) }) : link(ieee));
        const weak = th("advice.weak_link", { device: inArea(d.ieee, d.area), parent: inArea(p.ieee, where), lqi: p.lqi });
        out.push(alt
          ? { sev: 2, icon: "swap-horizontal", text: `${weak} ${th("advice.same_room_router", { router: link(alt.ieee) })}`,
              action: `<button class="btn" data-act="move" data-ieee="${esc(d.ieee)}" data-via="${esc(alt.ieee)}">${th("advice.move")}</button>` }
          : { sev: 2, icon: "router-wireless", text: `${weak} ${d.area ? th("advice.no_router_in", { area: esc(d.area) }) : th("advice.no_router_room")}` });
      }
    });

    // 2. routers whose best link is weak
    routers.forEach((d) => {
      const best = Math.max(0, ...(d.routing?.neighbours || []).filter((n) => state.byIeee.get(n.ieee)?.type !== "EndDevice").map((n) => n.lqi || 0));
      if (d.routing && best < 50) out.push({ sev: 2, icon: "lan-disconnect", text: th("advice.weak_router", { router: d.area ? th("advice.in_area", { name: link(d.ieee), area: esc(d.area) }) : link(d.ieee), lqi: best }) });
    });

    // 3. overloaded parents
    const kids = {};
    ends.forEach((d) => { const p = d.routing?.parent?.ieee; if (p) kids[p] = (kids[p] || 0) + 1; });
    Object.entries(kids).forEach(([p, n]) => {
      const isCoord = coord && p === coord.ieee;
      if ((isCoord && n > 12) || (!isCoord && n > 10)) out.push({ sev: 1, icon: "sitemap", text: th("advice.overloaded", { router: isCoord ? th("advice.the_coordinator") : link(p), n }) });
    });

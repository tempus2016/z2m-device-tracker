  };
  const go = (view) => { state.view = view; state.settingsShown = false; render(); window.scrollTo(0, 0); };

  // ------------------------------------------------------------ actions
  const flash = (sel) => { const s = $(sel); if (!s) return; s.classList.add("show"); setTimeout(() => s.classList.remove("show"), 1600); };
  const actions = {
    close: () => closeDevice(),
    async copy(b) { try { await navigator.clipboard.writeText(b.dataset.ieee); snack("IEEE address copied"); } catch (e) { snack(b.dataset.ieee); } },
    async reconfigure(b) {
      const ieee = b.dataset.ieee, d = state.byIeee.get(ieee);
      const battery = d?.power_source === "Battery" || typeof d?.battery === "number";
      const ok = await confirmDialog({ title: `Reconfigure ${nameOf(d) || ieee}?`, ok: "Reconfigure",
        html: `<p>Zigbee2MQTT sends the binding and reporting setup to the device again. Names, settings and history aren't changed.</p><p>Use it when a device stops updating a value. It can take up to 40 seconds.</p>${statusOf(d) === "offline" ? `<div class="alert" style="--a:var(--error)">${ic("wifi-off")}<div class="body">This device is offline (last heard ${esc(relTime(d.last_seen).toLowerCase())}), so it probably won't respond. Check it has power first.</div></div>` : ""}${battery ? `<div class="alert" style="--a:var(--warning)">${ic("alert")}<div class="body">This device runs on battery and may be asleep. Press its button just before you confirm.</div></div>` : ""}` });
      if (!ok) return;
      b.disabled = true; b.classList.add("busy");
      snack(`Reconfiguring ${nameOf(d) || ieee}…`, 8000);
      try { await api("api/reconfigure", { ieee }); snack("Reconfigured"); } catch (err) { snack(`Reconfigure failed: ${err.message}`, 5000); }
      b.disabled = false; b.classList.remove("busy"); load();
    },
    async mute(b) {
      const d = state.byIeee.get(b.dataset.ieee);
      const ok = await confirmDialog({ title: "Ignore this alert?", ok: "Ignore",
        html: `<p>Stops flagging this problem for ${esc(nameOf(d) || b.dataset.ieee)}. Other devices aren't affected.</p><label>For<select class="field" id="cDays"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="0">Forever</option></select></label>` });
      if (!ok) return;
      const days = Number($("#cDays").value);
      try { await api("api/mute", { ieee: b.dataset.ieee, kind: b.dataset.kind, muted: true, days: days || null }); snack(days ? `Ignored for ${days} day${days === 1 ? "" : "s"}` : "Ignored. Undo in Settings."); load(); } catch (err) { snack(err.message); }
    },
    group(b) { state.group = !state.group; store.set("z2mt.group", state.group ? "1" : "0"); renderDevices(); },
    async rename() {
      const ieee = state.open, d = state.byIeee.get(ieee);
      await loadAreas();
      const areaOpts = state.areas ? `<option value="">No area</option>${state.areas.map((a) => `<option value="${esc(a.id)}" ${a.name === d.area ? "selected" : ""}>${esc(a.name)}</option>`).join("")}` : "";
      const ok = await confirmDialog({ title: "Rename or set area", ok: "Save",
        html: `<p>Changes the name in Zigbee2MQTT and Home Assistant together, including entity IDs.</p><label>Name<input class="field" id="cName" value="${esc(nameOf(d) || "")}" maxlength="120" autocomplete="off"></label>${state.areas ? `<label>Area<select class="field" id="cArea" ${d.ha_device_id ? "" : "disabled"}>${areaOpts}</select></label>${d.ha_device_id ? "" : `<p>Area can't be set because this device isn't in Home Assistant yet.</p>`}` : `<p>Areas couldn't be loaded from Home Assistant.</p>`}` });
      if (!ok) return;
      const name = $("#cName").value.trim(), area = $("#cArea")?.value ?? null;
      const currentArea = state.areas?.find((a) => a.name === d.area)?.id || "";
      try {
        if (name && name !== nameOf(d)) { await api("api/rename", { ieee, name }); }
        if (state.areas && d.ha_device_id && area !== null && area !== currentArea) { await api("api/area", { ieee, area_id: area || null }); }
        snack("Saved"); load();
      } catch (err) { snack(err.message, 5000); }
    },
    async "ota-check"(b) {
      b.disabled = true; b.classList.add("busy"); snack("Checking for a firmware update…", 6000);
      try { const r = await api("api/ota", { ieee: state.open, action: "check" }); snack(r.available ? "An update is available" : "No update available"); load(); } catch (err) { snack(err.message, 5000); }
      b.disabled = false; b.classList.remove("busy");
    },
    async "ota-update"() {
      const d = state.byIeee.get(state.open), u = d.update || {};
      const ok = await confirmDialog({ title: `Update ${nameOf(d) || d.ieee}?`, ok: "Update",
        html: `<p>Installs firmware ${esc(u.latest_version)} (currently ${esc(u.installed_version)}). It usually takes 10 to 60 minutes, and the device may not respond while it updates.</p><p>Keep it powered and in range. Battery devices need to stay awake, so press their button if the update doesn't start.</p>` });
      if (!ok) return;
      try { await api("api/ota", { ieee: d.ieee, action: "update" }); snack("Firmware update started"); load(); } catch (err) { snack(err.message, 5000); }
    },
    pair() { state.move = null; state.pairNet = state.pairNet || state.data.instances[0]; renderPair(); const dlg = $("#pairDlg"); if (!dlg.open) dlg.showModal(); },
    move(b) { state.move = { target: b.dataset.ieee || state.open, via: b.dataset.via || null }; renderPair(); const dlg = $("#pairDlg"); if (!dlg.open) dlg.showModal(); },
    "pair-close"() { $("#pairDlg").close(); },
    async "pair-start"(b) {
      const move = state.move ? state.byIeee.get(state.move.target) : null;
      const net = move ? move.instance : $("#pairNet")?.value || state.pairNet;
      if (!move) state.pairNet = net;
      const via = $("#pairVia")?.value || "";
      if (move && !via) { snack("Choose the router to move it to"); return; }
      b.disabled = true;
      try {
        await api("api/pairing", { instance: net, seconds: Number($("#pairSecs")?.value || 180), via: via || null, target: move ? move.ieee : null });
        snack(move ? `Pairing open through the chosen router. Put ${nameOf(move)} into pairing mode now.` : "Pairing is open. Put the device in pairing mode now.", 5000);
        await load();
      } catch (err) { snack(err.message, 5000); }
      b.disabled = false;
    },
    async "pair-stop"() { const net = state.move ? state.byIeee.get(state.move.target)?.instance : state.pairNet; try { await api("api/pairing", { instance: net, seconds: 0 }); snack("Pairing closed"); await load(); } catch (err) { snack(err.message); } },
    async "pair-save"(b) {
      const ieee = b.dataset.ieee, d = state.byIeee.get(ieee), box = b.closest(".pair-dev");
      const name = box.querySelector("[name=name]").value.trim(), area = box.querySelector("[name=area]")?.value || "", btype = box.querySelector("[name=btype]")?.value.trim();
      b.disabled = true;
      try {

        if (area && d?.ha_device_id) await api("api/area", { ieee, area_id: area });
        if (btype) await api("api/battery", { ieee, info: { type: btype.replace(/^\d+\s*[x×]\s*/i, ""), quantity: (btype.match(/^(\d+)\s*[x×]/i) || [])[1] || 1, installed: todayIso() } });
        snack("Saved"); await load();
      } catch (err) { snack(err.message, 5000); }
      b.disabled = false;
    },
    async "save-wifi"() { await saveSettings({ wifi_channels: $("#wifiCh").value.trim() }); },
    async "send-summary"() { try { const r = await api("api/summary", {}); snack(r.title, 4000); } catch (err) { snack(err.message); } },
    restore() { $("#restoreFile").click(); },
    async unmute(b) { try { await api("api/mute", { ieee: b.dataset.ieee, kind: b.dataset.kind, muted: false }); snack("No longer ignored"); if (state.view === "settings") await renderSettings(); load(); } catch (err) { snack(err.message); } },
    async "unmute-all"() { for (const m of state.settings?.muted || []) { try { await api("api/mute", { ieee: m.ieee, kind: m.kind, muted: false }); } catch (e) { /* keep going */ } } snack("Nothing ignored now"); await renderSettings(); load(); },
    async "bindings-ack"(b) { try { await api("api/bindings/ack", { ieee: b.dataset.ieee }); snack("Lost bindings dismissed"); load(); } catch (err) { snack(err.message); } },
    async link(b) { try { await api("api/link", { old: b.dataset.old, new: b.dataset.new }); snack("Linked. History, notes and asset details carried over"); load(); } catch (err) { snack(err.message); } },
    async "link-sel"() { const old = $("#linkSel")?.value; if (!old) { snack("Choose the removed device first"); return; } try { await api("api/link", { old, new: state.open }); snack("Linked"); load(); } catch (err) { snack(err.message); } },
    async unlink(b) { try { await api("api/unlink", { old: b.dataset.old, new: b.dataset.new }); snack("Unlinked"); load(); } catch (err) { snack(err.message); } },
    async scan() { try { await api("api/networkmap", {}); snack("Routing scan started. It takes a few minutes.", 4000); setTimeout(load, 1500); } catch (err) { snack(err.message); } },
    async import() { try { const r = await api("api/import", {}); snack(`Import done: ${r.new_devices} new devices, ${r.new_events} new events`, 4000); load(); } catch (err) { snack(err.message); } },
    theme() { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; store.set("z2mt.theme", theme); applyTheme(); snack(`Theme: ${cap(theme)}`); if (state.view === "settings") renderSettings(false); },
    async "save-note"() { const note = $("#note").value; try { await api("api/note", { ieee: state.open, note }); state.byIeee.get(state.open).note = note; flash("#savedNote"); state.editing = false; } catch (err) { snack(err.message); } },
    async "save-asset"() { const asset = Object.fromEntries(new FormData($("#assetForm")).entries()); try { await api("api/asset", { ieee: state.open, asset }); state.byIeee.get(state.open).asset = asset; flash("#savedAsset"); state.editing = false; } catch (err) { snack(err.message); } },
    async "save-battery"() { const info = Object.fromEntries(new FormData($("#batForm")).entries()); try { await api("api/battery", { ieee: state.open, info }); flash("#savedBat"); state.editing = false; load(); } catch (err) { snack(err.message); } },
    async "battery-replaced"() {
      const ieee = state.open, d = state.byIeee.get(ieee);
      const ok = await confirmDialog({ title: "Battery replaced", ok: "Save",
        html: `<p>Records a new battery for ${esc(nameOf(d) || ieee)}${d?.battery_notes ? " and updates Battery Notes" : ""}.</p><label>Replaced on<input class="field" type="date" id="cDate" value="${todayIso()}" max="${todayIso()}"></label><label>Note (optional)<input class="field" id="cNote" maxlength="200" autocomplete="off"></label>` });
      if (!ok) return;
      try { const res = await api("api/battery/replaced", { ieee, date: $("#cDate").value || todayIso(), note: $("#cNote").value }); snack(res.entry?.battery_notes_synced ? "Saved and Battery Notes updated" : "Saved"); load(); } catch (err) { snack(err.message, 4000); }
    },
    async "bat-remove"(b) {
      if (!(await confirmDialog({ title: "Remove this entry?", ok: "Remove", danger: true, html: "<p>Removes it from the tracker's history only. Battery Notes isn't changed.</p>" }))) return;
      try { await api("api/battery/remove", { ieee: state.open, index: Number(b.dataset.index) }); load(); } catch (err) { snack(err.message); }
    },
    async forget() {
      const ieee = state.open, d = state.byIeee.get(ieee);

      const ok = await confirmDialog({ title: `Forget ${nameOf(d) || "this device"}?`, ok: "Forget", danger: true,
        html: `<p>This permanently deletes the device's history from the tracker.</p><div class="facts"><span class="mono">${esc(ieee)}</span><br>${formerOf(d).length} former names · ${events} events${d?.note ? " · a note" : ""}</div>${d?.status !== "removed" ? `<p>It's still in Zigbee2MQTT, so it will reappear straight away with an empty history.</p>` : ""}` });

    async "test-notify"(b) { b.disabled = true; try { const r = await api("api/test-notification", {}); snack(r.channels.length ? `Test sent to ${r.channels.join(", ")}` : "Every channel is switched off", 4000); } catch (err) { snack(err.message); } b.disabled = false; },
  };

  // ------------------------------------------------------------ updates (OTA)
  const otaList = () => visible().filter((d) => d.status !== "removed" && (["available", "updating"].includes(d.update?.state) || ["queued", "updating"].includes(state.ota?.status?.[d.ieee]?.state)));
  const otaVer = (v) => (v === null || v === undefined || v === -1 || v === "" ? "—" : String(v));
  const otaWin = (w) => String(w || "").replace("-", "–");
  const loadOta = async () => {
    state.otaAt = Date.now();
    try { state.ota = await api("api/ota"); } catch (err) { snack(err.message, 4000); }
    if (state.view === "updates") renderUpdates();
  };
  const otaStatus = (d) => {
    const O = state.ota || {}, s = O.status?.[d.ieee], u = d.update || {};
    if (u.state === "updating") {
      const p = typeof u.progress === "number" ? Math.round(u.progress) : null;
      return [`<span class="st" style="--c:var(--primary)">Updating${p !== null ? ` · ${p}%` : ""}</span>${u.remaining ? `<div class="muted" style="font-size:12px">About ${esc(span(u.remaining))} left</div>` : ""}<div class="bar"><i style="width:${Math.max(2, Math.min(100, p || 0))}%"></i></div>`, ""];
    }
    if (s?.state === "queued") return [`<span class="st" style="--c:var(--text-2)">Queued</span>`, `<button class="btn" data-act="ota-cancel" data-ieee="${esc(d.ieee)}">Cancel</button>`];
    if (s?.state === "updating") return [`<span class="st" style="--c:var(--primary)">Starting…</span>`, ""];
    if (u.state !== "available") return [`<span class="st" style="--c:var(--success)">Up to date</span>`, ""];
    const fails = O.failures?.[d.ieee] || 0;
    if (s?.state === "failed" || (fails && !s)) {
      const reason = s?.reason || (O.history || []).find((h) => h.ieee === d.ieee && h.result !== "ok")?.error;
      const auto = O.window && O.window_valid;
      const label = fails > (O.auto_retries ?? 1) ? "Failed twice: retry by hand" : auto ? "Failed: tries again tonight" : "Failed";
      return [`<span class="st" style="--c:var(--error)">${label}</span>${reason ? `<div class="muted" style="font-size:12px">${esc(reason)}</div>` : ""}`, `<button class="btn" data-act="ota-now" data-ieee="${esc(d.ieee)}" data-force="1">Retry</button>`];
    }
    const block = s?.state === "skipped" ? s.reason : O.battery_blocked?.[d.ieee];
    if (block) {
      const force = /battery/i.test(block);
      return [`<span class="st" style="--c:var(--warning)">Skipped: ${esc(block.charAt(0).toLowerCase() + block.slice(1))}</span>`, force || s?.state === "skipped" ? `<button class="btn" data-act="ota-now" data-ieee="${esc(d.ieee)}" data-force="1">${force ? "Update anyway" : "Try again"}</button>` : ""];
    }
    const label = O.window && O.window_valid ? (O.window_open ? "Next in tonight's run" : "Queued for tonight") : "Ready";
    return [`<span class="st" style="--c:var(--text-2)">${label}</span>`, `<button class="btn" data-act="ota-now" data-ieee="${esc(d.ieee)}">Update now</button>`];
  };
  const renderUpdates = () => {
    const O = state.ota;
    if (!O) { $("#view").innerHTML = `<div class="card">${emptyState("update", "Loading", "Reading firmware status…")}</div>`; loadOta(); return; }
    if (Date.now() - (state.otaAt || 0) > 30000) loadOta();
    const list = otaList().sort((a, b) => { const r = (d) => (d.update?.state === "updating" ? 0 : O.status?.[d.ieee]?.state === "queued" ? 1 : 2); return r(a) - r(b) || collator.compare(nameOf(a) || a.ieee, nameOf(b) || b.ieee); });
    const avail = list.filter((d) => ["available", "updating"].includes(d.update?.state)).length;
    const ready = list.filter((d) => d.update?.state === "available" && !O.status?.[d.ieee] && !O.battery_blocked?.[d.ieee]).length;
    const chk = O.check || {};

    const when = !nextWin ? "" : nextWin.getHours() < 6 || nextWin.getHours() >= 20 ? "tonight" : nextWin.toDateString() === new Date().toDateString() ? "today" : "tomorrow";
    const sched = !O.window ? "Overnight updates are off" : !O.window_valid ? `Overnight window "${esc(O.window)}" isn't valid` : O.window_open ? `Overnight run in progress until ${esc(O.window.split("-")[1])}` : `Next overnight run ${when} ${esc(otaWin(O.window))}`;
    const checked = chk.running ? `Checking ${chk.done} of ${chk.total}…` : O.last_check ? `Last checked ${relTime(O.last_check).toLowerCase()}` : "Not checked by the tracker yet";

        <td class="nw"><span class="mono">${esc(otaVer(u.installed_version))}</span>${d.software_build_id ? `<div class="name-2">Build ${esc(d.software_build_id)}</div>` : ""}</td>
        <td class="mono nw">${esc(otaVer(u.latest_version))}</td>

      const d = state.byIeee.get(h.ieee), ok = h.result === "ok";
      const from = h.from_build && h.to_build ? h.from_build : otaVer(h.from), to = h.from_build && h.to_build ? h.to_build : otaVer(h.to);

      const dur = h.duration ? ` · ${span(h.duration)}` : "";

        <div class="text row-open" data-open="${esc(h.ieee)}" style="cursor:pointer"><div>${esc((d && nameOf(d)) || h.name || h.ieee)} <span class="mono muted">${esc(from)} → ${esc(to)}</span></div>${ok ? "" : `<div class="muted" style="font-size:14px">Failed: ${esc(h.error || "unknown error")}</div>`}</div>

        <div class="ota-head"><div class="text"><div class="t1">${avail ? `${avail} update${avail === 1 ? "" : "s"} available` : "All firmware is up to date"}</div><div class="t2">${checked} · ${sched}</div></div>
          <button class="btn outlined ${chk.running ? "busy" : ""}" data-act="ota-check-all" ${chk.running ? "disabled" : ""}>${ic("refresh", "s18")}${chk.running ? "Checking…" : "Check now"}</button>

        ${list.length ? `<div class="table-wrap"><table class="dt ota" style="min-width:760px"><thead><tr><th class="ic-cell"></th><th>Device</th><th>Installed</th><th>Available</th><th>Power</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`

      <div class="section-title">Schedule</div>
      <div class="card">

          <div class="ctl"><span class="ota-time"><input class="field" type="time" id="otaFrom" value="${esc(wFrom)}" ${O.window ? "" : "disabled"} aria-label="Start"><span class="muted">to</span><input class="field" type="time" id="otaTo" value="${esc(wTo)}" ${O.window ? "" : "disabled"} aria-label="End"></span>
          <label class="switch"><input type="checkbox" id="otaOn" ${O.window ? "checked" : ""} aria-label="Overnight updates"><span class="track"></span><span class="thumb"></span></label></div></div>
        <div class="set-row ota-row"><div class="text"><div class="t1">Minimum battery</div><div class="t2">Battery devices below this level are skipped. Use Update anyway to override.</div></div>
          <div class="ctl"><input class="field" type="number" id="otaBat" min="0" max="100" value="${esc(O.min_battery)}" style="width:80px" aria-label="Minimum battery percent"><span class="muted">%</span></div></div>
      </div>`;
  };
  const otaSave = async (changes) => {
    try { const r = await api("api/settings", { changes }); snack(r.persisted ? "Saved" : "Applied, but couldn't save to the app configuration. It resets on restart.", r.persisted ? 1600 : 5000); }

  $("#view").addEventListener("change", (e) => {

        html: `<p>Installs firmware ${esc(otaVer(u.latest_version))} (currently ${esc(otaVer(u.installed_version))}). It usually takes 10 to 60 minutes, and the device may not respond while it updates.</p>${low ? `<div class="alert" style="--a:var(--warning)">${ic("battery-alert-variant-outline")}<div class="body">${esc(low)}. If the battery runs out during the update, the device may need to be paired again.</div></div>` : ""}` });

  });

  // ------------------------------------------------------------ pairing assistant
  const loadAreas = async () => { if (state.areas) return; try { state.areas = (await api("api/areas")).areas; } catch (e) { state.areas = null; } };
  let pairTick;
  const routersFor = (net, prefArea) => state.data.devices
    .filter((d) => d.instance === net && d.status !== "removed" && (d.type === "Coordinator" || (d.type === "Router" && statusOf(d) === "active")))
    .sort((a, b) => (b.type === "Coordinator") - (a.type === "Coordinator") || ((prefArea && b.area === prefArea) - (prefArea && a.area === prefArea)) || (a.area ? 0 : 1) - (b.area ? 0 : 1) || collator.compare(a.area || "", b.area || "") || collator.compare(nameOf(a) || "", nameOf(b) || ""));

    return same.sort((a, b) => (lqiOf(b) ?? 0) - (lqiOf(a) ?? 0))[0] || null;
  };
  const routerLabel = (r) => (r.type === "Coordinator" ? "Coordinator" : `${r.area ? `${r.area} · ` : ""}${nameOf(r) || r.ieee}`);
  const fmtLeft = (l) => `${Math.floor(l / 60)}:${String(l % 60).padStart(2, "0")}`;
  const renderPair = () => {
    const dlg = $("#pairDlg");
    const move = state.move ? state.byIeee.get(state.move.target) : null;
    const net = move ? move.instance : state.pairNet || state.data.instances[0];
    const permit = state.data.permit?.[net] || {};
    const session = state.data.pairing?.[net];
    const left = permit.on && permit.end ? Math.max(0, Math.round((new Date(permit.end) - Date.now()) / 1000)) : 0;
    if (!state.areas) loadAreas().then(() => { if (dlg.open) renderPair(); });
    if (dlg.contains(document.activeElement) && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
    const routers = routersFor(net, move?.area);
    const chosen = move ? state.move.via || suggestRouter(move)?.ieee || "" : state.pairVia || "";
    const viaSelect = (label, anyOption) => `<label class="wide">${label}<select class="field" id="pairVia">${anyOption ? `<option value="">Any device (whole network)</option>` : ""}${routers.map((r) => `<option value="${esc(r.ieee)}" ${r.ieee === chosen ? "selected" : ""}>${esc(routerLabel(r))}${move && r.ieee === move.routing?.parent?.ieee ? " (current)" : ""}${move && r.area && r.area === move.area ? " · same room" : ""}</option>`).join("")}</select></label>`;
    const docs = move?.model ? `<a href="https://www.zigbee2mqtt.io/devices/${encodeURIComponent(String(move.model).replace(/\//g, "_"))}.html" target="_blank" rel="noopener">pairing instructions</a>` : "its pairing instructions";
    let body;
    if (move) {
      const cur = move.routing?.parent;
      const done = session?.target === move.ieee && session?.rejoined;
      body = done
        ? `<div class="more-hero"><span class="state-ic" style="color:var(--success)">${ic("check")}</span><div class="big">Rejoined</div><div class="sub">${esc(nameOf(move))} rejoined while pairing was open only through ${esc(session.via_name || "the chosen router")}.</div></div>
           <div class="card-content muted">Its name, history and Home Assistant entities are unchanged. Run a routing scan in a few minutes to confirm the new connection on the map.</div>
           <div class="more-actions"><button class="btn outlined" data-act="scan">${ic("sitemap", "s18")}Run routing scan</button><button class="btn filled" data-act="pair-close">Done</button></div>`
        : permit.on && session?.target === move.ieee
          ? `<div class="more-hero"><span class="state-ic" style="color:var(--primary)">${ic("cellphone-wireless")}</span><div class="big" id="pairLeft">${fmtLeft(left)}</div><div class="sub">Pairing is open only through <b>${esc(session.via_name || "the chosen router")}</b>.</div></div>
             <div class="alerts"><div class="alert" style="--a:var(--info)">${ic("information-outline")}<div class="body"><b>Now put ${esc(nameOf(move))} into pairing mode.</b> Usually that means holding its button for about 5 seconds until the light flashes. See ${docs}. Keep it close to the router.</div></div></div>

               <p class="muted" style="margin:0">Currently connected through <b>${esc(cur ? nameOf(state.byIeee.get(cur.ieee)) || cur.ieee : "unknown")}</b>${cur?.lqi !== undefined ? ` (LQI ${esc(cur.lqi)})` : ""}${move.area ? ` · device is in ${esc(move.area)}` : ""}.</p></div>
             <div class="form">${viaSelect("Move to", false)}<label>Keep open for<select class="field" id="pairSecs"><option value="120">2 minutes</option><option value="180" selected>3 minutes</option><option value="254">4 minutes</option></select></label></div>

            <div class="more-actions"><button class="btn outlined danger" data-act="pair-stop">Stop pairing</button></div>`

              <label>Keep open for<select class="field" id="pairSecs"><option value="120">2 minutes</option><option value="180" selected>3 minutes</option><option value="254">4 minutes</option></select></label>
              ${viaSelect("Pair through", true)}</div>
             <div class="card-content muted">Choose a router near where the new device will live, or leave it on any device. Then reset the device or hold its pairing button.</div>

  };
  $("#pairDlg").addEventListener("close", () => { clearInterval(pairTick); state.move = null; });
  $("#pairDlg").addEventListener("change", (e) => { if (e.target.id === "pairVia") { if (state.move) state.move.via = e.target.value; else state.pairVia = e.target.value; } });

  // ------------------------------------------------------------ events
  const menu = $("#menu"), menuBtn = $("#menuBtn");
  const closeMenu = () => { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); };

  document.addEventListener("click", (e) => {
    if (!menu.hidden && !e.target.closest("#menu")) closeMenu();
    const mz = e.target.closest("[data-mapzoom]"); if (mz) { MAP.sims[mz.dataset.net]?.zoom(Number(mz.dataset.mapzoom)); return; }
    const mr = e.target.closest("[data-mapreset]"); if (mr) { MAP.sims[mr.dataset.mapreset]?.reset(); return; }
    if (e.target.closest("[data-maplinks]")) { MAP.allLinks = !MAP.allLinks; store.set("z2mt.mapAll", MAP.allLinks ? "1" : "0"); renderMap(true); return; }
    const mc = e.target.closest("[data-mapclose]"); if (mc) { MAP.sims[mc.dataset.mapclose]?.select(null); return; }
    const ms = e.target.closest("[data-mapsel]"); if (ms) { e.preventDefault(); MAP.sims[ms.dataset.net]?.select(ms.dataset.mapsel); document.getElementById(`map-${ms.dataset.net}`)?.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    const act = e.target.closest("[data-act]");
    if (act && actions[act.dataset.act]) { e.preventDefault(); closeMenu(); actions[act.dataset.act](act); return; }
    if (e.target.closest("#menu a")) { closeMenu(); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab) { state.moreTab = tab.dataset.tab; renderMore(true); return; }
    const open = e.target.closest("[data-open]");
    if (open) { e.preventDefault(); openDevice(open.dataset.open); return; }
    const view = e.target.closest("[data-view]");
    if (view) { if ($("#more").open) closeDevice(); go(view.dataset.view); return; }
    const chip = e.target.closest("[data-chip]");
    if (chip) { state.chip = chip.dataset.chip; state.view = "devices"; render(); return; }
    const th = e.target.closest("th[data-sort]");
    if (th) { const k = th.dataset.sort; if (state.sort === k) state.dir = -sortDir(); else { state.sort = k; state.dir = 0; } store.set("z2mt.sort", state.sort); store.set("z2mt.dir", String(state.dir)); renderDevices(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !menu.hidden) { closeMenu(); return; }
    if (e.key === "Enter" && e.target.matches("tr[data-open]")) { openDevice(e.target.dataset.open); return; }
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (!typing && usePane() && state.view === "devices" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); moveSelection(e.key === "ArrowDown" ? 1 : -1); return; }
    if (e.key === "Escape" && usePane() && state.open && !typing && !$("#confirmDlg").open) { closeDevice(); return; }
    if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) && !$("#more").open) { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
  });
  $("#view").addEventListener("change", async (e) => {
    const sc = e.target.closest("[data-mapscan], [data-mapcmp]");
    if (sc) {
      const bt = sc.dataset.mapscan || sc.dataset.mapcmp;
      await loadScanHistory(bt);
      if (sc.dataset.mapscan !== undefined) { MAP.scanSel[bt] = sc.value || null; MAP.cmpSel[bt] = null; } else MAP.cmpSel[bt] = sc.value || null;
      delete (MAP.pos || {})[bt];
      renderMap(true);
      return;
    }
    if (state.view !== "settings") return;
    const t = e.target;
    if (t.dataset.set) saveSettings({ [t.dataset.set]: t.checked });
    else if (t.dataset.num) {
      const v = Number(t.value);
      if (!Number.isFinite(v) || v < Number(t.min) || v > Number(t.max)) { snack(`Enter a number from ${t.min} to ${t.max}`); t.value = state.settings.settings[t.dataset.num]; return; }
      saveSettings({ [t.dataset.num]: Math.round(v) });
    } else if (t.id === "scanHour") saveSettings({ networkmap_hour: Number(t.value) });
    else if (t.id === "themeSel") { theme = t.value; store.set("z2mt.theme", theme); applyTheme(); }
    else if (t.id === "sumDay") saveSettings({ summary_day: Number(t.value) });
    else if (t.id === "sumHour") saveSettings({ summary_hour: Number(t.value) });
    else if (t.id === "restoreFile" && t.files?.[0]) {
      const file = t.files[0];
      t.value = "";
      confirmDialog({ title: "Restore from backup?", ok: "Restore", danger: true, html: `<p>Replaces the tracker's entire history with <b>${esc(file.name)}</b>. Anything recorded since that backup is lost.</p>` }).then(async (ok) => {
        if (!ok) return;
        try { const body = JSON.parse(await file.text()); const r = await api("api/restore", body); snack(`Restored ${r.devices} devices and ${r.events} events`, 4000); load(); }
        catch (err) { snack(err instanceof SyntaxError ? "That file isn't valid JSON" : err.message, 5000); }
      });
    }
    else if (t.id === "layoutSel") { state.layout = t.value; store.set("z2mt.layout", t.value); snack(t.value === "pane" ? "Details open in a side panel" : "Details open in a pop-up"); }
    else if (t.dataset.checksel) {
      const s = state.settings.settings;
      const disabled = new Set(s.disabled_checks || []), notify = new Set(s.notify_checks || []);
      const key = t.dataset.checksel, val = t.value;
      if (val === "off") { notify.delete(key); if (t.dataset.event !== "1") disabled.add(key); }
      else if (val === "show") { disabled.delete(key); notify.delete(key); }
      else { disabled.delete(key); notify.add(key); }
      saveSettings({ disabled_checks: [...disabled], notify_checks: [...notify] });
    }
  });
  window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if (IEEE_RE.test(h) && h !== state.open) openDevice(h); });

  (async () => {
    await load();
    const h = decodeURIComponent(location.hash.slice(1));
    if (IEEE_RE.test(h) && state.byIeee.has(h)) openDevice(h);
  })();
  setInterval(poll, 5000);
  setInterval(load, 60000);
})();
</script>
</body>

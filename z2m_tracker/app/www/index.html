    const order = { ghost: 0, offline: 1, active: 2, removed: 3 };
    const keyFns = {
      name: (d) => clean(nameOf(d)), area: (d) => clean(d.area), model: (d) => clean(deviceLine(d)),
      status: (d) => order[statusOf(d)] * 10 + (warnings(d).length ? 0 : 1),
      battery: (d) => (d.status === "removed" ? null : typeof d.battery === "number" ? d.battery : powerOf(d) ? 101 : null),
      signal: (d) => lqiOf(d), last_seen: (d) => time(d.last_seen),
    };
    const key = keyFns[state.sort] || keyFns.name;
    const dir = sortDir();
    const byName = (a, b) => { const x = clean(nameOf(a)), y = clean(nameOf(b)); if (x === null || y === null) return x === y ? collator.compare(a.ieee, b.ieee) : x === null ? 1 : -1; return collator.compare(x, y); };
    return list.map((d) => [key(d), d]).sort(([x, a], [y, b]) => {
      if (x === null || y === null) return x === y ? byName(a, b) : x === null ? 1 : -1;
      return (typeof x === "number" ? x - y : collator.compare(x, y)) * dir || byName(a, b);
    }).map(([, d]) => d);
  };

  // ------------------------------------------------------------ views
  const emptyState = (icon, title, text) => `<div class="empty">${ic(icon)}<b>${title}</b>${text}</div>`;

  const renderDevices = () => {
    const all = visible();
    const list = filtered();
    const warnCount = all.filter(CHIPS[1][2]).length;
    const th = (k, label, cls = "") => {
      const on = state.sort === k, up = on ? sortDir() > 0 : (DEFAULT_DIR[k] || 1) > 0;
      return `<th class="sortable ${on ? "on" : ""} ${cls}" data-sort="${k}" aria-sort="${on ? (sortDir() > 0 ? "ascending" : "descending") : "none"}"><span class="h">${label}${ic(up ? "arrow-up" : "arrow-down")}</span></th>`;
    };
    const pane = usePane();
    if (state.group) list.sort((a, b) => (a.area ? 0 : 1) - (b.area ? 0 : 1) || collator.compare(a.area || "", b.area || ""));
    let lastArea;
    const rows = list.map((d) => {
      const head = state.group && (d.area || "No area") !== lastArea ? `<tr class="grp"><td colspan="8">${esc(d.area || "No area")} <span>${list.filter((x) => (x.area || "No area") === (d.area || "No area")).length}</span></td></tr>` : "";
      lastArea = d.area || "No area";
      return head + rowHtml(d);
    }).join("");
    function rowHtml(d) {
      const st = statusOf(d);
      const w = warnings(d)[0];
      const statusTxt = st !== "active" ? STATUS[st].label : w ? w.label : "Active";
      const statusC = st !== "active" ? STATUS[st].c : w ? "var(--warning)" : STATUS.active.c;
      const former = formerOf(d);
      const lqi = lqiOf(d);
      const power = powerOf(d);
      const bat = d.status !== "removed" && typeof d.battery === "number"
        ? `<span class="bat" style="--c:${batColor(d.battery)}">${Math.round(d.battery)} %</span>`
        : d.status !== "removed" && power ? `<span class="muted">${power}</span>` : `<span class="muted">—</span>`;
      const second = pane ? [d.area, former.length ? `Previously ${former.join(", ")}` : deviceLine(d)].filter(Boolean).join(" · ") : former.length ? `Previously ${former.join(", ")}` : d.ieee;
      return `<tr class="${st === "removed" ? "removed" : ""}" data-open="${esc(d.ieee)}" tabindex="0" aria-selected="${state.open === d.ieee}">
        <td class="ic-cell">${stateIc(d)}</td>
        <td><div class="name">${esc(nameOf(d) || "Unnamed device")}</div><div class="name-2">${esc(second)}</div></td>
        <td class="cell-sub hide-sm col-area">${esc(d.area || "—")}</td>
        <td class="cell-sub hide-md col-model">${esc(deviceLine(d) || (d.oui_vendor ? `${d.oui_vendor} radio` : "Unknown"))}</td>
        <td><span class="st" style="--c:${statusC}">${esc(statusTxt)}</span></td>
        <td class="num hide-sm">${bat}</td>
        <td class="num hide-md">${lqi === null ? '<span class="muted">—</span>' : sigBars(lqi)}</td>
        <td class="cell-sub hide-md" title="${esc(fmtDate(d.last_seen))}">${esc(relTime(d.last_seen))}</td>
      </tr>`;
    }
    $("#view").innerHTML = `
      ${warnCount && state.chip !== "attention" ? `<div class="alert" style="--a: var(--warning)">${ic("alert")}<div class="body"><b>${warnCount} device${warnCount === 1 ? " needs" : "s need"} attention.</b> Offline, unidentified, weak signal, low battery or frozen readings.</div><button class="btn" data-chip="attention">Show</button></div>` : ""}
      <div class="tools">
        <label class="search">${ic("magnify")}<input id="q" type="search" placeholder="Search devices" value="${esc(state.query)}" autocomplete="off" spellcheck="false" aria-label="Search devices"></label>
        <div class="chips">${CHIPS.map(([k, l, p]) => `<button class="chip" data-chip="${k}" aria-pressed="${state.chip === k}">${ic("check", "s18")}${l} <span class="n">${all.filter(p).length}</span></button>`).join("")}</div>
        <div class="tools-right"><button class="chip toggle" data-act="group" aria-pressed="${state.group}">${ic("map-marker-outline", "s18")}Group by area</button><button class="btn filled" data-act="pair">${ic("plus", "s18")}Pair device</button></div>
      </div>
      <div class="${pane ? "split" : ""}"><div class="split-list">
      <div class="card">
        <div class="table-wrap">${list.length ? `<table class="dt ${pane ? "compact" : ""}"><thead><tr><th class="ic-cell"></th>${th("name", "Name")}${th("area", "Area", "hide-sm col-area")}${th("model", "Model", "hide-md col-model")}${th("status", "Status")}${th("battery", "Battery", "num hide-sm")}${th("signal", "Signal", "num hide-md")}${th("last_seen", "Last seen", "hide-md")}</tr></thead><tbody>${rows}</tbody></table>`
          : emptyState("magnify", "No devices found", state.query ? `Nothing matches “${esc(state.query)}”.` : "Nothing in this filter.")}</div>
      </div>
      <div class="count-line" style="margin:8px 4px 0;text-align:right">${list.length} of ${all.length} devices</div>
      </div>${pane ? `<aside class="card pane" id="pane" aria-label="Device details"></aside>` : ""}</div>`;
    $("#page").classList.toggle("wide", pane);
    if (pane) renderMore(true, true);
    const q = $("#q");
    q.addEventListener("input", () => { state.query = q.value; clearTimeout(q._t); q._t = setTimeout(() => { const pos = q.selectionStart; renderDevices(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }, 120); });
  };

  const issueActions = (i) => {
    const d = state.byIeee.get(i.ieee);
    const out = [];
    if (i.kind === "frozen" || i.kind === "silent") out.push(`<button class="btn" data-act="reconfigure" data-ieee="${esc(i.ieee)}">Reconfigure</button>`);
    if (i.kind === "binding_lost") {
      if ((d?.lost_bindings || []).some((b) => b.coordinator)) out.push(`<button class="btn" data-act="reconfigure" data-ieee="${esc(i.ieee)}">Reconfigure</button>`);
      out.push(`<button class="btn" data-act="bindings-ack" data-ieee="${esc(i.ieee)}">It was intended</button>`);
      return out.join("");
    }
    if (i.kind === "single_point") out.push(`<button class="btn" data-view="map">Map</button>`);
    if (i.kind === "replacement" && d?.suggestions?.[0]) out.push(`<button class="btn" data-act="link" data-old="${esc(d.suggestions[0].ieee)}" data-new="${esc(i.ieee)}">Link</button>`);
    out.push(`<button class="btn" data-act="mute" data-ieee="${esc(i.ieee)}" data-kind="${esc(i.kind)}">Ignore</button>`);
    return out.join("");
  };

  const renderHealth = () => {
    const issues = state.data.issues || [];
    const o = state.data.options || {};
    const nm = state.data.networkmap || {};
    const running = Object.values(nm).some((x) => x.running_since);
    const scans = state.data.instances.map((bt) => { const x = nm[bt] || {}; return `${netLabel(bt)}: ${x.running_since ? "scanning…" : x.scanned_at ? relTime(x.scanned_at) : "never"}`; }).join(" · ");
    const item = (i) => {
      const d = state.byIeee.get(i.ieee);
      const tone = i.severity === "warning" ? "var(--warning)" : "var(--info)";
      if (String(i.ieee).startsWith("network:")) {
        const panel = state.data.panels?.[i.instance];
        return `<div class="row"><span class="state-ic" style="color:${tone}">${ic(i.kind === "network_offline" ? "lan-disconnect" : i.kind === "coordinator_backup" ? "download" : "refresh")}</span>
          <div class="text"><div class="t1">${esc(i.title)}: ${esc(i.name)}</div><div class="t2">${esc(i.detail)}</div></div>
          <div class="acts">${panel ? `<a class="btn" href="${esc(panel)}" target="_top">Open Zigbee2MQTT</a>` : ""}</div></div>`;
      }
      return `<div class="row"><span class="state-ic" style="color:${tone}">${ic(KIND_ICON[i.kind] || "alert")}</span>
        <div class="text row-open" data-open="${esc(i.ieee)}" style="cursor:pointer"><div class="t1">${esc(i.title)}: ${esc(i.name)}</div><div class="t2">${esc(i.detail)}${d?.area ? ` · ${esc(d.area)}` : ""}</div></div>
        <div class="acts">${issueActions(i)}</div></div>`;
    };
    const warn = issues.filter((i) => i.severity === "warning"), info = issues.filter((i) => i.severity !== "warning");
    $("#view").innerHTML = `
      <div class="card">
        <div class="card-header">${ic("heart-pulse")}<div>Network health<small>${warn.length ? `${warn.length} need attention, ${info.length} to review` : issues.length ? `${info.length} to review` : "Nothing needs attention"}</small></div></div>
        <div class="info-grid">
          <div><small>Alerts</small><b>${o.alerts_enabled === false ? "Off" : [o.persistent_notifications ? "HA notifications" : null, o.notify_service || null].filter(Boolean).join(", ") || "Event only"}</b></div>
          <div><small>Thresholds</small><b>Offline ${esc(o.offline_alert_minutes)} min · Frozen ${esc(o.frozen_alert_hours)} h · Battery ${esc(o.battery_alert_percent)} %</b></div>
          <div><small>Routing scan</small><b>${esc(scans)}</b></div>
        </div>
        <div class="card-actions"><button class="btn" data-view="settings">Alert settings</button><button class="btn ${running ? "busy" : ""}" data-act="scan" ${running ? "disabled" : ""}>${ic(running ? "refresh" : "sitemap", "s18")}${running ? "Scanning…" : "Run routing scan"}</button></div>
      </div>
      ${coordinatorsCard()}
      ${shoppingCard()}
      ${radioCard()}
      ${warn.length ? `<div class="section-title">Needs attention <span>${warn.length}</span></div><div class="card">${warn.map(item).join("")}</div>` : ""}
      ${info.length ? `<div class="section-title">Worth a look <span>${info.length}</span></div><div class="card">${info.map(item).join("")}</div>` : ""}
      ${!issues.length ? `<div class="card">${emptyState("check", "All clear", "No devices need attention right now.")}</div>` : ""}`;
  };

  const coordinatorsCard = () => {
    const B = state.data.bridges || {};
    const week = Date.now() - 7 * 86400000;
    const nets = state.data.instances.map((bt) => {
      const b = B[bt] || {}, info = b.info || {}, h = b.health || {};
      const online = b.state !== "offline";
      const outages = (b.outages || []).filter((o) => new Date(o.start).getTime() >= week);
      const downMin = Math.round(outages.reduce((t, o) => t + ((o.end ? new Date(o.end) : Date.now()) - new Date(o.start)) / 60000, 0));
      const restarts = (b.restarts || []).filter((r) => new Date(r).getTime() >= week).length;
      const last = [...(b.outages || [])].reverse()[0];
      const panel = state.data.panels?.[bt];
      const bk = (state.data.backups || {})[bt];
      const backup = !bk ? null : !bk.found ? "Data folder not inside /config, can't check" : !bk.exists ? "Missing" : bk.error ? bk.error
        : `${relTime(bk.date)} · ${bk.devices} devices${bk.has_key ? "" : " · no network key"}`;
      return `<div class="coord">
        <div class="row" style="border:0;min-height:56px"><span class="state-ic" style="color:${b.state ? (online ? "var(--success)" : "var(--error)") : "var(--text-2)"}">${ic(online ? "zigbee" : "lan-disconnect")}</span>
          <div class="text"><div class="t1">${esc(netLabel(bt))} network</div><div class="t2">${b.state ? `${online ? "Online" : "Offline"} since ${esc(fmtDate(b.since))}` : "Waiting for status from Zigbee2MQTT"}</div></div>
          ${panel ? `<a class="btn" href="${esc(panel)}" target="_top">Open${ic("open-in-new", "s18")}</a>` : ""}</div>
        ${kv([["Zigbee2MQTT", info.version], ["Coordinator", [info.coordinator_type, info.firmware ? `firmware ${info.firmware}` : null].filter(Boolean).join(" · ")], ["Channel / PAN ID", info.channel ? `${info.channel} / ${info.pan_id ?? "?"}` : null],
          ["Running for", h.uptime_sec ? span(h.uptime_sec) : null], ["Memory", h.memory_mb ? `${Math.round(h.memory_mb)} MB` : null],
          ["Last 7 days", `${outages.length} outage${outages.length === 1 ? "" : "s"}${outages.length ? ` (${downMin} min down)` : ""} · ${restarts} restart${restarts === 1 ? "" : "s"}`],
          ["Last outage", last ? `${fmtDate(last.start)}${last.end ? ` for ${span((new Date(last.end) - new Date(last.start)) / 1000)}` : " (ongoing)"}` : "None recorded"],
          ["Coordinator backup", backup]])}
      </div>`;
    }).join("");
    return `<div class="card"><div class="card-header">${ic("router-wireless")}<div>Coordinators<small>Zigbee2MQTT and coordinator status for each network</small></div></div>${nets}</div>`;
  };

  const radioCard = () => {
    const r = state.data.radio;
    if (!r || !r.networks.length) return "";
    const W = 640, H = 120, x = (mhz) => ((mhz - 2400) / 85) * (W - 20) + 10;
    const wf = (n) => (n === 14 ? 2484 : 2407 + 5 * n), zf = (c) => 2405 + 5 * (c - 11);
    const wifiBands = r.wifi.map((n) => `<rect x="${x(wf(n) - 11).toFixed(1)}" y="18" width="${(x(wf(n) + 11) - x(wf(n) - 11)).toFixed(1)}" height="54" rx="6" fill="var(--warning)" fill-opacity="0.18" stroke="var(--warning)" stroke-opacity="0.5"/><text x="${x(wf(n)).toFixed(1)}" y="14" text-anchor="middle">Wi-Fi ${n}</text>`).join("");
    const ticks = [...Array(16).keys()].map((i) => { const c = 11 + i, used = r.networks.filter((n) => n.channel === c); return `<line x1="${x(zf(c)).toFixed(1)}" x2="${x(zf(c)).toFixed(1)}" y1="${used.length ? 24 : 62}" y2="72" stroke="${used.length ? "var(--primary)" : "var(--divider)"}" stroke-width="${used.length ? 4 : 2}" stroke-linecap="round"/><text x="${x(zf(c)).toFixed(1)}" y="88" text-anchor="middle" ${used.length ? 'class="on"' : ""}>${c}</text>${used.length ? `<text x="${x(zf(c)).toFixed(1)}" y="104" text-anchor="middle" class="on">${esc(used.map((n) => netLabel(n.topic)).join(" + "))}</text>` : ""}`; }).join("");
    return `<div class="card"><div class="card-header">${ic("signal")}<div>Radio channels<small>Zigbee channels ${esc([...new Set(r.networks.map((n) => n.channel))].join(", "))} · Wi-Fi ${r.wifi.length ? esc(r.wifi.join(", ")) : "not set"}</small></div></div>
      <div class="chart-wrap"><svg class="spectrum" viewBox="0 0 ${W} ${H}" role="img" aria-label="2.4 GHz channel overlap">${wifiBands}${ticks}<text x="10" y="118" class="axis">2400 MHz</text><text x="${W - 10}" y="118" text-anchor="end" class="axis">2485 MHz</text></svg></div>
      <div class="advice">${r.findings.map((f) => `<div class="adv"><span class="state-ic" style="color:${f.sev >= 2 ? "var(--warning)" : f.sev === 1 ? "var(--info)" : "var(--success)"}">${ic(f.sev ? "alert" : "check")}</span><div class="text">${esc(f.text)}</div></div>`).join("")}</div>
      <div class="card-actions"><button class="btn" data-view="settings">Edit Wi-Fi channels</button></div></div>`;
  };

  const shoppingCard = () => {
    const groups = state.data.battery_shopping || [];
    if (!groups.length) return "";
    const total = groups.map((g) => `${g.count}× ${g.type}`).join(", ");
    return `<div class="card"><div class="card-header">${ic("battery-alert-variant-outline")}<div>Batteries to buy<small>${esc(total)} for devices expected to run low within 60 days</small></div></div>
      ${groups.map((g) => `<div class="set-row"><div class="text"><div class="t1">${g.count}× ${esc(g.type)}</div><div class="t2">${g.devices.map((x) => `<a href="#${esc(x.ieee)}" data-open="${esc(x.ieee)}">${esc(x.name)}</a> (${x.battery !== null && x.battery !== undefined ? Math.round(x.battery) + " %" : "low"}${x.days !== null && x.days !== undefined ? `, about ${Math.max(0, Math.round(x.days))} days` : ""}${x.quantity > 1 ? `, takes ${x.quantity}` : ""})`).join(" · ")}</div></div></div>`).join("")}
    </div>`;
  };

  // ------------------------------------------------------------ network map
  // Interactive force-directed map (drag dots, pan, zoom) plus advice from the routing scan.
  const MAP = { sims: {}, sel: {}, allLinks: store.get("z2mt.mapAll") === "1", rendered: null, hist: {}, scanSel: {}, cmpSel: {} };
  const loadScanHistory = async (bt) => { if (MAP.hist[bt]) return; try { MAP.hist[bt] = (await api(`api/scans?net=${encodeURIComponent(bt)}`)).scans || []; } catch (e) { MAP.hist[bt] = []; } };
  const mapDiff = (bt) => {
    if (!MAP.cmpSel[bt]) return null;
    const hist = MAP.hist[bt] || [];
    const now = MAP.scanSel[bt] ? scanRecord(bt, MAP.scanSel[bt]) : hist[hist.length - 1];
    const old = scanRecord(bt, MAP.cmpSel[bt]);
    if (!now || !old) return null;
    const moved = [], better = [], worse = [];
    Object.entries(now.parents).forEach(([dev, [p, q]]) => {
      const was = old.parents[dev];
      if (!was) return;
      if (was[0] !== p) moved.push({ dev, from: was[0], to: p, oldQ: was[1], newQ: q });
      else if (q !== null && was[1] !== null && q - was[1] >= 25) better.push({ dev, p, oldQ: was[1], newQ: q });
      else if (q !== null && was[1] !== null && was[1] - q >= 25) worse.push({ dev, p, oldQ: was[1], newQ: q });
    });
    const status = {};
    moved.forEach((m) => (status[[m.dev, m.to].sort().join("|")] = "moved"));
    better.forEach((m) => (status[[m.dev, m.p].sort().join("|")] = "better"));
    worse.forEach((m) => (status[[m.dev, m.p].sort().join("|")] = "worse"));
    return { moved, better, worse, status, oldAt: old.at, nowAt: now.at };
  };
  const lqiCol = (q) => (q === null || q === undefined ? "var(--disabled)" : q >= 100 ? "var(--success)" : q >= 50 ? "var(--warning)" : "var(--error)");
  const mapNodeCol = (d) => { if (d.type === "Coordinator") return "var(--text)"; const st = statusOf(d); return st !== "active" ? "var(--error)" : warnings(d).length ? "var(--warning)" : d.type === "Router" ? "var(--primary)" : "var(--state-icon)"; };

  const scanRecord = (bt, at) => (MAP.hist[bt] || []).find((x) => x.at === at) || null;
  const mapGraph = (bt) => {
    const rec = MAP.scanSel[bt] ? scanRecord(bt, MAP.scanSel[bt]) : null;
    if (rec) {
      const ids = new Set([...Object.keys(rec.parents), ...Object.values(rec.parents).map((p) => p[0]), ...rec.links.flatMap((l) => [l[0], l[1]])]);
      const devs = state.data.devices.filter((d) => ids.has(d.ieee) || (d.instance === bt && d.type === "Coordinator"));
      const links = [...Object.entries(rec.parents).map(([c, p]) => ({ a: c, b: p[0], lqi: p[1], parent: true })), ...rec.links.map((l) => ({ a: l[0], b: l[1], lqi: l[2], parent: false }))];
      return { devs, links, historic: true };
    }
    const devs = state.data.devices.filter((d) => d.instance === bt && d.status !== "removed" && (d.routing || d.type === "Coordinator"));
    const ids = new Set(devs.map((d) => d.ieee));
    const links = new Map();
    devs.forEach((d) => {
      const r = d.routing;
      if (!r) return;
      if (r.parent && ids.has(r.parent.ieee)) {
        links.set([d.ieee, r.parent.ieee].sort().join("|"), { a: d.ieee, b: r.parent.ieee, lqi: r.parent.lqi, parent: true });
      }
      if (d.type === "Router") {
        (r.neighbours || []).forEach((n) => {
          const other = state.byIeee.get(n.ieee);
          if (!ids.has(n.ieee) || !other || other.type === "EndDevice") return;
          const key = [d.ieee, n.ieee].sort().join("|");
          const prev = links.get(key);
          if (!prev) links.set(key, { a: d.ieee, b: n.ieee, lqi: n.lqi, parent: false });
          else if (!prev.parent && (n.lqi || 0) > (prev.lqi || 0)) prev.lqi = n.lqi;
        });
      }
    });
    return { devs, links: [...links.values()] };
  };

  const mapAdvice = (bt) => {
    const devs = visible().filter((d) => d.instance === bt && d.status !== "removed");
    const coord = state.data.devices.find((d) => d.instance === bt && d.type === "Coordinator");
    const scanned = devs.filter((d) => d.routing);
    if (!scanned.length) return [];
    const name = (ieee) => nameOf(state.byIeee.get(ieee)) || ieee;
    const link = (ieee) => `<a href="#${esc(ieee)}" data-mapsel="${esc(ieee)}" data-net="${esc(bt)}">${esc(name(ieee))}</a>`;
    const out = [];
    const routers = devs.filter((d) => d.type === "Router" && statusOf(d) === "active");
    const ends = devs.filter((d) => d.type === "EndDevice");

    // 1. weak parent link where a better router can hear the device
    ends.forEach((d) => {
      const p = d.routing?.parent;
      if (!p || p.lqi === null || p.lqi === undefined || p.lqi >= 60) return;
      const better = (d.routing.neighbours || []).filter((n) => n.ieee !== p.ieee && state.byIeee.get(n.ieee)?.type === "Router" && (n.lqi || 0) >= Math.max(80, p.lqi + 40)).sort((a, b) => b.lqi - a.lqi)[0];
      if (better) {
        out.push({ sev: 2, icon: "swap-horizontal", text: `${link(d.ieee)} connects through ${link(p.ieee)} with a weak link (LQI ${p.lqi}), but ${link(better.ieee)} hears it much better (LQI ${better.lqi}). Power-cycle ${esc(name(d.ieee))} or press its button a few times near ${esc(name(better.ieee))} so it picks the stronger router.` });
      } else {
        const alt = suggestRouter(d);
        const where = state.byIeee.get(p.ieee)?.area;
        out.push(alt
          ? { sev: 2, icon: "swap-horizontal", text: `${link(d.ieee)}${d.area ? ` in ${esc(d.area)}` : ""} connects through ${link(p.ieee)}${where ? ` in ${esc(where)}` : ""} with a weak link (LQI ${p.lqi}). ${link(alt.ieee)} is a router in the same room, so re-pairing through it should give a much stronger connection.`,
              action: `<button class="btn" data-act="move" data-ieee="${esc(d.ieee)}" data-via="${esc(alt.ieee)}">Move</button>` }
          : { sev: 2, icon: "router-wireless", text: `${link(d.ieee)}${d.area ? ` in ${esc(d.area)}` : ""} connects through ${link(p.ieee)}${where ? ` in ${esc(where)}` : ""} with a weak link (LQI ${p.lqi}), and there's no router in ${d.area ? esc(d.area) : "its room"}. Add a mains-powered Zigbee plug or switch nearby, then move it to that router.` });
      }
    });

    // 2. routers whose best link is weak
    routers.forEach((d) => {
      const best = Math.max(0, ...(d.routing?.neighbours || []).filter((n) => state.byIeee.get(n.ieee)?.type !== "EndDevice").map((n) => n.lqi || 0));
      if (d.routing && best < 50) out.push({ sev: 2, icon: "lan-disconnect", text: `Router ${link(d.ieee)}${d.area ? ` in ${esc(d.area)}` : ""} only has weak links to the rest of the mesh (best LQI ${best}). Devices that route through it suffer too. Move it closer, or add another router between it and the rest of the network.` });
    });

    // 3. overloaded parents
    const kids = {};
    ends.forEach((d) => { const p = d.routing?.parent?.ieee; if (p) kids[p] = (kids[p] || 0) + 1; });
    Object.entries(kids).forEach(([p, n]) => {
      const isCoord = coord && p === coord.ieee;
      if ((isCoord && n > 12) || (!isCoord && n > 10)) out.push({ sev: 1, icon: "sitemap", text: `${isCoord ? "The coordinator" : link(p)} is carrying ${n} battery devices directly. Adding a router or two nearby spreads the load and makes the network more resilient.` });
    });

    // 4. rooms with battery devices but no router
    const areas = {};
    devs.forEach((d) => { if (!d.area) return; const a = (areas[d.area] ||= { routers: 0, ends: [], weak: 0 }); if (d.type === "Router" && statusOf(d) === "active") a.routers++; if (d.type === "EndDevice") { a.ends.push(d); if ((d.routing?.parent?.lqi ?? 255) < 80) a.weak++; } });
    Object.entries(areas).forEach(([area, a]) => {
      if (!a.routers && a.ends.length >= 2) out.push({ sev: a.weak ? 2 : 1, icon: "power-plug", text: `${esc(area)} has ${a.ends.length} battery devices but no router${a.weak ? `, and ${a.weak} of them have below-average links` : ""}. A mains-powered Zigbee smart plug in ${esc(area)} would give them a closer, stronger connection.` });
    });

    // 5. single points of failure (computed by the app from the latest scan)
    (state.data.single_points?.[bt] || []).forEach((p) => {
      const names = p.routers.slice(0, 5).map((r) => link(r.ieee)).join(", ") + (p.routers.length > 5 ? "…" : "");
      out.push({ sev: p.routers.length + p.devices >= 3 ? 2 : 1, icon: "router-wireless",
        text: `${link(p.ieee)} is the only path to the coordinator for ${p.routers.length} router${p.routers.length === 1 ? "" : "s"} (${names})${p.devices ? ` and ${p.devices} battery device${p.devices === 1 ? "" : "s"} behind them` : ""}${p.children ? `. It also carries ${p.children} battery device${p.children === 1 ? "" : "s"} directly` : ""}. If it loses power, all of them have to find another way in. A router placed between them and the rest of the mesh gives a second path.` });
    });

    // 6. devices missing from the scan
    const missing = devs.filter((d) => !d.routing && d.type !== "Coordinator" && statusOf(d) === "active");
    if (missing.length) out.push({ sev: 1, icon: "help-circle-outline", text: `${missing.length} active device${missing.length === 1 ? " wasn't" : "s weren't"} in the scan: ${missing.slice(0, 6).map((d) => link(d.ieee)).join(", ")}${missing.length > 6 ? "…" : ""}. Sleepy battery devices often miss scans. If one keeps missing, check its signal.` });

    if (!out.length) out.push({ sev: 0, icon: "check", text: "No problems found. Every device has a reasonable link and no router is overloaded." });
    return out.sort((a, b) => b.sev - a.sev);
  };

  const renderMap = (force = false) => {
    const nm = state.data.networkmap || {};
    const sig = JSON.stringify(state.data.instances.map((bt) => [bt, nm[bt]?.scanned_at, nm[bt]?.running_since, MAP.scanSel[bt], MAP.cmpSel[bt], (MAP.hist[bt] || []).length])) + MAP.allLinks;
    if (!force && MAP.rendered === sig && $("#view .map-card")) { refreshMapInfo(); return; }
    MAP.rendered = sig;
    Object.values(MAP.sims).forEach((s) => s.stop());
    MAP.sims = {};
    const running = Object.values(nm).some((x) => x.running_since);
    $("#view").innerHTML = `
      <div class="alert" style="--a:var(--info)">${ic("information-outline")}<div class="body">Drag dots to rearrange, drag the background to pan and scroll to zoom. Solid lines show which router each battery device uses, dashed lines link routers. Colour shows link quality.</div>
        <button class="btn ${running ? "busy" : ""}" data-act="scan" ${running ? "disabled" : ""}>${ic(running ? "refresh" : "sitemap", "s18")}${running ? "Scanning…" : "Run routing scan"}</button></div>
      ${state.data.instances.map((bt) => {
        const info = nm[bt] || {};
        const g = mapGraph(bt);
        const head = `<div class="card-header">${ic("sitemap")}<div>${esc(netLabel(bt))} network<small>${info.running_since ? "Scanning now…" : info.scanned_at ? `Scanned ${esc(relTime(info.scanned_at).toLowerCase())} · ${info.nodes ?? g.devs.length} devices, ${info.links ?? "?"} links` : "Not scanned yet"}</small></div></div>`;
        if (g.devs.filter((d) => d.routing).length === 0) return `<div class="card map-card">${head}${emptyState("sitemap", "No routing data yet", "Run a routing scan to see which router each device connects through. It also runs nightly.")}</div>`;
        const advice = mapAdvice(bt);
        const times = (state.data.scan_times?.[bt] || []).slice().reverse();
        const diff = mapDiff(bt);
        const nm2 = (ieee) => esc(nameOf(state.byIeee.get(ieee)) || ieee);
        const history = times.length > 1 ? `<div class="map-hist">
            <label>Showing<select class="field" data-mapscan="${esc(bt)}"><option value="">Latest scan (${esc(fmtDate(times[0]))})</option>${times.slice(1).map((t) => `<option value="${esc(t)}" ${MAP.scanSel[bt] === t ? "selected" : ""}>${esc(fmtDate(t))}</option>`).join("")}</select></label>
            <label>Compare with<select class="field" data-mapcmp="${esc(bt)}"><option value="">Nothing</option>${times.filter((t) => t !== (MAP.scanSel[bt] || times[0]) && t < (MAP.scanSel[bt] || times[0])).map((t) => `<option value="${esc(t)}" ${MAP.cmpSel[bt] === t ? "selected" : ""}>${esc(fmtDate(t))}</option>`).join("")}</select></label>
            ${MAP.scanSel[bt] ? `<span class="muted">Older scan. Advice below is for the latest scan.</span>` : ""}</div>`
          : `<div class="map-hist muted">Scan history builds up from here, one scan a night, so you can compare before and after a change.</div>`;
        const changes = diff ? `<div class="sub-h">Changes since ${esc(fmtDate(diff.oldAt))}</div><div class="advice">
            ${diff.moved.map((m) => `<div class="adv"><span class="state-ic" style="color:var(--info)">${ic("swap-horizontal")}</span><div class="text"><b>${nm2(m.dev)}</b> moved from ${nm2(m.from)} (LQI ${esc(m.oldQ ?? "?")}) to ${nm2(m.to)} (LQI ${esc(m.newQ ?? "?")})</div></div>`).join("")}
            ${diff.better.map((m) => `<div class="adv"><span class="state-ic" style="color:var(--success)">${ic("arrow-up")}</span><div class="text"><b>${nm2(m.dev)}</b> link to ${nm2(m.p)} improved: LQI ${esc(m.oldQ)} → ${esc(m.newQ)}</div></div>`).join("")}
            ${diff.worse.map((m) => `<div class="adv"><span class="state-ic" style="color:var(--error)">${ic("arrow-down")}</span><div class="text"><b>${nm2(m.dev)}</b> link to ${nm2(m.p)} got weaker: LQI ${esc(m.oldQ)} → ${esc(m.newQ)}</div></div>`).join("")}
            ${!diff.moved.length && !diff.better.length && !diff.worse.length ? `<div class="adv"><span class="state-ic">${ic("check")}</span><div class="text">No devices changed router and no link changed by 25 or more.</div></div>` : ""}</div>` : "";
        return `<div class="card map-card" data-net="${esc(bt)}">${head}${history}
          <div class="map-tools"><button class="icon-btn" data-mapzoom="1.25" data-net="${esc(bt)}" aria-label="Zoom in">${ic("plus")}</button><button class="icon-btn" data-mapzoom="0.8" data-net="${esc(bt)}" aria-label="Zoom out">${ic("minus")}</button>
            <button class="btn" data-mapreset="${esc(bt)}">${ic("refresh", "s18")}Reset layout</button>
            <button class="chip toggle" data-maplinks aria-pressed="${MAP.allLinks}">${ic("link-variant", "s18")}All router links</button>
            <span class="spacer"></span>
            <div class="map-legend"><span><i style="background:var(--text)"></i>Coordinator</span><span><i style="background:var(--primary)"></i>Router</span><span><i style="background:var(--state-icon)"></i>Battery device</span><span><i style="background:var(--warning)"></i>Needs attention</span><span><b style="background:var(--success)"></b>Strong</span><span><b style="background:var(--warning)"></b>Fair</span><span><b style="background:var(--error)"></b>Weak</span></div></div>
          <div class="map-stage"><svg class="map" id="map-${esc(bt)}" role="img" aria-label="${esc(netLabel(bt))} network map"><g class="vp"><g class="links"></g><g class="nodes"></g></g></svg>
            <div class="map-info" id="mapinfo-${esc(bt)}" hidden></div></div>
          ${diff ? `<div class="map-legend" style="padding:8px 16px 0"><span><b style="background:var(--info);height:4px"></b>Changed router</span><span><b style="background:var(--success);height:4px"></b>Stronger</span><span><b style="background:var(--error);height:4px"></b>Weaker</span><span><b style="background:var(--disabled)"></b>Unchanged</span></div>` : ""}
          ${changes}
          <div class="sub-h">Advice</div>
          <div class="advice">${advice.map((a) => `<div class="adv"><span class="state-ic" style="color:${a.sev >= 2 ? "var(--warning)" : a.sev === 1 ? "var(--info)" : "var(--success)"}">${ic(a.icon)}</span><div class="text">${a.text}</div>${a.action || ""}</div>`).join("")}</div>
        </div>`;
      }).join("")}`;
    state.data.instances.forEach((bt) => { const svg = document.getElementById(`map-${bt}`); if (svg) MAP.sims[bt] = startSim(bt, svg); });
  };

  const refreshMapInfo = () => Object.keys(MAP.sims).forEach((bt) => showMapInfo(bt));

  const showMapInfo = (bt) => {
    const box = document.getElementById(`mapinfo-${bt}`);
    const ieee = MAP.sel[bt];
    const d = ieee && state.byIeee.get(ieee);
    if (!box) return;
    if (!d) { box.hidden = true; return; }
    const r = d.routing || {};
    const parent = r.parent ? state.byIeee.get(r.parent.ieee) : null;
    const kids = state.data.devices.filter((x) => x.routing?.parent?.ieee === d.ieee).length;
    box.hidden = false;
    box.innerHTML = `<div class="mi-head">${stateIc(d)}<div class="text"><b>${esc(nameOf(d) || (d.type === "Coordinator" ? "Coordinator" : d.ieee))}</b><small>${esc([d.area, d.type === "EndDevice" ? "Battery device" : d.type].filter(Boolean).join(" · "))}</small></div><button class="icon-btn" data-mapclose="${esc(bt)}" aria-label="Close">${ic("close", "s20")}</button></div>
      ${kv([[d.type === "EndDevice" ? "Connects through" : null, parent ? `${nameOf(parent) || parent.ieee} (LQI ${r.parent.lqi ?? "?"})` : d.type === "EndDevice" ? "Not found" : null],
        [d.type !== "EndDevice" ? "Battery devices using it" : null, d.type !== "EndDevice" ? kids : null], ["Signal (24 h)", lqiOf(d) === null ? null : Math.round(lqiOf(d))], ["Status", statusOf(d) !== "active" ? STATUS[statusOf(d)].label : warnings(d)[0]?.label || "Active"]].filter(([k]) => k))}
      ${d.type !== "Coordinator" ? `<div class="row-actions"><button class="btn" data-open="${esc(d.ieee)}">Open details</button></div>` : ""}`;
  };

  const startSim = (bt, svg) => {
    const { devs, links } = mapGraph(bt);
    const visibleLinks = MAP.allLinks ? links : links.filter((l) => l.parent || (l.lqi || 0) >= 0 && linksTop(l, links));
    function linksTop(l, all) {
      // keep each router's two strongest router links, so the default view stays readable
      const top = (id) => all.filter((x) => !x.parent && (x.a === id || x.b === id)).sort((p, q) => (q.lqi || 0) - (p.lqi || 0)).slice(0, 2);
      return top(l.a).includes(l) || top(l.b).includes(l);
    }
    const W = svg.clientWidth || 900, H = svg.clientHeight || 560;
    const saved = (MAP.pos ||= {})[bt] || {};
    const nodes = devs.map((d, i) => {
      const p = saved[d.ieee];
      const a = (i / devs.length) * Math.PI * 2;
      const r0 = d.type === "Coordinator" ? 0 : d.type === "Router" ? 140 : 240;
      return { id: d.ieee, d, x: p ? p.x : W / 2 + Math.cos(a) * r0 + (Math.random() - 0.5) * 20, y: p ? p.y : H / 2 + Math.sin(a) * r0 * 0.75 + (Math.random() - 0.5) * 20, vx: 0, vy: 0, fixed: d.type === "Coordinator" && !p, r: d.type === "Coordinator" ? 14 : d.type === "Router" ? 8 : 5.5 };
    });
    const byId = new Map(nodes.map((n) => [n.id, n]));
    if (!saved[devs.find((d) => d.type === "Coordinator")?.ieee]) { const c = nodes.find((n) => n.d.type === "Coordinator"); if (c) { c.x = W / 2; c.y = H / 2; } }
    const L = visibleLinks.map((l) => ({ ...l, s: byId.get(l.a), t: byId.get(l.b) })).filter((l) => l.s && l.t);
    const vp = svg.querySelector(".vp"), gl = svg.querySelector(".links"), gn = svg.querySelector(".nodes");
    const diff = mapDiff(bt);
    const diffCol = (l) => { const st = diff.status[[l.a, l.b].sort().join("|")]; return st === "moved" ? "var(--info)" : st === "better" ? "var(--success)" : st === "worse" ? "var(--error)" : "var(--disabled)"; };
    gl.innerHTML = L.map((l, i) => { const changed = diff && diff.status[[l.a, l.b].sort().join("|")]; return `<line data-i="${i}" stroke="${diff ? diffCol(l) : lqiCol(l.lqi)}" stroke-width="${changed ? 3 : l.parent ? 1.6 : 1.1}" ${l.parent ? "" : 'stroke-dasharray="5 4"'} opacity="${diff && !changed ? 0.35 : l.parent ? 0.85 : 0.6}"><title>LQI ${esc(l.lqi ?? "?")}</title></line>`; }).join("");
    gn.innerHTML = nodes.map((n, i) => `<g class="mnode" data-n="${i}" tabindex="0"><circle r="${n.r}" fill="${mapNodeCol(n.d)}" stroke="var(--card)" stroke-width="2"/>${n.d.type === "Coordinator" ? `<text class="c" text-anchor="middle" dy="4">C</text>` : `<text class="lbl" text-anchor="middle" dy="${-n.r - 5}">${esc((nameOf(n.d) || "").slice(0, 28))}</text>`}<title>${esc(nameOf(n.d) || (n.d.type === "Coordinator" ? "Coordinator" : n.id))}${n.d.area ? " · " + esc(n.d.area) : ""}</title></g>`).join("");
    const lineEls = [...gl.children], nodeEls = [...gn.children];
    let view = MAP.view?.[bt] || { k: 1, x: 0, y: 0 };
    const applyView = () => { vp.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); svg.classList.toggle("zoomed", view.k >= 1.4); (MAP.view ||= {})[bt] = view; };
    applyView();
    const draw = () => {
      L.forEach((l, i) => { const e = lineEls[i]; e.setAttribute("x1", l.s.x.toFixed(1)); e.setAttribute("y1", l.s.y.toFixed(1)); e.setAttribute("x2", l.t.x.toFixed(1)); e.setAttribute("y2", l.t.y.toFixed(1)); });
      nodes.forEach((n, i) => nodeEls[i].setAttribute("transform", `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`));
      highlight();
    };
    const highlight = () => {
      const sel = MAP.sel[bt];
      const near = new Set(sel ? L.filter((l) => l.a === sel || l.b === sel).flatMap((l) => [l.a, l.b]) : []);
      L.forEach((l, i) => lineEls[i].classList.toggle("dim", !!sel && l.a !== sel && l.b !== sel));
      nodes.forEach((n, i) => { nodeEls[i].classList.toggle("dim", !!sel && !near.has(n.id) && n.id !== sel); nodeEls[i].classList.toggle("sel", n.id === sel); nodeEls[i].classList.toggle("near", near.has(n.id)); });
    };
    let alpha = Object.keys(saved).length ? 0.15 : 1, raf = null, stopped = false;
    const tick = () => {
      const cx = W / 2, cy = H / 2;
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 0.01;
          if (d2 > 160000) continue;
          const f = (900 * alpha) / d2, d = Math.sqrt(d2);
          dx /= d; dy /= d;
          a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
        }
      }
      L.forEach((l) => {
        const target = l.parent ? (l.t.d.type === "Coordinator" || l.s.d.type === "Coordinator" ? 90 : 55) : 130;
        const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const k = ((d - target) / d) * 0.06 * alpha * (l.parent ? 1 : 0.5);
        l.s.vx += dx * k; l.s.vy += dy * k; l.t.vx -= dx * k; l.t.vy -= dy * k;
      });
      nodes.forEach((n) => {
        n.vx += (cx - n.x) * 0.004 * alpha; n.vy += (cy - n.y) * 0.004 * alpha;
        if (n.fixed) { n.vx = 0; n.vy = 0; return; }
        n.vx *= 0.6; n.vy *= 0.6; n.x += n.vx; n.y += n.vy;
      });
      alpha *= 0.985;
      draw();
      if (alpha > 0.01 && !stopped) raf = requestAnimationFrame(tick); else { raf = null; savePos(); }
    };
    const savePos = () => { (MAP.pos ||= {})[bt] = Object.fromEntries(nodes.map((n) => [n.id, { x: n.x, y: n.y }])); };
    const reheat = (a = 0.3) => { alpha = Math.max(alpha, a); if (!raf && !stopped) raf = requestAnimationFrame(tick); };
    const toSvg = (ev) => { const r = svg.getBoundingClientRect(); return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k }; };
    let drag = null;
    svg.addEventListener("pointerdown", (ev) => {
      const g = ev.target.closest(".mnode");
      svg.setPointerCapture(ev.pointerId);
      if (g) { const n = nodes[+g.dataset.n]; drag = { n, moved: false, start: [ev.clientX, ev.clientY] }; n.fixed = true; }
      else drag = { pan: true, moved: false, start: [ev.clientX, ev.clientY], vx: view.x, vy: view.y };
    });
    svg.addEventListener("pointermove", (ev) => {
      if (!drag) return;
      if (Math.abs(ev.clientX - drag.start[0]) + Math.abs(ev.clientY - drag.start[1]) > 3) drag.moved = true;
      if (drag.pan) { view = { ...view, x: drag.vx + ev.clientX - drag.start[0], y: drag.vy + ev.clientY - drag.start[1] }; applyView(); }
      else if (drag.moved) { const p = toSvg(ev); drag.n.x = p.x; drag.n.y = p.y; drag.n.vx = drag.n.vy = 0; reheat(0.15); draw(); }
    });
    svg.addEventListener("pointerup", () => {
      if (drag && !drag.moved) { MAP.sel[bt] = drag.n ? (MAP.sel[bt] === drag.n.id ? null : drag.n.id) : null; highlight(); showMapInfo(bt); }
      if (drag?.n && drag.n.d.type !== "Coordinator" && !drag.moved) drag.n.fixed = false;
      drag = null; savePos();
    });
    svg.addEventListener("wheel", (ev) => { ev.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
    svg.addEventListener("keydown", (ev) => { const g = ev.target.closest(".mnode"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); const n = nodes[+g.dataset.n]; MAP.sel[bt] = n.id; highlight(); showMapInfo(bt); } });
    const zoomAt = (f, px, py) => { const k = Math.max(0.3, Math.min(4, view.k * f)); view = { k, x: px - ((px - view.x) * k) / view.k, y: py - ((py - view.y) * k) / view.k }; applyView(); };
    raf = requestAnimationFrame(tick);
    showMapInfo(bt);
    return {
      stop() { stopped = true; if (raf) cancelAnimationFrame(raf); savePos(); },
      zoom(f) { zoomAt(f, W / 2, H / 2); },
      reset() { delete MAP.pos[bt]; MAP.view[bt] = { k: 1, x: 0, y: 0 }; renderMap(true); },
      select(id) { MAP.sel[bt] = id; highlight(); showMapInfo(bt); },
    };
  };

  const renderActivity = () => {
    const events = [...(state.data.events || [])].reverse().slice(0, 500);
    if (!events.length) { $("#view").innerHTML = `<div class="card">${emptyState("history", "No activity yet", "Joins, leaves, renames, removals, battery changes and online/offline changes appear here.")}</div>`; return; }
    const groups = [];
    events.forEach((e) => { const day = fmtDate(e.time, false); if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, items: [] }); groups[groups.length - 1].items.push(e); });
    $("#view").innerHTML = `<div class="card">${groups.map((g) => `<div class="logday">${esc(g.day)}</div>` + g.items.map((e) => {
      const d = state.byIeee.get(e.ieee);
      const who = e.name && !IEEE_RE.test(e.name) ? e.name : nameOf(d) || e.ieee;
      const [icon, color] = EVENT_ICON(e.kind);
      return `<div class="log" ${d ? `data-open="${esc(e.ieee)}"` : ""}><span class="state-ic" style="color:${color}">${ic(icon)}</span>
        <div class="text"><div class="t1"><b>${esc(who)}</b> ${esc(e.kind)}${e.detail ? ` · ${esc(e.detail)}` : ""}</div><div class="t2">${esc(netLabel(e.instance))} network${d?.area ? ` · ${esc(d.area)}` : ""}</div></div>
        <time>${esc(fmtTime(e.time))}</time></div>`;
    }).join("")).join("")}</div>`;
  };

  // ------------------------------------------------------------ settings
  const renderSettings = async (refetch = true) => {
    if (refetch || !state.settings) {
      if (!state.settings) $("#view").innerHTML = `<div class="card">${emptyState("cog", "Loading settings…", "")}</div>`;
      try { state.settings = await api("api/settings"); } catch (err) { $("#view").innerHTML = `<div class="card">${emptyState("alert-circle", "Couldn't load settings", esc(err.message))}</div>`; return; }
    }
    if (state.view !== "settings") return;
    const S = state.settings, s = S.settings;
    const off = !s.alerts_enabled;
    const disabled = new Set(s.disabled_checks || []), notify = new Set(s.notify_checks || []);
    const sw = (key, checked, title, desc, dis = false) => `<div class="set-row ${dis ? "disabled" : ""}"><div class="text"><div class="t1">${title}</div><div class="t2">${desc}</div></div><div class="ctl"><label class="switch"><input type="checkbox" data-set="${key}" ${checked ? "checked" : ""} ${dis ? "disabled" : ""} aria-label="${esc(title)}"><span class="track"></span><span class="thumb"></span></label></div></div>`;
    const num = (key, title, desc, min, max, unit) => `<div class="set-row"><div class="text"><div class="t1">${title}</div><div class="t2">${desc}</div></div><div class="ctl"><input class="field num" type="number" data-num="${key}" min="${min}" max="${max}" value="${esc(s[key])}" aria-label="${esc(title)}"><span class="unit">${unit}</span></div></div>`;
    const checks = S.checks.map((c) => {
      const cur = disabled.has(c.key) ? "off" : notify.has(c.key) ? "notify" : c.event ? "off" : "show";
      const opts = c.event ? [["off", "Off"], ["notify", "Notify"]] : [["off", "Off"], ["show", "Show in Health"], ["notify", "Show and notify"]];
      const rowDis = off && c.event;
      return `<div class="set-row ${rowDis ? "disabled" : ""}"><div class="text"><div class="t1">${esc(c.label)}</div><div class="t2">${esc(c.description)}</div></div><div class="ctl"><select class="field" data-checksel="${c.key}" data-event="${c.event ? 1 : 0}" aria-label="${esc(c.label)}" ${rowDis ? "disabled" : ""}>${opts.map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""} ${off && v === "notify" && cur !== "notify" ? "disabled" : ""}>${l}</option>`).join("")}</select></div></div>`;
    }).join("");
    const nm = S.networkmap || {};
    const scans = S.networks.map((n) => { const x = nm[n.topic] || {}; return `${netLabel(n.topic)}: ${x.running_since ? "scanning…" : x.scanned_at ? relTime(x.scanned_at) : "never"}`; }).join(" · ");
    const hours = [`<option value="-1" ${s.networkmap_hour < 0 ? "selected" : ""}>Off (manual only)</option>`].concat([...Array(24).keys()].map((h) => `<option value="${h}" ${s.networkmap_hour === h ? "selected" : ""}>Daily at ${String(h).padStart(2, "0")}:00</option>`)).join("");
    $("#view").innerHTML = `
      <div class="card"><div class="card-header">Notifications</div>
        ${off ? `<div class="card-content"><div class="alert" style="--a: var(--warning)">${ic("bell-off")}<div class="body"><b>Alerts are off.</b> Nothing is sent. Your choices below are kept for when you turn them back on.</div></div></div>` : ""}
        ${sw("alerts_enabled", s.alerts_enabled, "Send alerts", "Master switch for every alert")}
        ${sw("persistent_notifications", s.persistent_notifications, "Home Assistant notifications", "Shows in the notification panel and clears itself when fixed", off)}
        ${sw("fire_events", s.fire_events, "Automation event", "Fires <span class='mono'>z2m_tracker_alert</span> for your automations", off)}
        <div class="set-row ${off ? "disabled" : ""}"><div class="text"><div class="t1">Mobile notifications</div><div class="t2">Notify service, e.g. <span class="mono">notify.mobile_app_your_phone</span></div></div>
          <div class="ctl"><input class="field" id="notifySvc" style="width:240px" value="${esc(s.notify_service || "")}" placeholder="notify.mobile_app_…" spellcheck="false" ${off ? "disabled" : ""}><button class="btn" data-act="save-notify" ${off ? "disabled" : ""}>Save</button></div></div>
        <div class="card-actions"><button class="btn" data-act="test-notify" ${off ? "disabled" : ""}>${ic("bell", "s18")}Send test notification</button></div>
      </div>
      <div class="card"><div class="card-header"><div>Weekly summary<small>One message a week: what needs attention, batteries to buy, new and removed devices.</small></div></div>
        ${sw("weekly_summary", s.weekly_summary, "Send a weekly summary", "Uses your notification settings above, plus the z2m_tracker_summary event")}
        <div class="set-row ${s.weekly_summary ? "" : "disabled"}"><div class="text"><div class="t1">When</div><div class="t2">Day and time it's sent</div></div><div class="ctl">
          <select class="field" id="sumDay" ${s.weekly_summary ? "" : "disabled"}>${["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].map((n, i) => `<option value="${i}" ${s.summary_day === i ? "selected" : ""}>${n}</option>`).join("")}</select>
          <select class="field" id="sumHour" ${s.weekly_summary ? "" : "disabled"}>${[...Array(24).keys()].map((h) => `<option value="${h}" ${s.summary_hour === h ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select></div></div>
        <div class="card-actions"><button class="btn" data-act="send-summary">Send one now</button></div>
      </div>
      <div class="card"><div class="card-header"><div>Checks<small>Off stops checking. Show in Health lists it only. Show and notify also sends an alert.</small></div></div>${checks}</div>
      <div class="card"><div class="card-header">Thresholds</div>
        ${num("offline_alert_minutes", "Offline for", "How long a device is unavailable before it's flagged", 0, 10080, "min")}
        ${num("frozen_alert_hours", "Reading unchanged for", "How long a reading can stay identical while the device keeps reporting", 1, 720, "h")}
        ${num("battery_alert_percent", "Low battery at", "Battery level at or below which a device is flagged", 0, 100, "%")}
        ${num("chatty_per_hour", "Chatty above", "Messages an hour, averaged over 6 hours, before a device counts as chatty", 60, 36000, "/h")}
      </div>
      <div class="card"><div class="card-header"><div>Routing scan<small>Maps which router each device connects through. Adds network traffic for a few minutes.</small></div></div>
        <div class="set-row"><div class="text"><div class="t1">Wi-Fi channels (2.4 GHz)</div><div class="t2">Used to check your Zigbee channels for overlap. Your router's Wi-Fi settings show the channel, e.g. 1, 6 or 11.</div></div><div class="ctl"><input class="field" id="wifiCh" style="width:120px" value="${esc(s.wifi_channels || "")}" placeholder="e.g. 9" inputmode="numeric"><button class="btn" data-act="save-wifi">Save</button></div></div>
        <div class="set-row"><div class="text"><div class="t1">Schedule</div><div class="t2">Last scans: ${esc(scans)}</div></div><div class="ctl"><select class="field" id="scanHour">${hours}</select></div></div>
        <div class="card-actions"><button class="btn" data-act="scan">${ic("sitemap", "s18")}Run scan now</button></div>
      </div>
      <div class="card"><div class="card-header">Home Assistant entities</div>
        ${sw("ha_entities", s.ha_entities, "Add entities to Zigbee devices", `${S.entities} published. Needs attention, Reading frozen, Reconfigure and Battery replaced are enabled. Signal, uptime, battery days left, battery type and Connected via are added disabled.`)}
      </div>
      <div class="card"><div class="card-header">Ignored alerts</div>
        ${S.muted.length ? S.muted.map((m) => `<div class="set-row"><div class="text"><div class="t1">${esc(m.name)}</div><div class="t2">${esc((S.checks.find((c) => c.key === m.kind) || {}).label || m.kind)} · ${m.until ? `until ${esc(fmtDate(m.until))}` : "forever"}</div></div><div class="ctl"><button class="btn" data-act="unmute" data-ieee="${esc(m.ieee)}" data-kind="${esc(m.kind)}">Stop ignoring</button></div></div>`).join("") + `<div class="card-actions"><button class="btn" data-act="unmute-all">Stop ignoring all</button></div>` : `<div class="set-row"><div class="text"><div class="t2">Nothing ignored.</div></div></div>`}
      </div>
      <div class="card"><div class="card-header">Appearance &amp; data</div>
        <div class="set-row"><div class="text"><div class="t1">Theme</div><div class="t2">Saved in this browser</div></div><div class="ctl"><select class="field" id="themeSel">${THEMES.map((t) => `<option value="${t}" ${theme === t ? "selected" : ""}>${cap(t)}</option>`).join("")}</select></div></div>
        <div class="set-row"><div class="text"><div class="t1">Import history</div><div class="t2">Re-scan Z2M databases, backups, logs and HA registries for old devices and names</div></div><div class="ctl"><button class="btn" data-act="import">Import</button></div></div>
        <div class="set-row"><div class="text"><div class="t1">Backup</div><div class="t2">Download the tracker's full history, or restore it from a backup file. Separate from HA backups.</div></div><div class="ctl"><a class="btn" href="api/backup" download>Download</a><button class="btn" data-act="restore">Restore</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div></div>
        <div class="set-row"><div class="text"><div class="t1">Export</div><div class="t2">Every device with hardware, battery and asset details as CSV</div></div><div class="ctl"><a class="btn" href="api/export.csv" download>Export CSV</a></div></div>
        <div class="set-row"><div class="text"><div class="t1">Networks</div><div class="t2">${S.networks.map((n) => esc(n.topic)).join(", ")}. Add networks in the app's Configuration tab.</div></div><div class="ctl">${S.networks.filter((n) => n.panel).map((n) => `<a class="btn" href="${esc(n.panel)}" target="_top">${esc(netLabel(n.topic))}${ic("open-in-new", "s18")}</a>`).join("")}</div></div>
        <div class="set-row"><div class="text"><div class="t1">Device details</div><div class="t2">Side panel next to the list on wide screens, or a pop-up dialog. Phones always use the dialog.</div></div><div class="ctl"><select class="field" id="layoutSel"><option value="pane" ${state.layout === "pane" ? "selected" : ""}>Side panel</option><option value="dialog" ${state.layout === "dialog" ? "selected" : ""}>Pop-up dialog</option></select></div></div>
        <div class="set-row links"><div class="text"><div class="t1">Version</div><div class="t2">Z2M Device Tracker ${esc(S.version)}</div></div><div class="ctl">${LINKS.map(([href, label]) => `<a class="btn" href="${href}" target="_blank" rel="noopener">${label}${ic("open-in-new", "s18")}</a>`).join("")}</div></div>
      </div>`;
  };
  const saveSettings = async (changes) => {
    try {
      const res = await api("api/settings", { changes });
      state.settings = res;
      renderSettings(false);
      snack(res.persisted ? "Saved" : "Applied, but couldn't save to the app configuration. It resets on restart.", res.persisted ? 1600 : 5000);
      load();
    } catch (err) { snack(`Couldn't save: ${err.message}`, 4000); renderSettings(false); }
  };

  // ------------------------------------------------------------ more-info dialog
  const sparkline = (points, { min = null, max = null, color = "var(--primary)" } = {}) => {
    if (!points || points.length < 2) return `<div class="card-content muted">Not enough data yet. This fills in as readings arrive.</div>`;
    const W = 500, H = 120, pad = 6;
    const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = min ?? Math.min(...ys), hi = max ?? Math.max(...ys);
    const sx = (x) => (x1 === x0 ? W / 2 : ((x - x0) / (x1 - x0)) * W);
    const sy = (y) => (hi === lo ? H / 2 : H - pad - ((y - lo) / (hi - lo)) * (H - pad * 2));
    const line = points.map((p) => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--divider)" vector-effect="non-scaling-stroke"/>
      <polygon points="0,${H} ${line} ${W},${H}" fill="${color}" fill-opacity="0.12"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>
      <div class="chart-axis"><span>${esc(fmtDate(x0, false))}</span><span>${esc(fmtDate(x1, false))}</span></div>`;
  };
  const kv = (rows) => `<div class="kv">${rows.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v, mono]) => `<div><span>${k}</span><b ${mono ? 'class="mono"' : ""}>${esc(v)}</b></div>`).join("")}</div>`;
  const devLink = (ieee) => { const d = state.byIeee.get(ieee); return d ? `<a href="#${esc(ieee)}" data-open="${esc(ieee)}">${esc(nameOf(d) || ieee)}</a>` : esc(ieee); };

  const tabInfo = (d) => {
    const st = statusOf(d);
    const u = d.update || {};
    const r = d.routing;
    const lqi = lqiOf(d), power = powerOf(d);
    const bigState = st !== "active" ? STATUS[st].label : warnings(d)[0]?.label || "Active";
    return `
      <div class="more-hero">${stateIc(d)}<div class="big">${esc(bigState)}</div><div class="sub">Last seen ${esc(relTime(d.last_seen).toLowerCase())}</div></div>
      <div class="more-actions">
        ${d.status !== "removed" ? `<button class="btn outlined" data-act="reconfigure" data-ieee="${esc(d.ieee)}">${ic("refresh", "s18")}Reconfigure</button><button class="btn outlined" data-act="rename">${ic("pencil", "s18")}Rename or set area</button>` : ""}
        ${d.status !== "removed" && d.type === "EndDevice" ? `<button class="btn outlined" data-act="move" data-ieee="${esc(d.ieee)}">${ic("swap-horizontal", "s18")}Change router</button>` : ""}
        ${d.model && d.supported !== false ? `<a class="btn outlined" href="https://www.zigbee2mqtt.io/devices/${encodeURIComponent(String(d.model).replace(/\//g, "_"))}.html" target="_blank" rel="noopener">${ic("information-outline", "s18")}Docs</a>` : ""}
        ${d.ha_device_id ? `<a class="btn outlined" href="/config/devices/device/${esc(d.ha_device_id)}" target="_top">${ic("home-assistant", "s18")}Device page</a>` : ""}
        ${state.data.panels?.[d.instance] && d.status !== "removed" ? `<a class="btn outlined" href="${esc(state.data.panels[d.instance])}" target="_top">${ic("zigbee", "s18")}Zigbee2MQTT</a>` : ""}
      </div>
      ${u.state === "updating" ? `<div class="alerts"><div class="alert" style="--a:var(--info)">${ic("chip")}<div class="body"><b>Updating firmware${u.progress !== undefined && u.progress !== null ? ` · ${Math.round(u.progress)} %` : ""}</b>${u.remaining ? ` · about ${span(u.remaining)} left` : ""}. Keep the device powered and in range.<div class="bar"><i style="width:${Math.max(2, Math.min(100, u.progress || 0))}%"></i></div></div></div></div>` : ""}
      ${u.state === "available" && d.status !== "removed" ? `<div class="alerts"><div class="alert" style="--a:var(--info)">${ic("chip")}<div class="body"><b>Firmware update available</b> · ${esc(u.installed_version)} → ${esc(u.latest_version)}</div><button class="btn" data-act="ota-update">Update</button></div></div>` : ""}
      <div class="alerts">${(d.issues || []).map((i) => `<div class="alert" style="--a:${i.severity === "warning" ? "var(--warning)" : "var(--info)"}">${ic(KIND_ICON[i.kind] || "alert")}<div class="body"><b>${esc(i.title)}.</b> ${esc(i.detail)}</div>${issueActions(i)}</div>`).join("")}
        ${st === "removed" ? `<div class="alert" style="--a:var(--text-2)">${ic("information-outline")}<div class="body"><b>Removed from Zigbee2MQTT</b> ${d.removed_at ? `on ${esc(fmtDate(d.removed_at))}` : "(date not recorded)"}.${d.successor ? ` Replaced by ${devLink(d.successor)}.` : ""}</div></div>` : ""}</div>
      ${kv([["Model", deviceLine(d) || "Unknown"], ["Description", d.description], ["Area", d.area], ["Network", netLabel(d.instance)], ["Signal (24 h)", lqi === null ? null : Math.round(lqi)],
        ["Battery", typeof d.battery === "number" ? `${Math.round(d.battery)} %` : power], ["First seen", fmtDate(d.first_seen) || "Unknown"], ["Last seen", fmtDate(d.last_seen) || "Never"],
        ["Availability", d.availability ? `${cap(d.availability)} since ${fmtDate(d.availability_since)}` : null], ["IEEE address", d.ieee, true], ["Zigbee model ID", d.model_id, true], ["Manufacturer", d.manufacturer, true],
        ["Radio maker", d.oui_vendor], ["Type", d.type], ["Power source", d.power_source], ["Firmware", [d.software_build_id, d.date_code].filter(Boolean).join(" · ")],
        ["OTA", u.installed_version !== undefined && u.installed_version !== -1 ? `${u.installed_version}${u.state === "available" ? ` → ${u.latest_version} available` : " (latest)"}` : null],
        ["Interview", d.interview_state ? cap(d.interview_state.toLowerCase().replace(/_/g, " ")) : null], ["HA name", d.ha_name]])}
      ${d.status !== "removed" && u.installed_version !== undefined && u.installed_version !== -1 && u.state !== "updating" ? `<div class="row-actions"><button class="btn" data-act="ota-check">${ic("refresh", "s18")}Check for firmware update</button></div>` : ""}
      <div class="sub-h">Routing</div>
      ${r ? kv([[d.type === "EndDevice" ? "Connects through" : "Child devices", d.type === "EndDevice" ? (r.parent ? nameOf(state.byIeee.get(r.parent.ieee)) || r.parent.ieee : "Not found in scan") : r.children], ["Depth", r.depth], ["Scanned", fmtDate(r.scanned_at)]]) +
        (r.neighbours?.length ? `<div class="rep-list">${r.neighbours.slice(0, 6).map((n) => `<div><span>${devLink(n.ieee)}</span><span class="muted">LQI ${esc(n.lqi ?? "?")}</span></div>`).join("")}</div>` : "")
        : `<div class="card-content muted">Not scanned yet. The routing scan runs nightly, or start one from the menu.</div>`}
      ${tabTraffic(d)}
      ${d.features?.length ? `<div class="sub-h">Capabilities</div><div class="caps">${d.features.map((f) => `<span>${esc(f)}</span>`).join("")}</div>` : ""}`;
  };

  const tabTraffic = (d) => {
    if (d.status === "removed" || d.type === "Coordinator") return "";
    const m = d.metrics || {}, z = d.z2m_stats || {};
    const rate = m.msg_rate_6h;
    const counting = rate === undefined && m.msg_24h === undefined ? `<div class="card-content muted">Message counts start from the last app update. Nothing received from this device since then.</div>` : "";
    const traffic = counting + kv([["Messages, last 6 h", rate !== undefined ? `${Math.round(rate)} an hour${rate ? ` (one every ${rate >= 3600 ? "<1" : Math.round(3600 / rate)} s)` : ""}` : null],
      ["Usual rate", m.msg_rate_prev !== undefined ? `${Math.round(m.msg_rate_prev)} an hour` : null], ["Messages, last 24 h", m.msg_24h],
      ["Since Zigbee2MQTT started", z.messages !== undefined && z.messages !== null ? `${z.messages} messages · left ${z.leave_count ?? 0}× · address changed ${z.nwk_changes ?? 0}×` : null]]);
    const lost = d.lost_bindings || [];
    const bindings = d.bindings;
    const label = (b) => { const t = b.target || ""; if (t.startsWith("group:")) { const g = t.slice(6); return `group ${esc(state.data.groups?.[d.instance]?.[g] || g)}`; } const [ieee, ep] = t.split("/"); const o = state.byIeee.get(ieee); return o?.type === "Coordinator" ? "Coordinator" : `${devLink(ieee)}${ep && ep !== "1" && ep !== "None" ? ` (endpoint ${esc(ep)})` : ""}`; };
    const list = bindings === null || bindings === undefined ? `<div class="card-content muted">Not reported by Zigbee2MQTT yet.</div>`
      : !bindings.length && !lost.length ? `<div class="card-content muted">No bindings.</div>`
      : `<div class="rep-list">${bindings.map((b) => `<div><span>${esc(b.cluster)} → ${label(b)}</span><span class="muted">endpoint ${esc(b.ep)}</span></div>`).join("")}${lost.map((b) => `<div><span style="color:var(--error)">${esc(b.cluster)} → ${label(b)}</span><span class="muted">lost ${esc(relTime(b.lost_at).toLowerCase())}</span></div>`).join("")}</div>`;
    return `<div class="sub-h">Traffic</div>${traffic}<div class="sub-h">Bindings</div>${list}`;
  };

  const tabHealth = (d) => {
    const m = d.metrics || {};
    const outages = [...(d.outages || [])].reverse().slice(0, 8);
    const readings = Object.entries(d.readings || {});
    return `
      <div class="sub-h">Signal, last 7 days</div>
      ${kv([["Now", d.lqi ?? "—"], ["24 h average", m.lqi_24h ?? "—"], ["Previous week", m.lqi_prev_7d ?? "—"]])}
      ${sparkline(m.lqi_spark, { min: 0, max: 255 })}
      <div class="sub-h">Availability${d.uptime_30d !== null && d.uptime_30d !== undefined ? ` · ${d.uptime_30d} % over 30 days` : ""}</div>
      ${outages.length ? `<div class="rep-list">${outages.map((o) => { const s = (new Date(o.end || Date.now()) - new Date(o.start)) / 1000; return `<div><span>${esc(fmtDate(o.start))}</span><span class="muted">${o.end ? span(s) : `ongoing · ${span(s)}`}</span></div>`; }).join("")}</div>` : `<div class="card-content muted">No outages recorded${d.availability ? "" : " (Z2M availability isn't reporting this device)"}.</div>`}
      <div class="sub-h">Monitored readings</div>
      ${readings.length ? `<div class="rep-list">${readings.map(([k, r]) => `<div><span>${esc(cap(k.replace(/_/g, " ")))}: ${esc(r.value)}</span><span class="muted">changed ${esc(relTime(r.changed_at).toLowerCase())} · ${esc(r.reports)} reports since</span></div>`).join("")}</div>` : `<div class="card-content muted">No temperature, humidity, pressure or air-quality readings to watch.</div>`}
      ${(d.muted || []).length ? `<div class="sub-h">Ignored alerts</div><div class="rep-list">${d.muted.map((k) => `<div><span>${esc(cap(k.replace(/_/g, " ")))}</span><button class="btn" data-act="unmute" data-ieee="${esc(d.ieee)}" data-kind="${esc(k)}">Stop ignoring</button></div>`).join("")}</div>` : ""}`;
  };

  const tabBattery = (d) => {
    const m = d.metrics || {}, rec = d.battery_record || { type: "", quantity: null, installed: "", replacements: [] };
    const est = m.battery_estimate_days;
    const reps = (rec.replacements || []).map((r, i) => [r, i]).reverse();
    return `
      <div class="more-hero"><span class="state-ic" style="color:${batColor(d.battery)}">${ic("battery")}</span><div class="big">${typeof d.battery === "number" ? `${Math.round(d.battery)} %` : "—"}</div>
        <div class="sub">${est === null || est === undefined ? "Not enough history for an estimate yet" : est <= 0 ? "Due for replacement now" : `About ${Math.round(est)} days until 10 %`}</div></div>
      <div class="more-actions"><button class="btn filled" data-act="battery-replaced">${ic("battery-sync", "s18")}Battery replaced</button></div>
      ${sparkline(m.battery_spark, { min: 0, max: 100, color: batColor(d.battery) })}
      <div class="sub-h">Battery details${rec.source === "battery_notes" ? " · from Battery Notes" : rec.source === "library" ? " · suggested by the Battery Notes library" : ""}</div>
      <form class="form" id="batForm" onsubmit="return false">
        <label>Battery type<input class="field" name="type" list="batTypes" value="${esc(rec.type || "")}" placeholder="CR2032, AAA…" autocomplete="off"></label>
        <label>Quantity<input class="field" name="quantity" type="number" min="1" max="20" value="${esc(rec.quantity ?? "")}" placeholder="1"></label>
        <label class="wide">First installed<input class="field" name="installed" type="date" value="${esc(rec.installed || "")}"></label>
      </form>
      <datalist id="batTypes">${["CR2032", "CR2450", "CR2477", "CR1632", "CR123A", "AAA", "AA", "18650", "Rechargeable (built-in)"].map((t) => `<option value="${t}"></option>`).join("")}</datalist>
      <div class="row-actions"><button class="btn" data-act="save-battery">Save</button><span class="saved" id="savedBat">Saved</span></div>
      <div class="sub-h">Replacement history</div>
      ${reps.length ? `<div class="rep-list">${reps.map(([r, i]) => `<div><span>${esc(fmtDate(r.date, false))} <span class="muted">· ${esc(r.source)}${r.note ? ` · ${esc(r.note)}` : ""}</span></span><button class="icon-btn" data-act="bat-remove" data-index="${i}" aria-label="Remove entry">${ic("delete", "s20")}</button></div>`).join("")}</div>`
        : `<div class="card-content muted">${rec.last_replaced ? `Last replaced ${esc(fmtDate(rec.last_replaced, false))} (Battery Notes).` : "No replacements recorded yet."}</div>`}`;
  };

  const tabHistory = (d) => {
    const names = (d.names || []).filter((n) => n.name && !IEEE_RE.test(n.name)).slice().reverse();
    const events = (state.data.events || []).filter((e) => e.ieee === d.ieee).slice(-30).reverse();
    const removed = visible().filter((x) => x.status === "removed" && x.ieee !== d.ieee && !x.successor).sort((a, b) => collator.compare(nameOf(a) || "~", nameOf(b) || "~"));

    (d.predecessors || []).forEach((p) => { lineage += `<div><span>Replaces ${devLink(p)}</span><button class="btn" data-act="unlink" data-old="${esc(p)}" data-new="${esc(d.ieee)}">Unlink</button></div>`; });
    const sugg = (d.suggestions || []).map((s) => `<div class="alert" style="--a:var(--info)">${ic("link-variant")}<div class="body">Possibly replaces <b>${esc(s.name || s.ieee)}</b>, removed ${esc(fmtDate(s.removed_at, false) || "earlier")}.</div><button class="btn" data-act="link" data-old="${esc(s.ieee)}" data-new="${esc(d.ieee)}">Link</button></div>`).join("");
    return `
      <div class="sub-h">Names</div>

      <div class="sub-h">Replacements</div>
      ${sugg ? `<div class="alerts">${sugg}</div>` : ""}
      ${lineage ? `<div class="rep-list">${lineage}</div>` : !sugg ? `<div class="card-content muted">Not linked to any other device.</div>` : ""}
      ${d.status !== "removed" && removed.length ? `<div class="row-actions"><select class="field" id="linkSel" style="flex:1;min-width:0"><option value="">Link a removed device this replaces…</option>${removed.map((x) => `<option value="${esc(x.ieee)}">${esc(nameOf(x) || x.ieee)}${x.removed_at ? ` · removed ${esc(fmtDate(x.removed_at, false))}` : ""}</option>`).join("")}</select><button class="btn" data-act="link-sel">Link</button></div>` : ""}
      <div class="sub-h">Logbook</div>
      ${events.length ? events.map((e) => { const [icon, color] = EVENT_ICON(e.kind); return `<div class="log" style="cursor:default"><span class="state-ic" style="color:${color}">${ic(icon)}</span><div class="text"><div class="t1">${esc(cap(e.kind))}${e.detail ? ` · ${esc(e.detail)}` : ""}</div><div class="t2">${esc(fmtDate(e.time))}</div></div></div>`; }).join("") : `<div class="card-content muted">Nothing logged yet.</div>`}`;
  };

  const tabAsset = (d) => {
    const a = d.asset || {};

    return `
      <div class="sub-h">Asset details</div>
      <form class="form" id="assetForm" onsubmit="return false">${f("location", "Location", "text", "wide")}${f("purchase_date", "Purchased", "date")}${f("warranty_until", "Warranty until", "date")}${f("shop", "Bought from")}${f("price", "Price")}${f("serial", "Serial number", "text", "wide")}</form>
      <div class="row-actions"><button class="btn" data-act="save-asset">Save</button><span class="saved" id="savedAsset">Saved</span></div>
      <div class="sub-h">Notes</div>
      <div class="form"><label class="wide"><textarea class="field" id="note" placeholder="What is this device, where is it, why was it removed?">${esc(d.note || "")}</textarea></label></div>
      <div class="row-actions"><button class="btn" data-act="save-note">Save note</button><span class="saved" id="savedNote">Saved</span><span class="spacer"></span><button class="btn danger" data-act="forget">${ic("delete", "s18")}Forget device</button></div>
      <div class="card-content muted" style="font-size:12px">Sources: ${esc((d.sources || []).join(" · ") || "—")}</div>`;
  };

  const moreHtml = (d) => {
    const isBat = !!d.battery_record || typeof d.battery === "number";
    const tabs = [["info", "Info"], ["health", "Health"], ["history", "History"], ...(isBat ? [["battery", "Battery"]] : []), ["asset", "Notes"]];
    if (!tabs.find((t) => t[0] === state.moreTab)) state.moreTab = "info";
    const fn = { info: tabInfo, health: tabHealth, history: tabHistory, battery: tabBattery, asset: tabAsset }[state.moreTab];
    const name = nameOf(d);
    return `
      <div class="more-head"><button class="icon-btn" data-act="close" aria-label="Close">${ic("close")}</button>
        <div class="titles"><h2 id="moreTitle" class="${name ? "" : "unknown"}">${esc(name || "Unnamed device")}</h2><small>${esc([d.area, `${netLabel(d.instance)} network`].filter(Boolean).join(" · "))}</small></div>
        <button class="icon-btn" data-act="copy" data-ieee="${esc(d.ieee)}" aria-label="Copy IEEE address" title="Copy ${esc(d.ieee)}">${ic("content-copy")}</button></div>
      <nav class="more-tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.moreTab === k}">${l}</button>`).join("")}</nav>

  };
  const renderMore = (fresh = false, fromList = false) => {
    const dlg = $("#more");
    const d = state.byIeee.get(state.open);
    if (usePane()) {
      if (dlg.open) { state.keepOpen = true; dlg.close(); state.keepOpen = false; }
      const pane = $("#pane");
      if (!pane) return;
      if (!d) { pane.innerHTML = `<div class="pane-empty">${ic("zigbee")}<b>Select a device</b>Its details, health, history, battery and notes appear here.<div class="muted" style="margin-top:12px;font-size:13px">Use ↑ and ↓ to move through the list.</div></div>`; return; }
      if (!fresh && state.editing && pane.contains(document.activeElement)) return;
      const keep = !fromList && pane.querySelector(".more-body") ? pane.querySelector(".more-body").scrollTop : state.paneScroll || 0;
      pane.innerHTML = moreHtml(d);
      pane.querySelector(".more-body").scrollTop = fresh && !fromList ? 0 : keep;
      state.editing = false;
      return;
    }
    if (!d) { if (dlg.open) dlg.close(); return; }
    if (!fresh && state.editing && dlg.contains(document.activeElement)) return;
    const body = dlg.querySelector(".more-body");
    const keep = !fresh && body ? body.scrollTop : 0;
    dlg.innerHTML = moreHtml(d);
    dlg.querySelector(".more-body").scrollTop = keep;
    state.editing = false;
    if (!dlg.open) dlg.showModal();
  };
  const markSelected = () => document.querySelectorAll(".dt tbody tr[data-open]").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.open === state.open)));
  const openDevice = (ieee, tab) => {
    if (state.open !== ieee) { state.moreTab = tab || state.moreTab || "info"; state.paneScroll = 0; }
    state.open = ieee;
    history.replaceState(null, "", `#${encodeURIComponent(ieee)}`);
    if (usePane() && state.view !== "devices") { state.view = "devices"; state.settingsShown = false; render(); window.scrollTo(0, 0); }
    renderMore(true);
    markSelected();
    if (usePane()) document.querySelector(`.dt tr[data-open="${CSS.escape(ieee)}"]`)?.scrollIntoView({ block: "nearest" });
  };
  const closeDevice = () => { state.open = null; history.replaceState(null, "", location.pathname + location.search); const dlg = $("#more"); if (dlg.open) dlg.close(); if (usePane()) { renderMore(true); markSelected(); } };
  const moveSelection = (delta) => {
    const rows = [...document.querySelectorAll(".dt tbody tr[data-open]")];
    if (!rows.length) return;
    let i = rows.findIndex((r) => r.dataset.open === state.open);
    i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + delta));

  };
  $("#more").addEventListener("close", () => { if (state.open && !state.keepOpen) { state.open = null; history.replaceState(null, "", location.pathname + location.search); } });
  $("#more").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeDevice(); });
  $("#more").addEventListener("input", () => { state.editing = true; });
  $("#view").addEventListener("input", (e) => { if (e.target.closest("#pane")) state.editing = true; });
  $("#view").addEventListener("scroll", (e) => { if (e.target.classList?.contains("more-body")) state.paneScroll = e.target.scrollTop; }, true);

  // ------------------------------------------------------------ confirm dialog
  const confirmDialog = ({ title, html, ok, danger = false }) => new Promise((resolve) => {
    const dlg = $("#confirmDlg");
    if (dlg.open) { resolve(false); return; }
    $("#cTitle").textContent = title; $("#cText").innerHTML = html; $("#cOk").textContent = ok;
    $("#cOk").className = danger ? "btn danger" : "btn";
    dlg.returnValue = "cancel";
    const done = () => { dlg.removeEventListener("close", done); resolve(dlg.returnValue === "ok"); };
    dlg.addEventListener("close", done);
    dlg.showModal();
    (danger ? dlg.querySelector('button[value="cancel"]') : $("#cOk")).focus();
  });
  $("#confirmDlg").addEventListener("click", (e) => { if (e.target.id === "confirmDlg") e.target.close("cancel"); });

  // ------------------------------------------------------------ render
  const render = () => {
    if (!state.data) return;
    const issues = state.data.issues || [];
    const warn = issues.filter((i) => i.severity === "warning").length;

    else if (state.view === "activity") renderActivity();
    else if (state.view === "map") renderMap();
    else if (state.view === "updates") renderUpdates();
    if (state.view !== "map" && MAP.rendered) { Object.values(MAP.sims).forEach((x) => x.stop()); MAP.sims = {}; MAP.rendered = null; }
    if (state.view === "settings" && !state.settingsShown) { state.settingsShown = true; renderSettings(); }
    if (state.view !== "settings") state.settingsShown = false;
    if (state.open && !(usePane() && state.view === "devices")) renderMore();

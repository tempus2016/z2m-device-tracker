      </div>`;
  };
  const saveSettings = async (changes) => {
    try {
      const res = await api("api/settings", { changes });
      state.settings = res;
      renderSettings(false);
      snack(res.persisted ? t("common.saved") : t("settings.not_persisted"), res.persisted ? 1600 : 5000);
      load();
    } catch (err) { snack(t("settings.save_failed", { error: err.message }), 4000); renderSettings(false); }
  };

  // ------------------------------------------------------------ chart hover
  // A chart opts in with hoverAttrs(key, data) on its plot element (the <svg>, or the div holding the bars).
  // data.p holds one entry per point: [x %, y % or null, heading, ...value lines]. For bar charts
  // (data.bars) entry i belongs to the i-th <i> bar and x comes from the bar itself. data.m holds
  // markers ([x %, text]) that add a line when the pointer is within a few pixels of them.
  // One delegated listener serves every chart. Live re-renders replace the chart's DOM, so a
  // MutationObserver moves the guide and box onto the new chart with the same key.
  const hoverAttrs = (key, data) => `data-chart="${esc(key)}" data-points="${esc(JSON.stringify(data))}"`;
  const fmtHover = (ts, hourly) => intl((l) => new Date(ts * 1000).toLocaleString(l, hourly ? { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" } : { day: "numeric", month: "short" }));
  const pctX = (x, W) => +((x / W) * 100).toFixed(2);
  const HOVER = { plot: null, key: null, cx: 0, els: null, bar: null };
  const hoverEls = () => {
    if (!HOVER.els) {
      const mk = (cls) => Object.assign(document.createElement("div"), { className: cls });
      HOVER.els = { guide: mk("hov-guide"), dot: mk("hov-dot"), tip: mk("hov-tip") };
      HOVER.els.tip.setAttribute("aria-hidden", "true");
    }
    return HOVER.els;
  };
  const hoverHide = () => {
    if (HOVER.els) Object.values(HOVER.els).forEach((el) => el.remove());
    HOVER.bar?.classList.remove("hov-on");
    HOVER.plot = HOVER.key = HOVER.bar = null;
  };
  const hoverShow = (plot, cx) => {
    let data;
    try { data = JSON.parse(plot.dataset.points); } catch (e) { return hoverHide(); }
    const pts = data.p || [];
    if (!pts.length) return hoverHide();
    const host = plot instanceof SVGElement ? plot.parentElement : plot;
    const hr = host.getBoundingClientRect(), pr = plot.getBoundingClientRect();
    if (!pr.width) return hoverHide();
    let i = 0, gx, gy = null, bar = null, best = Infinity;
    if (data.bars) {
      const kids = [...plot.querySelectorAll(":scope > i")];
      kids.forEach((k, j) => { const r = k.getBoundingClientRect(), dist = Math.abs(r.left + r.width / 2 - cx); if (dist < best) { best = dist; i = j; } });
      bar = kids[i];
      if (!bar || !pts[i]) return hoverHide();
      const r = bar.getBoundingClientRect();
      gx = r.left + r.width / 2 - hr.left;
    } else {
      pts.forEach((p, j) => { const dist = Math.abs(pr.left + (p[0] / 100) * pr.width - cx); if (dist < best) { best = dist; i = j; } });
      gx = pr.left - hr.left + (pts[i][0] / 100) * pr.width;
      if (pts[i][1] !== null) gy = pr.top - hr.top + (pts[i][1] / 100) * pr.height;
    }
    const [, , head, ...lines] = pts[i];
    // A marker joins the box when the pointer is on it, or nearer to it than to the snapped point.
    (data.m || []).forEach(([mx, text]) => { const dist = Math.abs(pr.left + (mx / 100) * pr.width - cx); if (dist <= 12 || dist < best) lines.push(text); });
    const { guide, dot, tip } = hoverEls();
    if (HOVER.bar !== bar) { HOVER.bar?.classList.remove("hov-on"); bar?.classList.add("hov-on"); }
    HOVER.plot = plot; HOVER.key = plot.dataset.chart || null; HOVER.cx = cx; HOVER.bar = bar;
    const top = pr.top - hr.top;
    Object.assign(guide.style, { left: `${gx.toFixed(1)}px`, top: `${top.toFixed(1)}px`, height: `${pr.height.toFixed(1)}px` });
    if (guide.parentElement !== host) host.append(guide);
    if (gy === null) dot.remove();
    else {
      Object.assign(dot.style, { left: `${gx.toFixed(1)}px`, top: `${gy.toFixed(1)}px` });
      dot.style.setProperty("--hov-c", data.c || "var(--primary)");
      if (dot.parentElement !== host) host.append(dot);
    }
    tip.innerHTML = `<b>${esc(head)}</b>${lines.map((l) => `<div>${esc(l)}</div>`).join("")}`;
    if (tip.parentElement !== host) host.append(tip);
    // Beside the guide, flipped to the left when it would run past the right edge.
    const w = tip.offsetWidth;
    let left = gx + 10;
    if (left + w > hr.width) left = gx - 10 - w;
    tip.style.left = `${Math.max(0, left).toFixed(1)}px`;
    tip.style.top = `${Math.max(0, top).toFixed(1)}px`;
  };
  const hoverMove = (e) => {
    const plot = e.target.closest?.("[data-points]");
    if (plot) hoverShow(plot, e.clientX);
    else if (HOVER.plot) hoverHide();
  };
  document.addEventListener("pointermove", hoverMove, { passive: true });
  document.addEventListener("pointerdown", hoverMove, { passive: true });
  document.addEventListener("pointerout", (e) => { if (!e.relatedTarget && HOVER.plot && e.pointerType === "mouse") hoverHide(); });
  window.addEventListener("blur", hoverHide);
  new MutationObserver(() => {
    if (!HOVER.plot || HOVER.plot.isConnected) return;
    const next = HOVER.key && document.querySelector(`[data-chart="${CSS.escape(HOVER.key)}"]`);
    if (next) hoverShow(next, HOVER.cx); else hoverHide();
  }).observe(document.body, { childList: true, subtree: true });

  // ------------------------------------------------------------ more-info dialog
  // hover: { key, value: (v) => text, hourly } adds hover values to the chart.
  const sparkline = (points, { min = null, max = null, color = "var(--primary)", hover = null } = {}) => {
    if (!points || points.length < 2) return `<div class="card-content muted">${th("more.no_chart")}</div>`;
    const W = 500, H = 120, pad = 6;
    const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = min ?? Math.min(...ys), hi = max ?? Math.max(...ys);
    const sx = (x) => (x1 === x0 ? W / 2 : ((x - x0) / (x1 - x0)) * W);
    const sy = (y) => (hi === lo ? H / 2 : H - pad - ((y - lo) / (hi - lo)) * (H - pad * 2));
    const line = points.map((p) => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");
    const hov = hover ? hoverAttrs(hover.key, { c: color, p: points.map(([x, y]) => [pctX(sx(x), W), pctX(sy(y), H), fmtHover(x, hover.hourly), hover.value(y)]) }) : "";
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" ${hov}>
      <line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--divider)" vector-effect="non-scaling-stroke"/>
      <polygon points="0,${H} ${line} ${W},${H}" fill="${color}" fill-opacity="0.12"/>
      <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>
      <div class="chart-axis"><span>${esc(fmtDate(x0, false))}</span><span>${esc(fmtDate(x1, false))}</span></div>`;
  };
  const kv = (rows) => `<div class="kv">${rows.filter(([, v]) => v !== null && v !== undefined && v !== "").map(([k, v, mono]) => `<div><span>${k}</span><b ${mono ? 'class="mono"' : ""}>${esc(v)}</b></div>`).join("")}</div>`;
  const devLink = (ieee) => { const d = state.byIeee.get(ieee); return d ? `<a href="#${esc(ieee)}" data-open="${esc(ieee)}">${esc(nameOf(d) || ieee)}</a>` : esc(ieee); };

  // ------------------------------------------------------------ ping (mains devices)
  const PING = new Map();
  const pingResult = (d) => {
    const p = PING.get(d.ieee);
    if (!p) return "";
    const [cls, text] = p.busy ? ["", t("ping.running")] : p.ms !== undefined ? ["ok", t("ping.replied", { ms: p.ms })] : p.timeout ? ["bad", t("ping.no_reply", { s: p.seconds || 10 })] : ["bad", p.error];
    return `<div class="ping-result"><span class="ping-pill ${cls}" role="status"${p.detail ? ` title="${esc(p.detail)}"` : ""}>${esc(text)}</span></div>`;
  };
  const pingMedian = (xs) => { const o = [...xs].sort((a, b) => a - b), m = o.length >> 1; return o.length % 2 ? o[m] : (o[m - 1] + o[m]) / 2; };
  const pingChart = (d) => {
    const pts = d.metrics?.ping_daily || [];
    if (!pts.length) return d.can_ping && d.type === "Router" ? `<div class="sub-h">${th("ping.chart_title")}</div><div class="card-content muted">${th("ping.chart_empty")}</div>` : "";
    const byDay = new Map(pts.map((p) => [p[0], p[1]]));
    const last = pts[pts.length - 1][0], days = Array.from({ length: 14 }, (_, i) => last - (13 - i) * 86400);
    const vals = pts.map((p) => p[1]).filter((v) => v !== null);
    const hi = Math.max(200, ...vals), base = vals.length ? pingMedian(vals.slice(0, Math.max(1, Math.ceil(vals.length / 2)))) : 0;
    const hov = days.map((day) => { const v = byDay.get(day); return [null, null, fmtHover(day, false), v === undefined ? t("chart.no_data") : v === null ? t("chart.no_reply") : t("chart.reply", { value: v })]; });
    const bars = days.map((day, i) => {
      if (!byDay.has(day)) return `<i class="gap" role="img" aria-label="${esc(`${hov[i][2]}: ${hov[i][3]}`)}"></i>`;
      const v = byDay.get(day);
      if (v === null) return `<i class="none" role="img" aria-label="${esc(`${hov[i][2]}: ${hov[i][3]}`)}"></i>`;
      const cls = v > 3 * base && v > 150 ? "bad" : v > 2 * base ? "lo" : "";
      return `<i class="${cls}" style="height:${Math.max(2, (v / hi) * 100).toFixed(1)}%" role="img" aria-label="${esc(`${hov[i][2]}: ${hov[i][3]}`)}"></i>`;
    }).join("");
    const lab = (day) => { const v = byDay.get(day); return v === undefined ? "" : v === null ? t("ping.bar_none") : `${v} ms`; };
    const first = days.find((day) => byDay.has(day));
    const slow = (d.issues || []).find((i) => i.kind === "slow_router");
    return `<div class="sub-h">${th("ping.chart_title")}</div><div class="ping-bars" role="group" aria-label="${esc(t("ping.chart_title"))}" ${hoverAttrs("ping", { bars: true, p: hov })}>${bars}</div>
      <div class="chart-axis"><span>${esc(`${fmtTick(first, 14 * 86400)} · ${lab(first)}`)}</span><span>${esc(`${fmtTick(last, 14 * 86400)} · ${lab(last)}`)}</span></div>
      ${slow ? `<div class="alerts"><div class="alert" style="--a:${slow.severity === "warning" ? "var(--warning)" : "var(--info)"}">${ic("router-wireless")}<div class="body">${esc(issueDetail(slow))}</div></div></div>` : ""}`;
  };

  const tabInfo = (d) => {
    const st = statusOf(d);
    const u = d.update || {};
    const r = d.routing;
    const lqi = lqiOf(d), power = powerOf(d);
    const bigState = st !== "active" ? STATUS[st].label : warnings(d)[0] ? issueLabel(warnings(d)[0]) : STATUS.active.label;
    const o = state.data.options || {};
    return `
      <div class="more-hero">${stateIc(d)}<div class="big">${esc(bigState)}</div><div class="sub">${th("more.last_seen", { when: esc(relTime(d.last_seen, true)) })}</div></div>
      <div class="more-actions">
        ${d.status !== "removed" ? `<button class="btn outlined" data-act="reconfigure" data-ieee="${esc(d.ieee)}">${ic("refresh", "s18")}${th("common.reconfigure")}</button><button class="btn outlined" data-act="rename">${ic("pencil", "s18")}${th("more.rename")}</button>` : ""}
        ${d.can_ping ? `<button class="btn outlined" data-act="ping" data-ieee="${esc(d.ieee)}" ${PING.get(d.ieee)?.busy ? "disabled" : ""}>${ic("refresh", "s18")}${th("ping.button")}</button>` : ""}
        ${canReplace(d) ? `<button class="btn outlined" data-act="replace" data-ieee="${esc(d.ieee)}">${ic("swap-horizontal", "s18")}${th("replace.button")}</button>` : ""}
        ${d.status !== "removed" && d.type === "EndDevice" ? `<button class="btn outlined" data-act="move" data-ieee="${esc(d.ieee)}">${ic("swap-horizontal", "s18")}${th("more.change_router")}</button>` : ""}
        ${d.model && d.supported !== false ? `<a class="btn outlined" href="https://www.zigbee2mqtt.io/devices/${encodeURIComponent(String(d.model).replace(/\//g, "_"))}.html" target="_blank" rel="noopener">${ic("information-outline", "s18")}${th("more.docs")}</a>` : ""}
        ${d.ha_device_id ? `<a class="btn outlined" href="/config/devices/device/${esc(d.ha_device_id)}" target="_top">${ic("home-assistant", "s18")}${th("more.device_page")}</a>` : ""}
        ${state.data.panels?.[d.instance] && d.status !== "removed" ? `<a class="btn outlined" href="${esc(state.data.panels[d.instance])}" target="_top">${ic("zigbee", "s18")}Zigbee2MQTT</a>` : ""}
      </div>
      ${d.status !== "removed" ? `<div class="set-row"><div class="text"><div class="t1">${th("more.critical")}</div><div class="t2">${th("more.critical_desc", { minutes: esc(o.critical_offline_minutes ?? 5), normal: esc(o.offline_alert_minutes ?? 60) })}</div></div>
        <label class="switch"><input type="checkbox" id="critSw" data-ieee="${esc(d.ieee)}" ${d.critical ? "checked" : ""} aria-label="${esc(t("more.critical"))}"><span class="track"></span><span class="thumb"></span></label></div>` : ""}
      ${pingResult(d)}
      ${u.state === "updating" ? `<div class="alerts"><div class="alert" style="--a:var(--info)">${ic("chip")}<div class="body"><b>${th("more.updating")}${u.progress !== undefined && u.progress !== null ? ` · ${Math.round(u.progress)} %` : ""}</b>${u.remaining ? ` · ${th("more.time_left", { duration: esc(span(u.remaining)) })}` : ""}. ${th("more.keep_powered")}<div class="bar"><i style="width:${Math.max(2, Math.min(100, u.progress || 0))}%"></i></div></div></div></div>` : ""}
      ${u.state === "available" && d.status !== "removed" ? `<div class="alerts"><div class="alert" style="--a:var(--info)">${ic("chip")}<div class="body"><b>${th("issue.update.title")}</b> · ${esc(u.installed_version)} → ${esc(u.latest_version)}</div><button class="btn" data-act="ota-update">${th("common.update")}</button></div></div>` : ""}
      <div class="alerts">${(d.issues || []).map((i) => `<div class="alert" style="--a:${i.severity === "warning" ? "var(--warning)" : "var(--info)"}">${ic(KIND_ICON[i.kind] || "alert")}<div class="body"><b>${esc(issueTitle(i))}.</b> ${esc(issueDetail(i))}</div><div class="alert-acts">${issueActions(i)}</div></div>`).join("")}
        ${st === "removed" ? `<div class="alert" style="--a:var(--text-2)">${ic("information-outline")}<div class="body"><b>${th("more.removed")}</b> ${d.removed_at ? th("more.removed_on", { date: esc(fmtDate(d.removed_at)) }) : th("more.removed_no_date")}.${d.successor ? ` ${th("more.replaced_by", { device: devLink(d.successor) })}.` : ""}</div></div>` : ""}</div>
      ${kv([[th("devices.col.model"), deviceLine(d) || t("common.unknown")], [th("more.description"), d.description], [th("devices.col.area"), d.area], [th("more.network"), netLabel(d.instance)], [th("more.signal_24h"), lqi === null ? null : Math.round(lqi)],
        [th("devices.col.battery"), typeof d.battery === "number" ? `${Math.round(d.battery)} %` : power], [th("more.first_seen"), fmtDate(d.first_seen) || t("common.unknown")], [th("devices.col.last_seen"), fmtDate(d.last_seen) || t("time.never")],
        [th("more.availability"), d.availability ? t("more.availability_since", { state: tx(`more.availability.${d.availability}`, null, cap(d.availability)), date: fmtDate(d.availability_since) }) : null], [th("more.ieee"), d.ieee, true], [th("more.model_id"), d.model_id, true], [th("more.manufacturer"), d.manufacturer, true],
        [th("more.radio_maker"), d.oui_vendor], [th("more.type"), typeLabel(d.type)], [th("more.power_source"), d.power_source], [th("more.firmware"), [d.software_build_id, d.date_code].filter(Boolean).join(" · ")],
        [th("more.ota"), u.installed_version !== undefined && u.installed_version !== -1 ? (u.state === "available" ? t("more.ota_available", { installed: u.installed_version, latest: u.latest_version }) : t("more.ota_latest", { installed: u.installed_version })) : null],
        [th("more.interview"), d.interview_state ? tx(`more.interview.${d.interview_state.toLowerCase()}`, null, cap(d.interview_state.toLowerCase().replace(/_/g, " "))) : null], [th("more.ha_name"), d.ha_name]])}
      ${d.status !== "removed" && u.installed_version !== undefined && u.installed_version !== -1 && u.state !== "updating" ? `<div class="row-actions"><button class="btn" data-act="ota-check">${ic("refresh", "s18")}${th("more.ota_check")}</button></div>` : ""}
      <div class="sub-h">${th("more.routing")}</div>
      ${r ? kv([[d.type === "EndDevice" ? th("map.connects_through") : th("more.children"), d.type === "EndDevice" ? (r.parent ? nameOf(state.byIeee.get(r.parent.ieee)) || r.parent.ieee : t("more.not_in_scan")) : r.children], [th("more.depth"), r.depth], [th("more.scanned"), fmtDate(r.scanned_at)]]) +
        (r.neighbours?.length ? `<div class="rep-list">${r.neighbours.slice(0, 6).map((n) => `<div><span>${devLink(n.ieee)}</span><span class="muted">LQI ${esc(n.lqi ?? "?")}</span></div>`).join("")}</div>` : "")
        : `<div class="card-content muted">${th("more.not_scanned")}</div>`}
      ${tabTraffic(d)}
      ${d.features?.length ? `<div class="sub-h">${th("more.capabilities")}</div><div class="caps">${d.features.map((f) => `<span>${esc(f)}</span>`).join("")}</div>` : ""}`;
  };

  const tabTraffic = (d) => {
    if (d.status === "removed" || d.type === "Coordinator") return "";
    const m = d.metrics || {}, z = d.z2m_stats || {};
    const rate = m.msg_rate_6h;
    const counting = rate === undefined && m.msg_24h === undefined ? `<div class="card-content muted">${th("traffic.counting")}</div>` : "";
    const traffic = counting + kv([[th("traffic.last_6h"), rate !== undefined ? t("traffic.per_hour", { n: Math.round(rate) }) + (rate ? ` ${t("traffic.one_every", { s: rate >= 3600 ? "<1" : Math.round(3600 / rate) })}` : "") : null],
      [th("traffic.usual"), m.msg_rate_prev !== undefined ? t("traffic.per_hour", { n: Math.round(m.msg_rate_prev) }) : null], [th("traffic.last_24h"), m.msg_24h],
      [th("traffic.since_start"), z.messages !== undefined && z.messages !== null ? t("traffic.since_start_value", { n: z.messages, left: z.leave_count ?? 0, changed: z.nwk_changes ?? 0 }) : null]]);
    const lost = d.lost_bindings || [];
    const bindings = d.bindings;
    const label = (b) => { const tgt = b.target || ""; if (tgt.startsWith("group:")) { const g = tgt.slice(6); return th("bindings.group", { name: esc(state.data.groups?.[d.instance]?.[g] || g) }); } const [ieee, ep] = tgt.split("/"); const o = state.byIeee.get(ieee); return o?.type === "Coordinator" ? th("map.coordinator") : `${devLink(ieee)}${ep && ep !== "1" && ep !== "None" ? ` (${th("bindings.endpoint", { ep: esc(ep) })})` : ""}`; };
    const list = bindings === null || bindings === undefined ? `<div class="card-content muted">${th("bindings.not_reported")}</div>`
      : !bindings.length && !lost.length ? `<div class="card-content muted">${th("bindings.none")}</div>`
      : `<div class="rep-list">${bindings.map((b) => `<div><span>${esc(b.cluster)} → ${label(b)}</span><span class="muted">${th("bindings.endpoint", { ep: esc(b.ep) })}</span></div>`).join("")}${lost.map((b) => `<div><span style="color:var(--error)">${esc(b.cluster)} → ${label(b)}</span><span class="lost-act"><span class="muted">${th("bindings.lost", { when: esc(relTime(b.lost_at, true)) })}</span>${d.status === "active" ? `<button class="btn" data-act="restore-bindings" data-ieee="${esc(d.ieee)}" data-key="${esc(b.key)}">${ic("refresh", "s18")}${th("common.restore")}</button>` : ""}</span></div>`).join("")}</div>`;
    const restoreAll = lost.length > 1 && d.status === "active" ? `<div class="lost-all">${restoreBindingsBtn(d.ieee, lost)}</div>` : "";
    return `<div class="sub-h">${th("traffic.title")}</div>${traffic}<div class="sub-h">${th("bindings.title")}</div>${list}${restoreAll}`;
  };

  const limitsHtml = (d, hasReadings) => {
    const o = state.data.options || {}, lim = d.limits || {};
    const row = (id, key, label, min, max, unit, global) => `<div class="set-row"><div class="text"><div class="t1">${th(label)}</div><div class="t2">${th("dhealth.limit_settings", { value: esc(key === "frozen_hours" && global === 0 ? t("settings.check.off") : `${global ?? "—"} ${unit}`) })}</div></div><div class="ctl"><input class="field num" type="number" id="${id}" data-limit="${key}" min="${min}" max="${max}" step="1" value="${esc(lim[key] ?? "")}" placeholder="${esc(global ?? "")}" aria-label="${esc(t(label))}"><span class="unit" style="min-width:16px">${unit}</span></div></div>`;
    const rows = [
      d.battery_record ? row("limBat", "battery_percent", "dhealth.limit_battery", 0, 100, "%", o.battery_alert_percent) : "",
      hasReadings ? row("limFrozen", "frozen_hours", "dhealth.limit_frozen", 1, 720, t("settings.unit_h"), o.frozen_alert_hours) : "",
    ].join("");
    if (!rows) return "";
    return `<div class="sub-h">${th("dhealth.limits")}</div>${rows}
      <div class="card-actions"><span class="saved" id="savedLimits" style="align-self:center">${th("common.saved")}</span><button class="btn" data-act="limits-reset" ${Object.keys(lim).length ? "" : "disabled"}>${th("dhealth.use_settings")}</button><button class="btn filled" data-act="save-limits">${th("common.save")}</button></div>`;
  };

  const tabHealth = (d) => {
    const m = d.metrics || {};
    const outages = [...(d.outages || [])].reverse().slice(0, 8);
    const readings = Object.entries(d.readings || {});
    return `${offlineTiming(d)}
      <div class="sub-h">${th("dhealth.signal")}</div>
      ${kv([[th("dhealth.now"), d.lqi ?? "—"], [th("dhealth.avg_24h"), m.lqi_24h ?? "—"], [th("dhealth.prev_week"), m.lqi_prev_7d ?? "—"]])}
      ${sparkline(m.lqi_spark, { min: 0, max: 255, hover: { key: "spark-lqi", hourly: true, value: (v) => t("chart.lqi", { value: Math.round(v) }) } })}
      <div class="sub-h">${th("more.availability")}${d.uptime_30d !== null && d.uptime_30d !== undefined ? ` · ${th("dhealth.uptime", { percent: d.uptime_30d })}` : ""}</div>
      ${outages.length ? `<div class="rep-list">${outages.map((o) => { const s = (new Date(o.end || Date.now()) - new Date(o.start)) / 1000; return `<div><span>${esc(fmtDate(o.start))}</span><span class="muted">${o.end ? esc(span(s)) : th("dhealth.ongoing", { duration: esc(span(s)) })}</span></div>`; }).join("")}</div>` : `<div class="card-content muted">${th(d.availability ? "dhealth.no_outages" : "dhealth.no_outages_no_avail")}</div>`}
      ${reportEvery(d)}
      <div class="sub-h">${th("dhealth.readings")}</div>
      ${readings.length ? `<div class="rep-list">${readings.map(([k, r]) => `<div><span>${esc(readingName(k))}: ${esc(r.value)}</span><span class="muted">${th("dhealth.changed", { when: esc(relTime(r.changed_at, true)), n: esc(r.reports) })}</span></div>`).join("")}</div>` : `<div class="card-content muted">${th("dhealth.no_readings")}</div>`}
      ${limitsHtml(d, readings.length > 0)}
      ${(d.muted || []).length ? `<div class="sub-h">${th("settings.ignored")}</div><div class="rep-list">${d.muted.map((k) => `<div><span>${esc(tx(`check.${k}.label`, null, cap(k.replace(/_/g, " "))))}</span><button class="btn" data-act="unmute" data-ieee="${esc(d.ieee)}" data-kind="${esc(k)}">${th("common.stop_ignoring")}</button></div>`).join("")}</div>` : ""}`;
  };

  // "When this device alerts": the server works out the steps (health.offline_timing), this only draws them.
  const offlineTiming = (d) => {
    const ot = d.offline_timing;
    if (!ot) return "";
    const muted = (key) => `<span class="muted">(${key})</span>`;
    // Exact, not rounded like span(): 70 min must not read as "1 h".
    const span = (s) => {
      if (s % 60 || s < 60) return t("unit.seconds", { n: s });
      if (s % 3600) return s < 86400 ? t("unit.minutes", { n: s / 60 }) : `${t("unit.hours", { n: Math.floor(s / 3600) })} ${t("unit.minutes", { n: (s % 3600) / 60 })}`;
      return s % 86400 || s < 172800 ? t("unit.hours", { n: s / 3600 }) : t("unit.days", { n: s / 86400 });
    };
    const alert = (kind) => th("timing.alert", { name: `<strong>${esc(tx(`check.${kind}.label`, null, cap(kind)))}</strong>` });
    const src = ot.source === "default" ? th(`timing.src.default_${ot.mode}`) : th(`timing.src.${ot.source}`);
    const label = (s) => {
      if (s.kind === "last") return th("timing.last");
      if (s.kind === "z2m") return `${th("timing.z2m")} ${muted(src)}`;
      const note = s.kind === "late" ? th("timing.late_note", { every: esc(span(s.at)) })
        : s.kind === "offline" ? th("timing.offline_note", { z2m: esc(span(ot.z2m)), delay: esc(span(ot.delay)) })
        : th(`timing.not_tracked_${ot.why}`);
      return `${alert(s.kind)} ${muted(s.off ? `${note} · ${th("timing.off")}` : note)}`;
    };
    const color = (s) => (s.kind === "last" || s.kind === "z2m" ? "var(--text-2)" : s.kind === "late" ? "var(--info)" : "var(--error)");
    const steps = `<div class="steps">${ot.steps.map((s) => `<div class="st2${s.off ? " off" : ""}" style="--c:${color(s)}"><b>${esc(s.at ? span(s.at) : t("unit.minutes", { n: 0 }))}</b><span>${label(s)}</span></div>`).join("")}</div>`;
    const row = (k, v, sum) => `<div${sum ? ' class="sum"' : ""}><span>${k}</span><b>${v}</b></div>`;
    const late = ot.steps.find((s) => s.kind === "late");
    const rows = ot.tracked
      ? [row(th("timing.z2m_timeout"), `${esc(span(ot.z2m))} ${muted(src)}`), row(th("timing.delay"), `+ ${esc(span(ot.delay))} ${muted(th("timing.delay_src"))}`),
        row(th("timing.alert", { name: th("check.offline.label") }), th("timing.about_after", { time: esc(span(ot.total)) }), true)]
      : [row(th("timing.z2m_timeout"), th("timing.not_tracked")), row(th("timing.alert", { name: th("check.silent.label") }), th("timing.after", { time: esc(span(ot.steps.find((s) => s.kind === "silent").at)) }), true)];
    if (late) rows.push(row(th("timing.alert", { name: th("check.late.label") }), th("timing.after", { time: esc(span(late.at)) }), true));
    return `<div class="sub-h">${th("timing.title")}</div>${steps}<div class="kv">${rows.join("")}</div><p class="tnote">${th(ot.tracked ? "timing.hint" : "timing.hint_off")}</p>`;
  };

  // Per-device "should report at least every" interval; stored in seconds, edited as a number + unit.
  const REPORT_UNITS = [["s", 1], ["min", 60], ["h", 3600]];
  const reportEvery = (d) => {
    if (d.status === "removed" || d.type === "Coordinator") return "";
    const every = d.report_every || 0;
    const [unitKey, size] = every ? [...REPORT_UNITS].reverse().find(([, n]) => every % n === 0) : ["min", 60];
    const rate = d.metrics?.msg_rate_prev || d.metrics?.msg_rate_6h;
    const hint = rate ? th("report.usual", { gap: esc(span(3600 / rate)) }) : th("report.desc");
    return `<div class="sub-h">${th("report.title")}</div>
      <div class="set-row"><div class="text"><div class="t1">${every ? th("report.on", { every: esc(span(every)) }) : th("report.off")}</div><div class="t2">${hint}</div></div><div class="ctl">
        <input class="field" id="repN" type="number" min="1" step="1" style="width:80px" value="${every ? every / size : ""}" placeholder="—" inputmode="numeric" aria-label="${esc(t("report.title"))}">
        <select class="field" id="repU">${REPORT_UNITS.map(([k]) => `<option value="${k}" ${k === unitKey ? "selected" : ""}>${th(`report.unit_${k}`)}</option>`).join("")}</select>
        <button class="btn" data-act="save-report-every">${th("common.save")}</button>${every ? `<button class="btn" data-act="clear-report-every">${th("report.turn_off")}</button>` : ""}</div></div>`;
  };

  const tabBattery = (d) => {
    const m = d.metrics || {}, rec = d.battery_record || { type: "", quantity: null, installed: "", replacements: [] };
    const est = m.battery_estimate_days;
    const reps = (rec.replacements || []).map((r, i) => [r, i]).reverse();
    return `
      <div class="more-hero"><span class="state-ic" style="color:${batColor(d.battery, batLow(d))}">${ic("battery")}</span><div class="big">${typeof d.battery === "number" ? `${Math.round(d.battery)} %` : "—"}</div>
        <div class="sub">${est === null || est === undefined ? th("battery.no_estimate") : est <= 0 ? th("battery.due_now") : th("battery.days_left", { n: Math.round(est) })}</div></div>
      <div class="more-actions"><button class="btn filled" data-act="battery-replaced">${ic("battery-sync", "s18")}${th("battery.replaced")}</button></div>
      ${sparkline(m.battery_spark, { min: 0, max: 100, color: batColor(d.battery, batLow(d)), hover: { key: "spark-bat", value: (v) => t("chart.battery", { value: Math.round(v) }) } })}
      <div class="sub-h">${th("battery.details")}${rec.source === "battery_notes" ? ` · ${th("battery.from_bn")}` : rec.source === "library" ? ` · ${th("battery.from_library")}` : ""}</div>
      <form class="form" id="batForm" onsubmit="return false">
        <label>${th("battery.type")}<input class="field" name="type" list="batTypes" value="${esc(rec.type || "")}" placeholder="CR2032, AAA…" autocomplete="off"></label>
        <label>${th("battery.quantity")}<input class="field" name="quantity" type="number" min="1" max="20" value="${esc(rec.quantity ?? "")}" placeholder="1"></label>
        <label class="wide">${th("battery.installed")}<input class="field" name="installed" type="date" value="${esc(rec.installed || "")}"></label>
      </form>
      <datalist id="batTypes">${["CR2032", "CR2450", "CR2477", "CR1632", "CR123A", "AAA", "AA", "18650", t("battery.rechargeable")].map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist>
      <div class="row-actions"><button class="btn" data-act="save-battery">${th("common.save")}</button><span class="saved" id="savedBat">${th("common.saved")}</span></div>
      <div class="sub-h">${th("battery.history")}</div>
      ${reps.length ? `<div class="rep-list">${reps.map(([r, i]) => `<div><span>${esc(fmtDate(r.date, false))} <span class="muted">· ${esc(r.source)}${r.note ? ` · ${esc(r.note)}` : ""}</span></span><button class="icon-btn" data-act="bat-remove" data-index="${i}" aria-label="${esc(t("battery.remove_entry"))}">${ic("delete", "s20")}</button></div>`).join("")}</div>`
        : `<div class="card-content muted">${rec.last_replaced ? th("battery.last_replaced_bn", { date: esc(fmtDate(rec.last_replaced, false)) }) : th("battery.no_replacements")}</div>`}`;
  };

  // Parent per routing scan (end devices only), fetched when the History tab opens; refreshed after a new scan.
  const HOPS = { cache: new Map(), pending: new Set() };
  const HOP_COLORS = ["#26a69a", "#7e57c2", "#ef6c00", "#1e88e5", "#d81b60", "#7cb342", "#8d6e63"];
  const loadHops = async (ieee, last) => {
    if (HOPS.pending.has(ieee)) return;
    HOPS.pending.add(ieee);
    try { HOPS.cache.set(ieee, { at: Date.now(), last, data: await api(`api/parents?ieee=${encodeURIComponent(ieee)}`) }); }
    catch (err) { HOPS.cache.set(ieee, { at: Date.now(), last, error: err.message }); }
    HOPS.pending.delete(ieee);
    if (state.open === ieee && state.moreTab === "history") renderMore();
  };
  const hopsHtml = (d) => {
    if (d.type !== "EndDevice") return "";
    const last = (state.data.scan_times?.[d.instance] || []).slice(-1)[0] || "";
    const c = HOPS.cache.get(d.ieee);
    if (!c || c.last !== last || Date.now() - c.at > 5 * 60_000) loadHops(d.ieee, last);
    if (!c) return `<div class="sub-h">${th("hops.title_plain")}</div><div class="card-content muted">${th("common.loading")}</div>`;
    if (c.error) return `<div class="sub-h">${th("hops.title_plain")}</div><div class="card-content muted">${th("hops.load_failed", { error: esc(c.error) })}</div>`;
    const h = c.data;
    if (!h.scans.length) return `<div class="sub-h">${th("hops.title_plain")}</div><div class="card-content muted">${th("hops.none", { n: h.days })}</div>`;
    const colors = new Map();
    h.scans.slice().reverse().forEach((r) => { if (!colors.has(r.ieee)) colors.set(r.ieee, HOP_COLORS[colors.size % HOP_COLORS.length]); });
    const day = (iso) => intl((l) => new Date(iso).toLocaleDateString(l, { weekday: "short", day: "numeric", month: "short" }));
    const rows = h.scans.map((r) => `<div class="hop"><span class="d" title="${esc(fmtDate(r.at))}">${esc(day(r.at))}</span><span class="p"><span class="dot" style="--c:${colors.get(r.ieee)}"></span><span>${esc(r.name)}${r.lqi !== null && r.lqi !== undefined ? ` · LQI ${esc(r.lqi)}` : ""}</span></span><span class="chg">${r.changed ? th("hops.changed") : ""}</span></div>`).join("");
    const best = h.best && h.parents > 1 ? th("hops.best", { name: `<b>${esc(h.best.name)}</b>`, lqi: esc(h.best.lqi) }) + (h.changes >= h.threshold ? ` ${th("hops.advice")}` : "") : "";
    return `<div class="sub-h">${th("hops.title", { n: h.scans.length })}</div><div>${rows}</div>${best ? `<div class="card-content muted" style="font-size:13px">${best}</div>` : ""}`;
  };

  const tabHistory = (d) => {
    const names = (d.names || []).filter((n) => n.name && !IEEE_RE.test(n.name)).slice().reverse();
    const events = (state.data.events || []).filter((e) => e.ieee === d.ieee).slice(-30).reverse();
    const removed = visible().filter((x) => x.status === "removed" && x.ieee !== d.ieee && !x.successor).sort((a, b) => collator.compare(nameOf(a) || "~", nameOf(b) || "~"));
    let lineage = "";
    if (d.successor) lineage += `<div><span>${th("more.replaced_by", { device: devLink(d.successor) })}</span><button class="btn" data-act="unlink" data-old="${esc(d.ieee)}" data-new="${esc(d.successor)}">${th("common.unlink")}</button></div>`;
    (d.predecessors || []).forEach((p) => { lineage += `<div><span>${th("history.replaces", { device: devLink(p) })}</span><button class="btn" data-act="unlink" data-old="${esc(p)}" data-new="${esc(d.ieee)}">${th("common.unlink")}</button></div>`; });
    const sugg = (d.suggestions || []).map((s) => `<div class="alert" style="--a:var(--info)">${ic("link-variant")}<div class="body">${th("history.possibly_replaces", { name: `<b>${esc(s.name || s.ieee)}</b>`, date: esc(fmtDate(s.removed_at, false) || t("history.earlier")) })}</div><button class="btn" data-act="link" data-old="${esc(s.ieee)}" data-new="${esc(d.ieee)}">${th("common.link")}</button></div>`).join("");
    return `
      <div class="sub-h">${th("history.names")}</div>
      ${names.length ? `<ul class="names">${names.map((n) => { const now = n.name === d.friendly_name && d.status !== "removed"; return `<li class="${now ? "now" : ""}">${ic(now ? "check" : "pencil", "s20")}<div><div class="t1">${esc(n.name)}${now ? ` ${th("history.current")}` : ""}</div><div class="t2">${esc(`${n.from ? fmtDate(n.from, false) : t("common.unknown")} – ${n.until ? fmtDate(n.until, false) : now ? t("history.present") : t("history.unknown_lower")}`)} · ${esc(n.source || "")}</div></div></li>`; }).join("")}</ul>` : `<div class="card-content muted">${th("history.never_named")}</div>`}
      <div class="sub-h">${th("history.replacements")}</div>
      ${sugg ? `<div class="alerts">${sugg}</div>` : ""}
      ${lineage ? `<div class="rep-list">${lineage}</div>` : !sugg ? `<div class="card-content muted">${th("history.not_linked")}</div>` : ""}
      ${d.status !== "removed" && removed.length ? `<div class="row-actions"><select class="field" id="linkSel" style="flex:1;min-width:0"><option value="">${th("history.link_removed")}</option>${removed.map((x) => `<option value="${esc(x.ieee)}">${esc(nameOf(x) || x.ieee)}${x.removed_at ? ` · ${th("history.removed_on", { date: esc(fmtDate(x.removed_at, false)) })}` : ""}</option>`).join("")}</select><button class="btn" data-act="link-sel">${th("common.link")}</button></div>` : ""}
      ${hopsHtml(d)}
      <div class="sub-h">${th("history.logbook")}</div>
      ${events.length ? events.map((e) => { const [icon, color] = EVENT_ICON(e.kind); return `<div class="log" style="cursor:default"><span class="state-ic" style="color:${color}">${ic(icon)}</span><div class="text">${logLine(e)}</div></div>`; }).join("") : `<div class="card-content muted">${th("history.nothing_logged")}</div>`}`;
  };

  // ------------------------------------------------------------ long-range charts (Trends tab)
  const TREND_RANGES = [["24h", "trends.range.24h"], ["7d", "trends.range.7d"], ["30d", "trends.range.30d"], ["90d", "trends.range.90d"]];
  const TREND = { range: TREND_RANGES.some((r) => r[0] === store.get("z2mt.trendRange")) ? store.get("z2mt.trendRange") : "30d", cache: new Map(), pending: new Set() };
  const loadTrend = async (ieee, range) => {
    const key = `${ieee}|${range}`;
    if (TREND.pending.has(key)) return;
    TREND.pending.add(key);
    try { TREND.cache.set(key, { at: Date.now(), data: await api(`api/metrics?ieee=${encodeURIComponent(ieee)}&range=${range}`) }); }
    catch (err) { TREND.cache.set(key, { at: Date.now(), error: err.message }); }
    TREND.pending.delete(key);
    if (state.open === ieee && state.moreTab === "trends") renderMore();
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-trend-range]");
    if (!b) return;
    TREND.range = b.dataset.trendRange;
    store.set("z2mt.trendRange", TREND.range);
    renderMore();
  });
  const CH = { W: 720, H: 180, PAD: 8 };
  // Polyline as a path, broken where readings are missing for longer than `gap` seconds.
  const gapPath = (pts, sx, sy, gap) => pts.map((p, i) => `${i && p[0] - pts[i - 1][0] <= gap ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join("");
  // The plot is inset by CH.PAD at top and bottom so a line at 0 or at the top value isn't drawn on the edge.
  // hover(sx, sy) returns the chart's hover data; marks ([[x, label]]) get a label in a strip above the plot.
  const bigChart = ({ x0, x1, lo, hi, yTicks, xTicks, body, hover = null, marks = [], key = "" }) => {
    const sx = (x) => ((x - x0) / (x1 - x0 || 1)) * CH.W;
    const sy = (y) => CH.PAD + (1 - (y - lo) / (hi - lo || 1)) * (CH.H - 2 * CH.PAD);
    const grid = yTicks.map((v) => `<line x1="0" x2="${CH.W}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="var(--divider)" vector-effect="non-scaling-stroke"/>`).join("");
    const pct = (x) => Math.max(0, Math.min(100, (sx(x) / CH.W) * 100));
    const padTop = marks.length ? 24 : 4;
    const markLabels = marks.map(([x, label]) => { const f = pct(x) / 100; return `<span class="bigchart-mark ${f > 0.85 ? "end" : f < 0.15 ? "start" : ""}" style="left:calc(44px + (100% - 60px) * ${f.toFixed(4)})">${label}</span>`; }).join("");
    return `<div class="bigchart-wrap${marks.length ? " has-marks" : ""}"><svg class="bigchart" viewBox="0 0 ${CH.W} ${CH.H}" preserveAspectRatio="none" aria-hidden="true" ${hover ? hoverAttrs(key, hover(sx, sy)) : ""}>${grid}${body(sx, sy)}</svg>
      ${yTicks.map((v) => `<span class="bigchart-y" style="top:${(padTop + sy(v)).toFixed(0)}px">${v}</span>`).join("")}${markLabels}</div>
      <div class="bigchart-x">${xTicks.map((x, i) => `<span class="${i === 0 ? "first" : i === xTicks.length - 1 ? "last" : ""}" style="left:${pct(x).toFixed(1)}%">${esc(x === "now" ? t("trends.now") : fmtTick(x, x1 - x0))}</span>`).join("")}</div>`;
  };
  const fmtTick = (ts, spanS) => intl((l) => new Date(ts * 1000).toLocaleString(l, spanS <= 2 * 86400 ? { hour: "2-digit", minute: "2-digit" } : { day: "numeric", month: "short" }));
  const evenTicks = (x0, x1, n = 5) => Array.from({ length: n }, (_, i) => x0 + ((x1 - x0) * i) / (n - 1));
  const trendLegend = (items) => `<div class="trend-legend">${items.map(([c, l, extra = ""]) => `<span><i style="background:${c};${extra}"></i>${l}</span>`).join("")}</div>`;

  const lqiChart = (h) => {
    const { line, band } = h.lqi;
    if (line.length < 2) return `<div class="card-content muted">${th("trends.lqi_empty")}</div>`;
    const top = Math.max(...band.map((b) => b[2]), ...line.map((p) => p[1]));
    const hi = Math.min(255, Math.max(100, Math.ceil(top / 50) * 50));
    const yTicks = []; for (let v = 0; v <= hi; v += hi > 150 ? 100 : 50) yTicks.push(v);
    const step = h.range === "24h" || h.range === "7d" ? 3600 : 86400;
    const hourly = step === 3600;
    return bigChart({ x0: h.start, x1: h.end, lo: 0, hi, yTicks, xTicks: evenTicks(h.start, h.end), key: "trend-lqi",
      // Hourly points sit mid-hour and daily ones mid-day, so the heading names the hour or day they cover.
      hover: (sx, sy) => ({ p: line.map(([x, v]) => {
        const day = Math.floor(x / 86400) * 86400, b = band.find((r) => r[0] === day);
        return [pctX(sx(x), CH.W), pctX(sy(v), CH.H), fmtHover(x - (hourly ? 1800 : 43200), hourly), t("chart.lqi", { value: Math.round(v) }),
          ...(b ? [t("chart.lqi_range", { min: Math.round(b[1]), max: Math.round(b[2]) })] : [])];
      }) }),
      body: (sx, sy) => {
        const clampX = (x) => sx(Math.max(h.start, Math.min(h.end, x)));
        // One stepped shape per run of consecutive days, so neighbouring days don't leave seams.
        const runs = [];
        band.forEach((b, i) => { if (i && b[0] - band[i - 1][0] === 86400) runs[runs.length - 1].push(b); else runs.push([b]); });
        const rects = runs.map((run) => {
          const topEdge = run.map(([day, , mx]) => `${clampX(day).toFixed(1)},${sy(mx).toFixed(1)} ${clampX(day + 86400).toFixed(1)},${sy(mx).toFixed(1)}`).join(" ");
          const bottomEdge = run.slice().reverse().map(([day, mn]) => `${clampX(day + 86400).toFixed(1)},${sy(mn).toFixed(1)} ${clampX(day).toFixed(1)},${sy(mn).toFixed(1)}`).join(" ");
          return `M${topEdge} ${bottomEdge}Z`;
        }).join("");
        return `<rect x="0" y="${sy(50).toFixed(1)}" width="${CH.W}" height="${(sy(0) - sy(50)).toFixed(1)}" fill="var(--warning)" fill-opacity="0.05"/>
          <path d="${rects}" fill="var(--primary)" fill-opacity="0.18"/>
          <line x1="0" x2="${CH.W}" y1="${sy(50).toFixed(1)}" y2="${sy(50).toFixed(1)}" stroke="var(--warning)" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
          <path d="${gapPath(line, sx, sy, step * 3)}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
      } });
  };

  const batteryChart = (h, d) => {
    const b = h.battery, pts = b.points;
    if (pts.length < 2) return `<div class="card-content muted">${th("trends.battery_empty")}</div>`;
    const x0 = b.start, histSpan = h.end - x0, last = pts[pts.length - 1];
    // The projection may run past "now" by up to half the history span, so the history stays readable.
    const x1 = b.empty_at ? Math.max(h.end, Math.min(b.empty_at, h.end + histSpan / 2)) : h.end;
    const reps = ((d.battery_record || {}).replacements || []).map((r) => Math.min(Date.parse(`${r.date}T12:00:00Z`) / 1000, h.end)).filter((at) => at >= x0);
    const proj = b.empty_at && b.empty_at > last[0] ? { endX: Math.min(b.empty_at, x1) } : null;
    // Straight line from the latest reading down to 10 % at empty_at.
    const projY = (x) => last[1] - ((last[1] - 10) * (x - last[0])) / (b.empty_at - last[0]);
    return bigChart({ x0, x1, lo: 0, hi: 100, yTicks: [0, 25, 50, 75, 100], xTicks: x1 > h.end ? [...evenTicks(x0, h.end, 4), x1] : evenTicks(x0, h.end), key: "trend-bat",
      marks: reps.map((at) => [at, `${ic("battery-sync")}${th("trends.replaced")}`]),
      hover: (sx, sy) => {
        const p = pts.map(([x, v]) => [pctX(sx(x), CH.W), pctX(sy(v), CH.H), fmtHover(x, false), t("chart.battery", { value: Math.round(v) })]);
        if (proj) for (let k = 1; k <= 12; k++) {
          const x = last[0] + ((proj.endX - last[0]) * k) / 12, v = projY(x);
          p.push([pctX(sx(x), CH.W), pctX(sy(v), CH.H), fmtHover(x, false), t("chart.projected", { value: Math.round(v) })]);
        }
        const m = reps.map((at) => [pctX(sx(at), CH.W), t("trends.replaced_on", { date: fmtDate(at, false) })]);
        if (proj && b.empty_at <= x1) m.push([pctX(sx(b.empty_at), CH.W), t("trends.reaches_10_on", { date: fmtDate(b.empty_at, false) })]);
        return { c: "var(--success)", p, m };
      },
      body: (sx, sy) => {
        let projLine = "";
        if (proj) {
          projLine = `<line x1="${sx(last[0]).toFixed(1)}" y1="${sy(last[1]).toFixed(1)}" x2="${sx(proj.endX).toFixed(1)}" y2="${sy(projY(proj.endX)).toFixed(1)}" stroke="var(--text-2)" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`;
          if (b.empty_at <= x1) projLine += `<line x1="${sx(b.empty_at).toFixed(1)}" x2="${sx(b.empty_at).toFixed(1)}" y1="0" y2="${CH.H}" stroke="var(--text-2)" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>`;
        }
        const now = x1 > h.end ? `<line x1="${sx(h.end).toFixed(1)}" x2="${sx(h.end).toFixed(1)}" y1="0" y2="${CH.H}" stroke="var(--divider)" stroke-width="2" vector-effect="non-scaling-stroke"/>` : "";
        // Replacements are events, not readings: thin, dashed and faded, with a labelled icon above the plot.
        const marks = reps.map((at) => `<line x1="${sx(at).toFixed(1)}" x2="${sx(at).toFixed(1)}" y1="0" y2="${CH.H}" stroke="var(--state-icon)" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`).join("");
        // Readings get round dots (zero-length round-capped strokes stay round in the stretched plot):
        // every reading when there are few, otherwise the latest one, so a short or flat line still shows.
        const dots = (pts.length <= 14 ? pts : [last]).map(([x, v]) => `M${sx(x).toFixed(1)},${sy(v).toFixed(1)}h0`).join("");
        return `${now}${marks}${projLine}<path d="${gapPath(pts, sx, sy, 3 * 86400)}" fill="none" stroke="var(--success)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          <path d="${dots}" stroke="var(--success)" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
      } });
  };

  const tabTrends = (d) => {
    const key = `${d.ieee}|${TREND.range}`;
    const c = TREND.cache.get(key);
    if (!c || Date.now() - c.at > 5 * 60_000) loadTrend(d.ieee, TREND.range);
    const label = t(TREND_RANGES.find((r) => r[0] === TREND.range)[1]);
    const chips = `<div class="trend-head"><div class="chips">${TREND_RANGES.map(([k, l]) => `<button class="chip" data-trend-range="${k}" aria-pressed="${TREND.range === k}">${th(l)}</button>`).join("")}</div></div>`;
    if (!c) return `${chips}<div class="card-content muted">${th("common.loading")}</div>`;
    if (c.error) return `${chips}<div class="card-content muted">${th("trends.load_failed", { error: esc(c.error) })}</div>`;
    const h = c.data, isBat = !!d.battery_record || typeof d.battery === "number";
    const tm = h.lqi.trend_month, b = h.battery;
    const trend = tm === null || tm === undefined ? "—" : Math.abs(tm) < 1 ? t("trends.steady") : t("trends.per_month", { value: `${tm > 0 ? "+" : "−"}${Math.abs(Math.round(tm))}` });
    const empty = b.estimate_days === null || b.estimate_days === undefined ? "—" : b.estimate_days <= 0 ? t("trends.now") : intl((l) => new Date(b.empty_at * 1000).toLocaleDateString(l, { month: "short", year: "numeric" }));
    const stats = [[t("trends.lqi_avg", { range: label }), h.lqi.avg === null ? "—" : Math.round(h.lqi.avg)], [t("trends.lqi_trend"), trend, tm !== null && tm <= -5 ? "var(--warning-text)" : ""],
      ...(isBat ? [[t("trends.battery_drain"), b.drain_month === null ? "—" : t("trends.percent_per_month", { value: b.drain_month < 1 ? b.drain_month.toFixed(1) : Math.round(b.drain_month) })], [t("trends.reaches_10"), empty, b.estimate_days !== null && b.estimate_days <= 30 ? "var(--error)" : ""]] : [])];
    const batLabel = th(TREND.range === "24h" ? "trends.battery_7d" : "trends.battery");
    return `${chips}
      <div class="sub-h">${th("trends.lqi_title")}</div>
      ${lqiChart(h)}
      ${trendLegend([["var(--primary)", th(h.range === "24h" || h.range === "7d" ? "trends.hourly_avg" : "trends.daily_avg")], ["var(--primary)", th("trends.daily_range"), "opacity:.3;height:8px;vertical-align:0"], ["var(--warning)", th("trends.weak")]])}
      ${pingChart(d)}
      ${isBat ? `<div class="sub-h">${batLabel}</div>${batteryChart(h, d)}${trendLegend([["var(--success)", th("trends.battery_pct")], ["var(--text-2)", th("trends.projection")], ["var(--state-icon)", th("trends.replaced"), "background:repeating-linear-gradient(90deg,var(--state-icon) 0 4px,transparent 4px 7px);opacity:.8"]])}` : ""}
      <div class="trend-stats-wrap"><div class="trend-stats" style="--n:${stats.length}">${stats.map(([k, v, color]) => `<div><small>${esc(k)}</small><b${color ? ` style="color:${color}"` : ""}>${esc(v)}</b></div>`).join("")}</div></div>
      ${isBat && (b.estimate_days === null || b.estimate_days === undefined) ? `<div class="card-content muted" style="font-size:13px">${th("trends.estimate_needs")}</div>` : ""}`;
  };

  const tabAsset = (d) => {
    const a = d.asset || {};
    const f = (k, key, type = "text", cls = "") => `<label class="${cls}">${th(key)}<input class="field" name="${k}" type="${type}" value="${esc(a[k] || "")}" autocomplete="off"></label>`;
    return `
      <div class="sub-h">${th("asset.title")}</div>
      <form class="form" id="assetForm" onsubmit="return false">${f("location", "asset.location", "text", "wide")}${f("purchase_date", "asset.purchased", "date")}${f("warranty_until", "asset.warranty", "date")}${f("shop", "asset.shop")}${f("price", "asset.price")}${f("serial", "asset.serial", "text", "wide")}</form>
      <div class="row-actions"><button class="btn" data-act="save-asset">${th("common.save")}</button><span class="saved" id="savedAsset">${th("common.saved")}</span></div>
      <div class="sub-h">${th("asset.notes")}</div>
      <div class="form"><label class="wide"><textarea class="field" id="note" placeholder="${esc(t("asset.note_placeholder"))}">${esc(d.note || "")}</textarea></label></div>
      <div class="row-actions"><button class="btn" data-act="save-note">${th("asset.save_note")}</button><span class="saved" id="savedNote">${th("common.saved")}</span><span class="spacer"></span><button class="btn danger" data-act="forget">${ic("delete", "s18")}${th("asset.forget")}</button></div>
      <div class="card-content muted" style="font-size:12px">${th("asset.sources", { sources: esc((d.sources || []).join(" · ") || "—") })}</div>`;
  };

  const moreHtml = (d) => {
    const isBat = !!d.battery_record || typeof d.battery === "number";
    const tabs = [["info", "more.tab.info"], ["health", "more.tab.health"], ["trends", "more.tab.trends"], ["history", "more.tab.history"], ...(isBat ? [["battery", "more.tab.battery"]] : []), ["asset", "more.tab.notes"]];
    if (!tabs.find((t) => t[0] === state.moreTab)) state.moreTab = "info";
    const fn = { info: tabInfo, health: tabHealth, history: tabHistory, trends: tabTrends, battery: tabBattery, asset: tabAsset }[state.moreTab];
    const name = nameOf(d);
    return `
      <div class="more-head"><button class="icon-btn" data-act="close" aria-label="${esc(t("common.close"))}">${ic("close")}</button>
        <div class="titles"><h2 id="moreTitle" class="${name ? "" : "unknown"}">${esc(name || t("devices.unnamed"))}</h2><small>${esc([d.area, t("net.network", { name: netLabel(d.instance) })].filter(Boolean).join(" · "))}</small></div>
        ${d.critical && d.status !== "removed" ? critTag() : ""}
        <button class="icon-btn" data-act="copy" data-ieee="${esc(d.ieee)}" aria-label="${esc(t("more.copy_ieee"))}" title="${esc(t("more.copy", { ieee: d.ieee }))}">${ic("content-copy")}</button></div>
      <nav class="more-tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.moreTab === k}">${th(l)}</button>`).join("")}</nav>
      <div class="more-body">${fn(d)}</div>`;
  };
  const renderMore = (fresh = false, fromList = false) => {
    const dlg = $("#more");
    const d = state.byIeee.get(state.open);
    if (usePane()) {
      if (dlg.open) { state.keepOpen = true; dlg.close(); state.keepOpen = false; }
      const pane = $("#pane");
      if (!pane) return;
      if (!d) { pane.innerHTML = `<div class="pane-empty">${ic("zigbee")}<b>${th("more.select")}</b>${th("more.select_text")}<div class="muted" style="margin-top:12px;font-size:13px">${th("more.select_keys")}</div></div>`; return; }
      if (!fresh && state.editing && pane.contains(document.activeElement)) return;
      const keep = !fromList && pane.querySelector(".more-body") ? pane.querySelector(".more-body").scrollTop : state.paneScroll || 0;
      pane.innerHTML = moreHtml(d);
      pane.querySelector(".more-body").scrollTop = fresh && !fromList ? 0 : keep;
      state.editing = false;
      return;
    }
    if (!d) { if (dlg.open) dlg.close(); return; }
    if (!fresh && state.editing && dlg.contains(document.activeElement)) return;
    const body = dlg.querySelector(".more-body");
    const keep = !fresh && body ? body.scrollTop : 0;
    dlg.innerHTML = moreHtml(d);
    dlg.querySelector(".more-body").scrollTop = keep;
    state.editing = false;
    if (!dlg.open) dlg.showModal();
  };
  const markSelected = () => document.querySelectorAll(".dt tbody tr[data-open]").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.open === state.open)));
  const openDevice = (ieee, tab) => {
    if (state.open !== ieee) { state.moreTab = tab || state.moreTab || "info"; state.paneScroll = 0; }
    state.open = ieee;
    history.replaceState(null, "", `#${encodeURIComponent(ieee)}`);
    if (usePane() && state.view !== "devices") { state.view = "devices"; state.settingsShown = false; render(); window.scrollTo(0, 0); }
    renderMore(true);
    markSelected();
    if (usePane()) document.querySelector(`.dt tr[data-open="${CSS.escape(ieee)}"]`)?.scrollIntoView({ block: "nearest" });
  };
  const closeDevice = () => { state.open = null; history.replaceState(null, "", location.pathname + location.search); const dlg = $("#more"); if (dlg.open) dlg.close(); if (usePane()) { renderMore(true); markSelected(); } };
  const moveSelection = (delta) => {
    const rows = [...document.querySelectorAll(".dt tbody tr[data-open]")];
    if (!rows.length) return;
    let i = rows.findIndex((r) => r.dataset.open === state.open);
    i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + delta));
    openDevice(rows[i].dataset.open);
  };
  $("#more").addEventListener("close", () => { if (state.open && !state.keepOpen) { state.open = null; history.replaceState(null, "", location.pathname + location.search); } });
  $("#more").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeDevice(); });
  document.addEventListener("change", async (e) => {
    if (e.target.id !== "critSw") return;
    const ieee = e.target.dataset.ieee, critical = e.target.checked;
    try {
      await api("api/critical", { ieee, critical });
      const d = state.byIeee.get(ieee); if (d) d.critical = critical || undefined;
      snack(t(critical ? "snack.critical_on" : "snack.critical_off"));
      renderMore(true); load();
    } catch (err) { e.target.checked = !critical; snack(err.message); }
  });
  $("#more").addEventListener("input", () => { state.editing = true; });
  $("#view").addEventListener("input", (e) => { if (e.target.closest("#pane")) state.editing = true; });
  $("#view").addEventListener("scroll", (e) => { if (e.target.classList?.contains("more-body")) state.paneScroll = e.target.scrollTop; }, true);

  // ------------------------------------------------------------ confirm dialog
  const confirmDialog = ({ title, html, ok, danger = false, filled = false }) => new Promise((resolve) => {
    const dlg = $("#confirmDlg");
    if (dlg.open) { resolve(false); return; }

  const otaVer = (v) => (v === null || v === undefined || v === -1 || v === "" ? "—" : String(v));
  const otaWin = (w) => String(w || "").replace("-", "–");
  // The app sends English reasons; translate the ones it can send, keep anything else as it came.
  const OTA_REASONS = [[/^Battery below (\d+)%$/, "battery_below", "limit"], [/^Battery is low$/, "battery_low"], [/^Device is not active in Zigbee2MQTT$/, "not_active"],
    [/^Device is offline$/, "offline"], [/^No update available$/, "no_update"], [/^Already queued$/i, "already_queued"]];
  const otaReason = (text) => {
    const s = String(text || "");
    for (const [re, key, name] of OTA_REASONS) { const m = s.match(re); if (m) return t(`ota.reason.${key}`, name ? { [name]: m[1] } : undefined); }
    return s;
  };
  const loadOta = async () => {
    state.otaAt = Date.now();
    try { state.ota = await api("api/ota"); } catch (err) { snack(err.message, 4000); }
    if (state.view === "updates") renderUpdates();
  };
  const otaStatus = (d) => {
    const O = state.ota || {}, s = O.status?.[d.ieee], u = d.update || {};
    if (u.state === "updating") {
      const p = typeof u.progress === "number" ? Math.round(u.progress) : null;
      return [`<span class="st" style="--c:var(--primary)">${p !== null ? th("ota.updating_pct", { p }) : th("ota.updating")}</span>${u.remaining ? `<div class="muted" style="font-size:12px">${th("ota.time_left", { time: esc(span(u.remaining)) })}</div>` : ""}<div class="bar"><i style="width:${Math.max(2, Math.min(100, p || 0))}%"></i></div>`, ""];
    }
    if (s?.state === "queued") return [`<span class="st" style="--c:var(--text-2)">${th("ota.queued")}</span>`, `<button class="btn" data-act="ota-cancel" data-ieee="${esc(d.ieee)}">${th("common.cancel")}</button>`];
    if (s?.state === "updating") return [`<span class="st" style="--c:var(--primary)">${th("ota.starting")}</span>`, ""];
    if (u.state !== "available") return [`<span class="st" style="--c:var(--success)">${th("ota.up_to_date")}</span>`, ""];
    const fails = O.failures?.[d.ieee] || 0;
    if (s?.state === "failed" || (fails && !s)) {
      const reason = s?.reason || (O.history || []).find((h) => h.ieee === d.ieee && h.result !== "ok")?.error;
      const auto = O.window && O.window_valid;
      const label = th(fails > (O.auto_retries ?? 1) ? "ota.failed_twice" : auto ? "ota.failed_tonight" : "ota.failed");
      return [`<span class="st" style="--c:var(--error)">${label}</span>${reason ? `<div class="muted" style="font-size:12px">${esc(otaReason(reason))}</div>` : ""}`, `<button class="btn" data-act="ota-now" data-ieee="${esc(d.ieee)}" data-force="1">${th("ota.retry")}</button>`];
    }
    const block = s?.state === "skipped" ? s.reason : O.battery_blocked?.[d.ieee];
    if (block) {
      const force = /battery/i.test(block);
      return [`<span class="st" style="--c:var(--warning)">${th("ota.skipped", { reason: esc(otaReason(block)) })}</span>`, force || s?.state === "skipped" ? `<button class="btn" data-act="ota-now" data-ieee="${esc(d.ieee)}" data-force="1">${th(force ? "ota.update_anyway" : "ota.try_again")}</button>` : ""];
    }
    const label = th(O.window && O.window_valid ? (O.window_open ? "ota.next_tonight" : "ota.queued_tonight") : "ota.ready");
    return [`<span class="st" style="--c:var(--text-2)">${label}</span>`, `<button class="btn" data-act="ota-now" data-ieee="${esc(d.ieee)}">${th("ota.update_now")}</button>`];
  };
  const renderUpdates = () => {
    const O = state.ota;

    const avail = list.filter((d) => ["available", "updating"].includes(d.update?.state)).length;
    const ready = list.filter((d) => d.update?.state === "available" && !O.status?.[d.ieee] && !O.battery_blocked?.[d.ieee]).length;

    const sched = !O.window ? th("ota.window_off") : !O.window_valid ? th("ota.window_invalid", { window: esc(O.window) }) : O.window_open ? th("ota.window_running", { time: esc(O.window.split("-")[1]) }) : th(when || "ota.next_run", { window: esc(otaWin(O.window)) });

  // ------------------------------------------------------------ pairing assistant
  const loadAreas = async () => { if (state.areas) return; try { state.areas = (await api("api/areas")).areas; } catch (e) { state.areas = null; } };

      return;
    }
    if (e.target.closest("[data-maplinks]")) { MAP.allLinks = !MAP.allLinks; store.set("z2mt.mapAll", MAP.allLinks ? "1" : "0"); renderMap(true); return; }
    const mc = e.target.closest("[data-mapclose]"); if (mc) { MAP.sims[mc.dataset.mapclose]?.select(null); return; }
    const ms = e.target.closest("[data-mapsel]"); if (ms) { e.preventDefault(); MAP.sims[ms.dataset.net]?.select(ms.dataset.mapsel); document.getElementById(`map-${ms.dataset.net}`)?.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    const pf = e.target.closest("[data-pausefor]");
    if (pf) { pf.parentElement.querySelectorAll("[data-pausefor]").forEach((c) => c.setAttribute("aria-pressed", String(c === pf))); return; }
    const act = e.target.closest("[data-act]");
    if (act && actions[act.dataset.act]) { e.preventDefault(); closeMenu(); actions[act.dataset.act](act); return; }
    if (e.target.closest("#menu a")) { closeMenu(); return; }
    const tab = e.target.closest("[data-tab]");
    if (tab) { state.moreTab = tab.dataset.tab; renderMore(true); return; }
    const open = e.target.closest("[data-open]");
    if (open) { e.preventDefault(); openDevice(open.dataset.open); return; }
    const view = e.target.closest("[data-view]");
    if (view) { if ($("#more").open) closeDevice(); go(view.dataset.view); return; }
    const chip = e.target.closest("[data-chip]");
    if (chip) { state.chip = chip.dataset.chip; state.view = "devices"; render(); return; }
    const th = e.target.closest("th[data-sort]");
    if (th) { const k = th.dataset.sort; if (state.sort === k) state.dir = -sortDir(); else { state.sort = k; state.dir = 0; } store.set("z2mt.sort", state.sort); store.set("z2mt.dir", String(state.dir)); renderDevices(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !menu.hidden) { closeMenu(); return; }
    if (e.key === "Enter" && e.target.matches("tr[data-open]")) { openDevice(e.target.dataset.open); return; }
    if (e.key === "Enter" && e.target.matches("#stockType, #stockN")) { e.preventDefault(); actions["stock-add"](); return; }
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
    if (!typing && usePane() && state.view === "devices" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); moveSelection(e.key === "ArrowDown" ? 1 : -1); return; }
    if (e.key === "Escape" && usePane() && state.open && !typing && !$("#confirmDlg").open) { closeDevice(); return; }
    if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) && !$("#more").open) { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
  });
  $("#view").addEventListener("change", async (e) => {
    const sc = e.target.closest("[data-mapscan], [data-mapcmp]");
    if (sc) {
      const bt = sc.dataset.mapscan || sc.dataset.mapcmp;
      await loadScanHistory(bt);
      if (sc.dataset.mapscan !== undefined) { MAP.scanSel[bt] = sc.value || null; MAP.cmpSel[bt] = null; } else MAP.cmpSel[bt] = sc.value || null;
      delete (MAP.pos || {})[bt];
      renderMap(true);
      return;
    }
    if (state.view !== "settings") return;
    const el = e.target;
    if (el.dataset.set) saveSettings({ [el.dataset.set]: el.checked });
    else if (el.dataset.num) {
      const v = Number(el.value);
      if (!Number.isFinite(v) || v < Number(el.min) || v > Number(el.max)) { snack(t("settings.number_range", { min: el.min, max: el.max })); el.value = state.settings.settings[el.dataset.num]; return; }
      saveSettings({ [el.dataset.num]: Math.round(v) });
    } else if (el.id === "scanHour") saveSettings({ networkmap_hour: Number(el.value) });
    else if (el.id === "themeSel") { theme = el.value; store.set("z2mt.theme", theme); applyTheme(); }
    else if (el.id === "langSel") { store.set("z2mt.lang", el.value); location.reload(); }
    else if (el.id === "sumDay") saveSettings({ summary_day: Number(el.value) });
    else if (el.id === "sumHour") saveSettings({ summary_hour: Number(el.value) });
    else if (el.id === "quietStart" || el.id === "quietEnd") { if (/^\d\d:\d\d$/.test(el.value)) saveSettings({ [el.id === "quietStart" ? "quiet_start" : "quiet_end"]: el.value }); }
    else if (el.id === "restoreFile" && el.files?.[0]) {
      const file = el.files[0];
      el.value = "";
      confirmDialog({ title: t("restore.title"), ok: t("common.restore"), danger: true, html: `<p>${th("restore.text", { file: `<b>${esc(file.name)}</b>` })}</p>` }).then(async (ok) => {
        if (!ok) return;
        try { const body = JSON.parse(await file.text()); const r = await api("api/restore", body); snack(t("restore.done", { devices: r.devices, events: r.events }), 4000); load(); }
        catch (err) { snack(err instanceof SyntaxError ? t("restore.bad_json") : err.message, 5000); }
      });
    }
    else if (el.id === "layoutSel") { state.layout = el.value; store.set("z2mt.layout", el.value); snack(el.value === "pane" ? t("settings.layout_pane") : t("settings.layout_dialog")); }
    else if (el.dataset.checksel) {
      const s = state.settings.settings;
      const disabled = new Set(s.disabled_checks || []), notify = new Set(s.notify_checks || []);
      const key = el.dataset.checksel, val = el.value;
      if (val === "off") { notify.delete(key); if (el.dataset.event !== "1") disabled.add(key); }
      else if (val === "show") { disabled.delete(key); notify.delete(key); }
      else { disabled.delete(key); notify.add(key); }
      saveSettings({ disabled_checks: [...disabled], notify_checks: [...notify] });
    }
  });
  window.addEventListener("hashchange", () => { const h = decodeURIComponent(location.hash.slice(1)); if (IEEE_RE.test(h) && h !== state.open) openDevice(h); });

  // Deep links from the dashboard cards: /app/<slug>/<ieee>. HA's app panel passes the route
  // tail to the iframe once it subscribes to properties.
  if (window.parent !== window) {
    let routed = null;
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.data?.type !== "home-assistant/properties") return;
      const ieee = decodeURIComponent(String(e.data.route?.path || "").replace(/^\//, "").split("/")[0]);
      if (!IEEE_RE.test(ieee)) { routed = null; return; }
      if (ieee === routed) return;
      routed = ieee;
      let tries = 0;
      const open = () => { if (state.byIeee?.has(ieee)) openDevice(ieee); else if (++tries < 20) setTimeout(open, 500); };
      open();
    });
    window.parent.postMessage({ type: "home-assistant/subscribe-properties" }, "*");
  }

  (async () => {
    await loadI18n();
    translateStatic();
    applyTheme();
    await load();
    const h = decodeURIComponent(location.hash.slice(1));
    if (IEEE_RE.test(h) && state.byIeee.has(h)) openDevice(h);
  })();
  setInterval(poll, 5000);
  setInterval(load, 60000);
})();
</script>
</body>
</html>

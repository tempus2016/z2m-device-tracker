configuration:
  base_topics:
    name: Базовые топики Zigbee2MQTT
    description: Базовый топик MQTT каждого экземпляра Zigbee2MQTT для отслеживания.
  z2m_panels:
    name: Ссылки на приложения Zigbee2MQTT
    description: "Ссылки на каждое приложение Zigbee2MQTT в виде base_topic=app_slug, например zigbee2mqtt=45df7312_zigbee2mqtt. Slug есть в URL приложения."
  alerts_enabled:
    name: Оповещения
    description: Главный переключатель оповещений.
  persistent_notifications:
    name: Уведомления Home Assistant
    description: Показывать оповещения как уведомления Home Assistant.
  fire_events:
    name: Создавать события
    description: Создавать события z2m_tracker_alert для автоматизаций.
  notify_service:
    name: Служба уведомлений
    description: Также отправлять оповещения в службу уведомлений, например notify.mobile_app_phone.
  alert_on_join:
    name: Оповещать о подключении
    description: Оповещать, когда подключается новое устройство.
  disabled_checks:
    name: Отключённые проверки
    description: Проверки состояния, которые полностью отключены.
  notify_checks:
    name: Проверки с оповещением
    description: Проверки состояния, которые отправляют оповещения.
  offline_alert_minutes:
    name: Задержка оповещения «не в сети» (минуты)
    description: Сколько устройство должно быть не в сети до оповещения.
  frozen_alert_hours:
    name: Задержка для застывших показаний (часы)
    description: Сколько показание датчика должно не меняться, чтобы считаться застывшим.
  battery_alert_percent:
    name: Низкий заряд батареи (%)
    description: Уровень заряда для оповещения о низком заряде.
  networkmap_hour:
    name: Час сканирования маршрутов
    description: Час ночного сканирования маршрутов или -1, чтобы отключить его.
  ha_entities:
    name: Датчики трекера
    description: Добавлять датчики трекера к каждому устройству Zigbee2MQTT через MQTT discovery.
  weekly_summary:
    name: Еженедельная сводка
    description: Отправлять уведомление с еженедельной сводкой.
  summary_day:
    name: День сводки
    description: День отправки еженедельной сводки (0 = понедельник).
  summary_hour:
    name: Час сводки
    description: Час отправки еженедельной сводки.
  wifi_channels:
    name: Каналы Wi-Fi
    description: Ваши каналы Wi-Fi 2,4 ГГц, например 1, 6. Нужны для проверки радиоканала.
  chatty_per_hour:
    name: Порог болтливости (сообщений в час)
    description: Число сообщений в час (в среднем за 6 часов), выше которого устройство считается болтливым.
  ota_window:
    name: Окно автоматических обновлений
    description: "Интервал для автоматических обновлений прошивки, например 02:00-05:00 (местное время, может переходить через полночь). Пустое значение отключает автоматические обновления. Неудачное обновление повторяется один раз следующей ночью."
  ota_min_battery:
    name: Минимальный заряд для обновлений (%)
    description: Устройства на батарейках с зарядом ниже этого уровня пропускаются при автоматических и массовых обновлениях. «Всё равно обновить» отменяет это для одного устройства.

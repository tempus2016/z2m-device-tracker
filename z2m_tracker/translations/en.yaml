configuration:
  base_topics:
    name: Zigbee2MQTT base topics
    description: MQTT base topic of each Zigbee2MQTT instance to track.
  z2m_panels:
    name: Zigbee2MQTT app links
    description: Links to each Zigbee2MQTT app, as base_topic=app_slug, e.g. zigbee2mqtt=45df7312_zigbee2mqtt. The slug is in the app's URL.
  alerts_enabled:
    name: Alerts
    description: Master switch for alerts.
  persistent_notifications:
    name: Home Assistant notifications
    description: Show alerts as Home Assistant notifications.
  fire_events:
    name: Fire events
    description: Fire z2m_tracker_alert events for automations.
  ha_repairs:
    name: Show problems in HA Repairs
    description: With the integration installed, list problems in Settings > Repairs, such as critical devices offline, offline networks and coordinator backup problems. Each one closes itself when fixed.
  notify_service:
    name: Notify service
    description: Also send alerts to a notify service, e.g. notify.mobile_app_phone.
  alert_actions:
    name: Buttons on phone alerts
    description: Add Mute 24 h, Ping and Battery replaced buttons to alerts sent to the notify service, and open the device in the Zigbee Tracker when the alert is tapped.
  alert_on_join:
    name: Alert on join
    description: Alert when a new device joins.
  disabled_checks:
    name: Disabled checks
    description: Health checks to turn off completely.
  notify_checks:
    name: Checks that alert
    description: Health checks that send alerts.
  offline_alert_minutes:
    name: Offline alert delay (minutes)
    description: How long a device must be offline before an alert.
  critical_offline_minutes:
    name: Critical device offline delay (minutes)
    description: The same for devices marked Critical device on their Info tab.
  frozen_alert_hours:
    name: Frozen reading delay (hours)
    description: How long a sensor reading must stay the same before it counts as frozen.
  battery_alert_percent:
    name: Low battery level (%)
    description: Battery level for a low battery alert.
  networkmap_hour:
    name: Routing scan hour
    description: Hour of the nightly routing scan, or -1 to turn it off.
  networkmap_timeout_minutes:
    name: Routing scan time limit (minutes)
    description: How long to wait for Zigbee2MQTT to finish a routing scan. Raise it for large networks.
  ha_entities:
    name: Tracker sensors
    description: Add tracker sensors to each Zigbee2MQTT device via MQTT discovery.
  weekly_summary:
    name: Weekly summary
    description: Send a weekly summary notification.
  summary_day:
    name: Summary day
    description: Day to send the weekly summary (0 = Monday).
  summary_hour:
    name: Summary hour
    description: Hour to send the weekly summary.
  wifi_channels:
    name: Wi-Fi channels
    description: Your 2.4 GHz Wi-Fi channels, e.g. 1, 6, used for the radio channel check.
  chatty_per_hour:
    name: Chatty threshold (messages an hour)
    description: Messages an hour (averaged over 6 hours) above which a device is flagged as chatty.
  ota_window:
    name: Automatic update window
    description: Time window for automatic firmware updates, e.g. 02:00-05:00 (local time, may cross midnight). Empty turns automatic updates off. A failed update is retried once, the next night.
  ota_min_battery:
    name: Minimum battery for updates (%)
    description: Battery devices below this level are skipped by automatic and bulk updates. Update anyway overrides it for one device.
  quiet_hours:
    name: Quiet hours
    description: Hold alerts during quiet hours and send one summary when they end.
  quiet_start:
    name: Quiet hours start
    description: Start of quiet hours in the app's time zone, as HH:MM.
  quiet_end:
    name: Quiet hours end
    description: End of quiet hours, as HH:MM. The window can cross midnight.
  escalate_enabled:
    name: Escalate unanswered alerts
    description: If nobody mutes, pings or fixes a problem in time, send its alert again to a second notify service. Each problem escalates once.
  escalate_hours:
    name: Escalate after (hours)
    description: How long an alert can go unanswered before it escalates.
  escalate_service:
    name: Escalation notify service
    description: The second notify service, e.g. notify.mobile_app_partner_phone.
  escalate_critical_only:
    name: Escalate critical devices only
    description: Only escalate alerts for devices marked Critical device.
  naming_pattern:
    name: Naming pattern
    description: Pattern for device names, built from tokens in curly braces - area, type, model and n (a number that keeps names unique). Fills in the name of new devices when pairing and drives the Naming check. Empty turns it off.
  battery_shop_url:
    name: Battery shop link
    description: Store search address with {type} where the battery type goes, e.g. https://www.amazon.co.uk/s?k={type}. Adds a cart button to each battery you need to buy. Empty hides the buttons.
  retained_autoclear:
    name: Clear old retained topics after a rename
    description: After a device is renamed, delete the retained messages the broker still keeps under its old name. Off lists them on Network → Broker for you to clear.
  broker_stats:
    name: Read broker statistics
    description: Subscribe to Mosquitto's $SYS/broker/# topics to show clients, retained messages, dropped messages, uptime and message rates on Network → Broker.
  impossible_temp_min:
    name: Lowest believable temperature (°C)
    description: A temperature below this counts as an impossible reading.
  impossible_temp_max:
    name: Highest believable temperature (°C)
    description: A temperature above this counts as an impossible reading.
  humidity_stuck_hours:
    name: Humidity stuck delay (hours)
    description: How long humidity must stay at exactly 0 or 100% before it counts as stuck.
  mqtt_host:
    name: MQTT broker address
    description: Your MQTT broker, if it isn't the Mosquitto broker app. Empty uses the broker Home Assistant offers.
  mqtt_port:
    name: MQTT broker port
    description: Port of that broker. Usually 1883, or 8883 with TLS.
  mqtt_user:
    name: MQTT username
    description: Login for that broker. Leave empty if it allows anonymous connections.
  mqtt_password:
    name: MQTT password
    description: Password for that broker.
  mqtt_ssl:
    name: MQTT over TLS
    description: Connect to that broker over TLS.
  mqtt_ssl_verify:
    name: Check TLS certificate
    description: Check the broker's TLS certificate. Turn off for a self-signed certificate.
  metrics_token:
    name: Prometheus metrics token
    description: Set a token of 16 or more characters to serve Prometheus metrics on port 9099. Empty keeps it off.
  community_ratings_fetch:
    name: Fetch community ratings
    description: Download the newest community device ratings from GitHub once a day. Off uses the copy that comes with the app.
